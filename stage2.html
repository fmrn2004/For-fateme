<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>یک سؤال...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap"
rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#070508;
}

body{
    font-family:Vazirmatn,sans-serif;
    color:#fff;
}


/* =========================================================
   MAIN SCENE
========================================================= */

.page{

    position:relative;

    width:100%;
    height:100dvh;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:

        radial-gradient(
            circle at 50% 40%,
            rgba(120,8,48,.25),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(95,8,45,.18),
            transparent 55%
        ),

        linear-gradient(
            180deg,
            #080509 0%,
            #0d070c 48%,
            #090609 100%
        );

}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

.ambient{

    position:absolute;

    width:480px;
    height:480px;

    left:50%;
    top:46%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(218,45,105,.17) 0%,
            rgba(153,18,67,.09) 32%,
            transparent 70%
        );

    filter:blur(55px);

    animation:
        ambientBreath 6s ease-in-out infinite;

    pointer-events:none;

}


/* =========================================================
   SECONDARY LIGHT
========================================================= */

.ambient::before{

    content:"";

    position:absolute;

    width:240px;
    height:240px;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,80,140,.12),
            transparent 70%
        );

    filter:blur(30px);

}


/* =========================================================
   PARTICLES
========================================================= */

.particles{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    opacity:.8;

}

.particle{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#ffdce9;

    box-shadow:
        0 0 6px rgba(255,130,175,.8);

    animation:
        particleFloat var(--duration) ease-in-out infinite;

    animation-delay:var(--delay);

    opacity:var(--opacity);

}


/* =========================================================
   SPIDER AREA
========================================================= */

.spider-stage{

    position:absolute;

    left:50%;
    top:0;

    width:260px;
    height:390px;

    transform:translateX(-50%);

    z-index:8;

    pointer-events:none;

}


/* =========================================================
   MAIN THREAD
========================================================= */

.main-thread{

    position:absolute;

    top:-5px;
    left:50%;

    width:2px;
    height:260px;

    transform:translateX(-50%) scaleY(0);

    transform-origin:top center;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.05),
            rgba(255,205,225,.5) 35%,
            rgba(255,130,180,.32) 70%,
            transparent
        );

    box-shadow:
        0 0 8px rgba(255,120,175,.3);

    animation:
        threadAppear 2s cubic-bezier(.22,.8,.25,1) .2s forwards;

}


/* =========================================================
   THREAD LIGHT
========================================================= */

.thread-light{

    position:absolute;

    left:50%;
    top:30px;

    width:5px;
    height:5px;

    margin-left:-2px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 5px #fff,
        0 0 13px rgba(255,90,150,.9),
        0 0 25px rgba(255,50,120,.45);

    opacity:0;

    animation:
        threadSpark 2.6s linear 1.8s infinite;

}


/* =========================================================
   WEB RINGS
========================================================= */

.web-ring{

    position:absolute;

    left:50%;

    border:1px solid rgba(255,180,210,.09);

    border-radius:50%;

    transform:translateX(-50%);

    opacity:0;

    animation:
        ringReveal 1.5s ease forwards;

}

.web-ring.r1{
    top:35px;
    width:65px;
    height:45px;
    animation-delay:.65s;
}

.web-ring.r2{
    top:70px;
    width:120px;
    height:78px;
    animation-delay:.8s;
}

.web-ring.r3{
    top:108px;
    width:180px;
    height:115px;
    animation-delay:.95s;
}

.web-ring.r4{
    top:145px;
    width:225px;
    height:145px;
    animation-delay:1.1s;
}


/* =========================================================
   WEB RADIAL THREADS
========================================================= */

.web-spokes{

    position:absolute;

    left:50%;
    top:22px;

    width:225px;
    height:150px;

    transform:translateX(-50%);

    opacity:0;

    animation:
        spokesReveal 1.8s ease 1s forwards;

}

.spoke{

    position:absolute;

    left:50%;
    top:50%;

    width:112px;
    height:1px;

    transform-origin:left center;

    background:
        linear-gradient(
            90deg,
            rgba(255,220,235,.24),
            rgba(255,150,190,.04)
        );

}


/* هشت جهت */

.spoke:nth-child(1){transform:rotate(0deg)}
.spoke:nth-child(2){transform:rotate(45deg)}
.spoke:nth-child(3){transform:rotate(90deg)}
.spoke:nth-child(4){transform:rotate(135deg)}
.spoke:nth-child(5){transform:rotate(180deg)}
.spoke:nth-child(6){transform:rotate(225deg)}
.spoke:nth-child(7){transform:rotate(270deg)}
.spoke:nth-child(8){transform:rotate(315deg)}


/* =========================================================
   SPIDER CONTAINER
========================================================= */

.spider{

    position:absolute;

    left:50%;
    top:212px;

    width:110px;
    height:110px;

    transform:
        translateX(-50%)
        translateY(-70px)
        scale(.72);

    opacity:0;

    animation:
        spiderEnter 2.2s cubic-bezier(.17,.84,.25,1) 1.25s forwards,
        spiderFloat 4s ease-in-out 3.5s infinite;

}


/* =========================================================
   SVG
========================================================= */

.spider svg{

    width:100%;
    height:100%;

    overflow:visible;

}


/* =========================================================
   LEG ANIMATION
========================================================= */

.leg{

    transform-box:fill-box;

    transform-origin:center;

    animation:
        legBreath 2.4s ease-in-out infinite;

}

.leg:nth-child(1){animation-delay:.05s}
.leg:nth-child(2){animation-delay:.12s}
.leg:nth-child(3){animation-delay:.2s}
.leg:nth-child(4){animation-delay:.28s}
.leg:nth-child(5){animation-delay:.35s}
.leg:nth-child(6){animation-delay:.42s}
.leg:nth-child(7){animation-delay:.5s}
.leg:nth-child(8){animation-delay:.58s}


/* =========================================================
   SPIDER GLOW
========================================================= */

.spider-glow{

    position:absolute;

    left:50%;
    top:50%;

    width:75px;
    height:75px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,35,105,.25),
            transparent 70%
        );

    filter:blur(18px);

    animation:
        spiderGlow 2s ease-in-out infinite;

    pointer-events:none;

}


/* =========================================================
   EYES
========================================================= */

.eye-glow{

    animation:
        eyePulse 2.2s ease-in-out infinite;

}


/* =========================================================
   HEART INSIDE SPIDER
========================================================= */

.inner-heart{

    transform-origin:center;

    animation:
        heartPulse 1.45s ease-in-out infinite;

}


/* =========================================================
   HEART BELOW SPIDER
========================================================= */

.little-heart{

    position:absolute;

    left:50%;
    top:318px;

    transform:
        translateX(-50%)
        scale(.7);

    color:#ff5c94;

    font-size:16px;

    opacity:0;

    filter:
        drop-shadow(0 0 5px rgba(255,50,110,.8))
        drop-shadow(0 0 15px rgba(255,40,100,.4));

    animation:
        littleHeartIn 1s ease 3s forwards,
        littleHeartFloat 2.4s ease-in-out 4s infinite;

}


/* =========================================================
   CONTENT
========================================================= */

.content{

    position:relative;

    z-index:20;

    width:min(570px,92vw);

    text-align:center;

    margin-top:115px;

    opacity:0;

    transform:
        translateY(18px)
        scale(.985);

    animation:
        contentReveal 1.15s cubic-bezier(.22,.8,.25,1) 3.45s forwards;

}


/* =========================================================
   TOP HEART
========================================================= */

.top-heart{

    display:inline-block;

    margin-bottom:25px;

    font-size:25px;

    filter:
        drop-shadow(0 0 10px rgba(255,45,105,.5));

    animation:
        topHeartBeat 1.7s ease-in-out infinite;

}


/* =========================================================
   MAIN TEXT
========================================================= */

.line{

    margin:7px 0;

    font-size:
        clamp(18px,4.6vw,24px);

    line-height:2.2;

    font-weight:400;

    text-shadow:
        0 2px 15px rgba(0,0,0,.7);

}


/* تاکید روی «موردنظر» */

.highlight{

    color:#ffb5cd;

    text-shadow:
        0 0 14px rgba(255,80,135,.25);

}


/* =========================================================
   SUBTEXT
========================================================= */

.soft{

    margin-top:17px;

    font-size:14px;

    line-height:2;

    color:rgba(255,255,255,.5);

}


/* =========================================================
   BUTTON
========================================================= */

.btn{

    position:relative;

    margin-top:34px;

    padding:13px 30px;

    border-radius:999px;

    border:
        1px solid rgba(255,185,210,.28);

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    color:#fff;

    font-family:inherit;
    font-size:14px;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
        0 10px 35px rgba(60,5,30,.15);

    transition:
        transform .3s ease,
        background .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;

}


/* نور روی دکمه */

.btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:60%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,180,210,.12),
            transparent
        );

    transform:skewX(-20deg);

    animation:
        buttonShine 4s ease-in-out 4s infinite;

}


.btn:hover{

    transform:translateY(-2px);

    background:
        rgba(255,255,255,.075);

    border-color:
        rgba(255,185,210,.48);

    box-shadow:
        0 12px 40px rgba(150,20,70,.25);

}


.btn:active{

    transform:scale(.97);

}


/* =========================================================
   FADE OUT
========================================================= */

.fade{

    animation:
        pageExit .75s cubic-bezier(.4,0,.2,1) forwards !important;

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes threadAppear{

    from{
        transform:
            translateX(-50%)
            scaleY(0);

        opacity:0;
    }

    to{
        transform:
            translateX(-50%)
            scaleY(1);

        opacity:1;
    }

}


@keyframes threadSpark{

    0%{
        top:15px;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    80%{
        opacity:.8;
    }

    100%{
        top:245px;
        opacity:0;
    }

}


@keyframes ringReveal{

    from{
        opacity:0;
        transform:
            translateX(-50%)
            scale(.6);
    }

    to{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1);
    }

}


@keyframes spokesReveal{

    from{
        opacity:0;
        transform:
            translateX(-50%)
            scale(.4);
    }

    to{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1);
    }

}


@keyframes spiderEnter{

    0%{

        opacity:0;

        transform:
            translateX(-50%)
            translateY(-70px)
            scale(.72);

    }

    55%{

        opacity:1;

        transform:
            translateX(-50%)
            translateY(8px)
            scale(.96);

    }

    72%{

        transform:
            translateX(-50%)
            translateY(-5px)
            scale(.91);

    }

    86%{

        transform:
            translateX(-50%)
            translateY(3px)
            scale(.94);

    }

    100%{

        opacity:1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(.92);

    }

}


@keyframes spiderFloat{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:7px;
    }

}


@keyframes legBreath{

    0%,100%{
        opacity:.82;
    }

    50%{
        opacity:1;
    }

}


@keyframes spiderGlow{

    0%,100%{
        opacity:.45;
        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    50%{
        opacity:.9;
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

}


@keyframes eyePulse{

    0%,100%{
        opacity:.75;
    }

    50%{
        opacity:1;
    }

}


@keyframes heartPulse{

    0%,100%{
        transform:scale(.88);
        opacity:.65;
    }

    50%{
        transform:scale(1.12);
        opacity:1;
    }

}


@keyframes littleHeartIn{

    from{
        opacity:0;
        transform:
            translateX(-50%)
            translateY(-8px)
            scale(.4);
    }

    to{
        opacity:.85;
        transform:
            translateX(-50%)
            translateY(0)
            scale(.8);
    }

}


@keyframes littleHeartFloat{

    0%,100%{
        transform:
            translateX(-50%)
            translateY(0)
            scale(.8);
    }

    50%{
        transform:
            translateX(-50%)
            translateY(-7px)
            scale(1);
    }

}


@keyframes contentReveal{

    from{

        opacity:0;

        transform:
            translateY(18px)
            scale(.985);

        filter:blur(5px);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);

    }

}


@keyframes topHeartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.14);
    }

}


@keyframes ambientBreath{

    0%,100%{
        opacity:.65;
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.1);
    }

}


@keyframes particleFloat{

    0%{
        transform:
            translate3d(0,30px,0)
            scale(.7);

    }

    50%{

        transform:
            translate3d(var(--x),var(--y),0)
            scale(1);

    }

    100%{

        transform:
            translate3d(0,-40px,0)
            scale(.5);

    }

}


@keyframes buttonShine{

    0%{
        left:-100%;
    }

    25%{
        left:130%;
    }

    100%{
        left:130%;
    }

}


@keyframes pageExit{

    to{

        opacity:0;

        transform:
            scale(.985);

        filter:
            blur(8px);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .spider-stage{

        transform:
            translateX(-50%)
            scale(.84);

        transform-origin:
            top center;

    }

    .content{

        margin-top:125px;

        width:92vw;

    }

    .line{

        font-size:19px;

        line-height:2.15;

    }

    .soft{

        font-size:13px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;

    }

}

</style>

</head>


<body>


<main class="page" id="page">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="ambient"></div>

    <div class="particles" id="particles"></div>


    <!-- =====================================================
         LOVE SPIDER
    ====================================================== -->

    <div class="spider-stage">


        <!-- تار اصلی -->

        <div class="main-thread">

            <div class="thread-light"></div>

        </div>


        <!-- حلقه‌های تار -->

        <div class="web-ring r1"></div>
        <div class="web-ring r2"></div>
        <div class="web-ring r3"></div>
        <div class="web-ring r4"></div>


        <!-- تارهای شعاعی -->

        <div class="web-spokes">

            <span class="spoke"></span>
            <span class="spoke"></span>
            <span class="spoke"></span>
            <span class="spoke"></span>
            <span class="spoke"></span>
            <span class="spoke"></span>
            <span class="spoke"></span>
            <span class="spoke"></span>

        </div>


        <!-- نور پشت عنکبوت -->

        <div class="spider-glow"></div>


        <!-- =================================================
             SPIDER SVG
        ================================================== -->

        <div class="spider">

            <svg
                viewBox="0 0 110 110"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >


                <defs>

                    <!-- گرادیان بدن -->

                    <radialGradient
                        id="bodyGradient"
                        cx="35%"
                        cy="25%"
                    >

                        <stop
                            offset="0%"
                            stop-color="#ffb5cd"
                        />

                        <stop
                            offset="25%"
                            stop-color="#f05a8c"
                        />

                        <stop
                            offset="62%"
                            stop-color="#a7194d"
                        />

                        <stop
                            offset="100%"
                            stop-color="#350714"
                        />

                    </radialGradient>


                    <!-- گرادیان سر -->

                    <radialGradient
                        id="headGradient"
                        cx="32%"
                        cy="25%"
                    >

                        <stop
                            offset="0%"
                            stop-color="#ffd3e1"
                        />

                        <stop
                            offset="28%"
                            stop-color="#ef6795"
                        />

                        <stop
                            offset="65%"
                            stop-color="#94163f"
                        />

                        <stop
                            offset="100%"
                            stop-color="#2c0612"
                        />

                    </radialGradient>


                    <!-- گرادیان پا -->

                    <linearGradient
                        id="legGradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="0"
                    >

                        <stop
                            offset="0%"
                            stop-color="#ff94b6"
                        />

                        <stop
                            offset="45%"
                            stop-color="#b7275c"
                        />

                        <stop
                            offset="100%"
                            stop-color="#370714"
                        />

                    </linearGradient>


                    <!-- درخشش -->

                    <filter
                        id="spiderGlowFilter"
                        x="-100%"
                        y="-100%"
                        width="300%"
                        height="300%"
                    >

                        <feGaussianBlur
                            stdDeviation="2"
                            result="blur"
                        />

                        <feMerge>

                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>

                        </feMerge>

                    </filter>


                    <!-- سایه -->

                    <filter
                        id="shadow"
                        x="-100%"
                        y="-100%"
                        width="300%"
                        height="300%"
                    >

                        <feDropShadow
                            dx="0"
                            dy="3"
                            stdDeviation="3"
                            flood-color="#18030c"
                            flood-opacity=".8"
                        />

                    </filter>

                </defs>


                <!-- ==========================================
                     LEGS
                =========================================== -->


                <g
                    fill="none"
                    stroke="url(#legGradient)"
                    stroke-width="3"
                    stroke-linecap="round"
                    filter="url(#spiderGlowFilter)"
                >

                    <!-- چپ بالا -->

                    <path
                        class="leg"
                        d="M42 45 C31 36 22 30 10 29"
                    />

                    <path
                        class="leg"
                        d="M39 50 C27 46 17 43 7 45"
                    />

                    <path
                        class="leg"
                        d="M39 56 C27 59 18 63 8 69"
                    />

                    <path
                        class="leg"
                        d="M43 62 C34 70 28 78 23 87"
                    />


                    <!-- راست بالا -->

                    <path
                        class="leg"
                        d="M68 45 C79 36 88 30 100 29"
                    />

                    <path
                        class="leg"
                        d="M71 50 C83 46 93 43 103 45"
                    />

                    <path
                        class="leg"
                        d="M71 56 C83 59 92 63 102 69"
                    />

                    <path
                        class="leg"
                        d="M67 62 C76 70 82 78 87 87"
                    />

                </g>


                <!-- نوک‌های ظریف پا -->

                <g
                    fill="none"
                    stroke="rgba(255,190,210,.35)"
                    stroke-width="1"
                >

                    <path d="M10 29 L5 25"/>
                    <path d="M7 45 L2 45"/>
                    <path d="M8 69 L3 73"/>
                    <path d="M23 87 L20 92"/>

                    <path d="M100 29 L105 25"/>
                    <path d="M103 45 L108 45"/>
                    <path d="M102 69 L107 73"/>
                    <path d="M87 87 L90 92"/>

                </g>


                <!-- ==========================================
                     BODY
                =========================================== -->

                <ellipse
                    cx="55"
                    cy="61"
                    rx="20"
                    ry="28"
                    fill="url(#bodyGradient)"
                    filter="url(#shadow)"
                />


                <!-- برق بدن -->

                <ellipse
                    cx="48"
                    cy="51"
                    rx="6"
                    ry="12"
                    fill="rgba(255,255,255,.12)"
                    transform="rotate(-22 48 51)"
                />


                <!-- ==========================================
                     HEAD
                =========================================== -->

                <ellipse
                    cx="55"
                    cy="37"
                    rx="18"
                    ry="16"
                    fill="url(#headGradient)"
                    filter="url(#shadow)"
                />


                <!-- ==========================================
                     HEART ON BODY
                =========================================== -->

                <path
                    class="inner-heart"
                    d="
                        M55 76
                        C49 69 42 73 42 78
                        C42 84 49 88 55 93
                        C61 88 68 84 68 78
                        C68 73 61 69 55 76
                        Z
                    "
                    fill="#ff5b91"
                    opacity=".85"
                    filter="url(#spiderGlowFilter)"
                />


                <!-- ==========================================
                     EYES
                =========================================== -->

                <g
                    class="eye-glow"
                    fill="#fff"
                    filter="url(#spiderGlowFilter)"
                >

                    <circle cx="48" cy="34" r="3"/>
                    <circle cx="62" cy="34" r="3"/>

                    <circle
                        cx="51"
                        cy="40"
                        r="1.8"
                        fill="#ffd6e4"

<script>

/* =========================================================
   PARTICLES
========================================================= */

(function(){

    const container =
        document.getElementById("particles");

    const count = 45;

    for(let i=0;i<count;i++){

        const p =
            document.createElement("span");

        p.className="particle";

        const x =
            (Math.random()*120-60)+"px";

        const y =
            (Math.random()*180-90)+"px";

        const duration =
            (4 + Math.random()*6)+"s";

        const delay =
            (-Math.random()*8)+"s";

        const opacity =
            (.15 + Math.random()*.55).toFixed(2);

        p.style.left =
            (Math.random()*100)+"%";

        p.style.top =
            (Math.random()*100)+"%";

        p.style.setProperty(
            "--x",
            x
        );

        p.style.setProperty(
            "--y",
            y
        );

        p.style.setProperty(
            "--duration",
            duration
        );

        p.style.setProperty(
            "--delay",
            delay
        );

        p.style.setProperty(
            "--opacity",
            opacity
        );

        container.appendChild(p);

    }

})();


/* =========================================================
   NAVIGATION
========================================================= */

(function(){

    const page =
        document.getElementById("page");

    const button =
        document.getElementById("go");

    let moving=false;


    button.addEventListener(
        "click",
        function(){

            if(moving) return;

            moving=true;

            button.disabled=true;

            page.classList.add("fade");


            window.setTimeout(
                function(){

                    window.location.replace(
                        "./stage3.html"
                    );

                },
                750
            );

        }
    );

})();

</script>
