<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage 2</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Vazirmatn,sans-serif;background:#09070a;color:#fff;display:flex;align-items:center;justify-content:center}.glow{position:fixed;inset:-30%;background:radial-gradient(circle,rgba(150,20,60,.13),transparent 55%);pointer-events:none}.scene{position:relative;width:min(680px,90vw);text-align:center;z-index:2;transition:opacity .9s,transform .9s}.spider{position:fixed;top:-18px;left:50%;width:2px;height:145px;background:rgba(255,255,255,.25);transform-origin:top;animation:sway 3.2s ease-in-out infinite}.spider:after{content:'🕷️';position:absolute;top:125px;left:50%;transform:translateX(-50%);font-size:27px;filter:drop-shadow(0 0 8px rgba(255,80,130,.35))}.heart{font-size:25px;animation:beat 1.3s infinite;margin-bottom:25px}.line{opacity:0;transform:translateY(10px);animation:show .9s forwards}.l1{animation-delay:.7s}.l2{animation-delay:1.5s}.l3{animation-delay:2.3s}.btn{margin-top:35px;padding:13px 24px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.04);color:#fff;font:inherit;cursor:pointer;opacity:0;animation:show .9s 3.2s forwards}.btn:hover{background:rgba(255,255,255,.08)}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}}@keyframes show{to{opacity:1;transform:none}}.out{opacity:0;transform:scale(.96)}</style></head><body><div class="glow"></div><div class="spider"></div><main class="scene" id="scene"><div class="heart">❤️</div><div class="line l1">اول باید مطمئن باشم</div><div class="line l2">که تو فرد مورد نظر هستی... 👀</div><div class="line l3">پس قبل از اینکه جلوتر بری،<br>باید به یه سؤال جواب بدی. ❤️</div><button class="btn" id="go">سؤال رو بپرس 👀</button></main><script>document.getElementById('go').onclick=()=>{document.getElementById('scene').classList.add('out');setTimeout(()=>location.href='stage3.html',850)}</script></body></html>
