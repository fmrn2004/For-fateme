<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09040a">
<title>برای تو، تا همیشه</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#080309;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    position:relative;
    color:white;
    touch-action:none;
    user-select:none;
}

/* =========================================================
   WORLD
========================================================= */

#world{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(100,12,55,.34) 0%,
            rgba(37,5,28,.22) 28%,
            rgba(10,2,10,.88) 72%,
            #050205 100%
        );
}

/* cinematic atmospheric glow */

#world::before{
    content:"";
    position:absolute;
    width:75vmax;
    height:75vmax;
    left:50%;
    top:43%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,67,145,.12) 0%,
            rgba(255,37,126,.055) 27%,
            transparent 68%
        );
    filter:blur(18px);
    animation:breath 7s ease-in-out infinite;
}

@keyframes breath{
    0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(.94)}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
}

/* tiny stars */

#stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#ffd9ea;
    opacity:.25;
    animation:twinkle var(--d) ease-in-out infinite;
    animation-delay:var(--delay);
}

@keyframes twinkle{
    0%,100%{opacity:.12;transform:scale(.6)}
    50%{opacity:.75;transform:scale(1.5)}
}

/* subtle nebula */

.nebula{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    filter:blur(60px);
    opacity:.16;
}

.nebula.one{
    width:38vmax;
    height:25vmax;
    top:5%;
    right:-10%;
    background:#ff207e;
    transform:rotate(-25deg);
}

.nebula.two{
    width:30vmax;
    height:32vmax;
    bottom:-8%;
    left:-12%;
    background:#7a185f;
}

/* =========================================================
   ART STAGE
========================================================= */

#stage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
        max(20px,env(safe-area-inset-top))
        20px
        max(20px,env(safe-area-inset-bottom));
    perspective:1200px;
}

.art{
    position:relative;
    width:min(88vw,620px);
    max-height:86vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform-style:preserve-3d;
    animation:artEnter 1.7s cubic-bezier(.18,.8,.2,1) both;
}

@keyframes artEnter{
    0%{
        opacity:0;
        transform:
            translateY(65px)
            scale(.88)
            rotateX(10deg);
        filter:blur(12px);
    }
    60%{
        opacity:1;
    }
    100%{
        opacity:1;
        transform:
            translateY(0)
            scale(1)
            rotateX(0);
        filter:blur(0);
    }
}

/* =========================================================
   FRAME
========================================================= */

.photoShell{
    position:relative;
    width:100%;
    aspect-ratio:3 / 4;
    max-height:72vh;
    border-radius:20px;
    padding:10px;

    background:
        linear-gradient(
            135deg,
            #fff2f8 0%,
            #f6a5c7 12%,
            #8e285d 28%,
            #f8c2d9 46%,
            #7d164d 68%,
            #ffd8e9 88%,
            #a52d68 100%
        );

    box-shadow:
        0 35px 80px rgba(0,0,0,.72),
        0 0 0 1px rgba(255,210,230,.35),
        0 0 45px rgba(255,43,133,.16);

    transform:translateZ(0);
    overflow:visible;
}

/* inner frame */

.photoShell::before{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.48);
    pointer-events:none;
    z-index:20;
}

/* soft glow around artwork */

.photoShell::after{
    content:"";
    position:absolute;
    inset:-18px;
    border-radius:32px;
    background:radial-gradient(
        ellipse,
        rgba(255,64,145,.16),
        transparent 68%
    );
    filter:blur(18px);
    z-index:-1;
    opacity:.75;
}

/* =========================================================
   PHOTO
========================================================= */

.photo{
    position:absolute;
    inset:10px;
    border-radius:13px;
    overflow:hidden;
    background:#13070e;
}

#photoImage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;

    transform:scale(1.002);
}

/*
   very subtle cinematic color treatment
*/

.photo::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.06),
            transparent 20%,
            transparent 76%,
            rgba(25,0,13,.16)
        );
    z-index:3;
}

/* =========================================================
   SCRATCH SURFACE
========================================================= */

#scratch{
    position:absolute;
    inset:10px;
    width:calc(100% - 20px);
    height:calc(100% - 20px);
    border-radius:13px;
    z-index:10;
    cursor:crosshair;
    touch-action:none;
}

/*
   A second translucent surface makes the scratch feel
   like removing a magical pink layer rather than merely
   erasing an image.
*/

#surface{
    position:absolute;
    inset:10px;
    border-radius:13px;
    overflow:hidden;
    pointer-events:none;
    z-index:11;

    background:
        radial-gradient(
            circle at 25% 20%,
            rgba(255,236,247,.22),
            transparent 24%
        ),
        radial-gradient(
            circle at 75% 80%,
            rgba(255,52,145,.18),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            rgba(255,190,218,.18),
            rgba(91,7,51,.23)
        );

    mix-blend-mode:screen;
    opacity:.85;
}

.surfaceTexture{
    position:absolute;
    inset:0;
    opacity:.18;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.2px);
    background-size:13px 13px;
    transform:rotate(11deg) scale(1.2);
}

/* glossy diagonal sweep */

#shine{
    position:absolute;
    inset:10px;
    border-radius:13px;
    overflow:hidden;
    pointer-events:none;
    z-index:15;
    opacity:.3;
}

#shine::before{
    content:"";
    position:absolute;
    top:-30%;
    left:-45%;
    width:28%;
    height:160%;
    transform:rotate(22deg);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.55),
        transparent
    );
    filter:blur(8px);
    opacity:0;
}

#shine.play::before{
    animation:shineMove 1.35s cubic-bezier(.2,.7,.2,1);
}

@keyframes shineMove{
    0%{left:-45%;opacity:0}
    20%{opacity:.7}
    100%{left:125%;opacity:0}
}

/* =========================================================
   PROGRESS — intentionally almost invisible
========================================================= */

.progressTrack{
    position:absolute;
    left:50%;
    bottom:-14px;
    width:70px;
    height:2px;
    transform:translateX(-50%);
    background:rgba(255,255,255,.10);
    border-radius:20px;
    overflow:hidden;
    opacity:.45;
}

#progress{
    width:0%;
    height:100%;
    background:linear-gradient(
        90deg,
        #ff3f91,
        #ffd5e7,
        #ff3f91
    );
    box-shadow:0 0 8px #ff4b98;
    transition:width .25s ease;
}

/* =========================================================
   FINAL MESSAGE
========================================================= */

#message{
    position:relative;
    margin-top:34px;
    width:100%;
    text-align:center;

    opacity:0;
    transform:
        translateY(18px)
        scale(.94);

    pointer-events:none;
}

#message.show{
    animation:messageReveal 1.35s cubic-bezier(.18,.8,.2,1) forwards;
}

@keyframes messageReveal{
    0%{
        opacity:0;
        transform:translateY(18px) scale(.94);
        filter:blur(8px);
    }
    55%{
        opacity:1;
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

.messageText{
    position:relative;
    display:inline-block;
    padding:0 27px;

    font-size:clamp(23px,6vw,40px);
    line-height:1.55;
    font-weight:700;
    letter-spacing:-.7px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff78ad,
            #ffe0ed,
            #ff3f91,
            #fff,
            #ff72a8
        );
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:
        textGradient 4s ease-in-out infinite,
        textGlow 2.5s ease-in-out infinite;
}

@keyframes textGradient{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
}

@keyframes textGlow{
    0%,100%{
        filter:
            drop-shadow(0 0 4px rgba(255,73,145,.25))
            drop-shadow(0 0 14px rgba(255,52,137,.15));
    }
    50%{
        filter:
            drop-shadow(0 0 8px rgba(255,111,171,.65))
            drop-shadow(0 0 25px rgba(255,47,136,.38));
    }
}

.messageLine{
    position:absolute;
    top:50%;
    width:36px;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,136,183,.8)
    );
}

.messageLine.left{
    right:-18px;
    transform:translateY(-50%);
}

.messageLine.right{
    left:-18px;
    transform:
        translateY(-50%)
        rotate(180deg);
}

/* =========================================================
   FX CANVAS
========================================================= */

#fx{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:100;
}

/* =========================================================
   FINISH FLASH
========================================================= */

#flash{
    position:fixed;
    inset:0;
    z-index:90;
    pointer-events:none;
    background:
        radial-gradient(
            circle at center,
            rgba(255,240,247,.95),
            rgba(255,110,174,.24) 22%,
            transparent 58%
        );
    opacity:0;
}

#flash.play{
    animation:flash .9s ease-out forwards;
}

@keyframes flash{
    0%{opacity:0}
    12%{opacity:.8}
    100%{opacity:0}
}

/* =========================================================
   ACCESSIBILITY / REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
    }
}
</style>
</head>

<body>

<div id="world">

    <div id="stars"></div>

    <div class="nebula one"></div>
    <div class="nebula two"></div>

    <main id="stage">

        <section class="art" id="art">

            <div class="photoShell" id="photoShell">

                <div class="photo" id="photo">
                    <img
                        id="photoImage"
                        src="final.jpg"
                        alt=""
                        draggable="false"
                    >
                </div>

                <!-- Scratch mask -->
                <canvas id="scratch"></canvas>

                <!-- Magical surface -->
                <div id="surface">
                    <div class="surfaceTexture"></div>
                </div>

                <!-- Final light sweep -->
                <div id="shine"></div>

                <div class="progressTrack">
                    <div id="progress"></div>
                </div>

            </div>

            <div id="message">
                <span class="messageText">
                    <span class="messageLine left"></span>
                    و آینده‌ی کنار تو بهشته
                    <span class="messageLine right"></span>
                </span>
            </div>

        </section>

    </main>
</div>

<canvas id="fx"></canvas>
<div id="flash"></div>


<script>
(() => {
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const photoShell = document.getElementById("photoShell");
const photo = document.getElementById("photo");
const scratch = document.getElementById("scratch");
const surface = document.getElementById("surface");
const shine = document.getElementById("shine");
const message = document.getElementById("message");
const progress = document.getElementById("progress");
const fx = document.getElementById("fx");
const flash = document.getElementById("flash");
const stars = document.getElementById("stars");
const image = document.getElementById("photoImage");

const sctx = scratch.getContext("2d", {
    alpha:true,
    desynchronized:true
});

const fctx = fx.getContext("2d", {
    alpha:true,
    desynchronized:true
});

/* =========================================================
   CONSTANTS
========================================================= */

const MAX_PARTICLES = 900;
const SCRATCH_BRUSH = 34;
const SAMPLE_W = 96;
const SAMPLE_H = 64;

let dpr = 1;

let scratchW = 0;
let scratchH = 0;

let drawing = false;
let completed = false;

let lastPoint = null;
let lastScratchTime = 0;

let revealPercent = 0;

let previousTime = performance.now();
let particleAccumulator = 0;

let audioContext = null;
let audioMaster = null;

let pressTimer = null;
let pressStart = 0;
let longPressTriggered = false;

let lastTap = 0;
let tapTimer = null;

/* =========================================================
   STAR FIELD
========================================================= */

function createStars(){

    const fragment = document.createDocumentFragment();

    for(let i=0;i<75;i++){

        const el = document.createElement("i");

        el.className = "star";

        el.style.left = Math.random()*100 + "%";
        el.style.top = Math.random()*100 + "%";

        const size = .7 + Math.random()*1.8;

        el.style.width = size + "px";
        el.style.height = size + "px";

        el.style.setProperty(
            "--d",
            (2.8 + Math.random()*5.5) + "s"
        );

        el.style.setProperty(
            "--delay",
            (-Math.random()*6) + "s"
        );

        fragment.appendChild(el);
    }

    stars.appendChild(fragment);
}

createStars();

/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const rect = photo.getBoundingClientRect();

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    scratchW = Math.max(1, Math.round(rect.width));
    scratchH = Math.max(1, Math.round(rect.height));

    /*
       Preserve the current scratch state by rendering the old
       canvas into an intermediate canvas before resizing.
    */

    let oldCanvas = null;

    if(scratch.width > 0 && scratch.height > 0){

        oldCanvas = document.createElement("canvas");

        oldCanvas.width = scratch.width;
        oldCanvas.height = scratch.height;

        const oldCtx = oldCanvas.getContext("2d");

        oldCtx.drawImage(
            scratch,
            0,
            0
        );
    }

    scratch.width = Math.round(scratchW*dpr);
    scratch.height = Math.round(scratchH*dpr);

    scratch.style.width = scratchW + "px";
    scratch.style.height = scratchH + "px";

    sctx.setTransform(dpr,0,0,dpr,0,0);

    if(oldCanvas){

        sctx.drawImage(
            oldCanvas,
            0,
            0,
            oldCanvas.width,
            oldCanvas.height,
            0,
            0,
            scratchW,
            scratchH
        );
    }

    fx.width = Math.round(window.innerWidth*dpr);
    fx.height = Math.round(window.innerHeight*dpr);

    fx.style.width = window.innerWidth + "px";
    fx.style.height = window.innerHeight + "px";

    fctx.setTransform(dpr,0,0,dpr,0,0);

    lastPoint = null;
}

window.addEventListener("resize",resize,{passive:true});
window.addEventListener("orientationchange",()=>{
    setTimeout(resize,120);
},{passive:true});

image.addEventListener("load",resize);

resize();

/* =========================================================
   SCRATCH SURFACE
========================================================= */

function clearInitialSurface(){

    sctx.clearRect(
        0,
        0,
        scratchW,
        scratchH
    );

    /*
       The scratch canvas itself starts fully opaque.
       The image below therefore cannot be seen.
    */

    sctx.globalCompositeOperation = "source-over";

    const base = sctx.createLinearGradient(
        0,
        0,
        scratchW,
        scratchH
    );

    base.addColorStop(0,"#f8b6d0");
    base.addColorStop(.22,"#bd477c");
    base.addColorStop(.48,"#70163f");
    base.addColorStop(.73,"#d65b91");
    base.addColorStop(1,"#6d123e");

    sctx.fillStyle = base;

    sctx.fillRect(
        0,
        0,
        scratchW,
        scratchH
    );

    /*
       soft luminous texture
    */

    for(let i=0;i<24;i++){

        const x = Math.random()*scratchW;
        const y = Math.random()*scratchH;
        const r = 20 + Math.random()*70;

        const g = sctx.createRadialGradient(
            x,y,0,
            x,y,r
        );

        g.addColorStop(
            0,
            "rgba(255,225,239,.16)"
        );

        g.addColorStop(
            1,
            "rgba(255,225,239,0)"
        );

        sctx.fillStyle = g;

        sctx.beginPath();
        sctx.arc(x,y,r,0,Math.PI*2);
        sctx.fill();
    }

    /*
       Fine grain.
    */

    sctx.fillStyle = "rgba(255,255,255,.035)";

    for(let i=0;i<850;i++){

        const x = Math.random()*scratchW;
        const y = Math.random()*scratchH;

        sctx.fillRect(
            x,
            y,
            .7,
            .7
        );
    }
}

clearInitialSurface();

/* =========================================================
   POINTER COORDINATES
========================================================= */

function localPoint(event){

    const rect = scratch.getBoundingClientRect();

    let clientX;
    let clientY;

    if(event.touches && event.touches.length){

        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;

    }else{

        clientX = event.clientX;
        clientY = event.clientY;
    }

    return {
        x:Math.max(
            0,
            Math.min(
                scratchW,
                clientX - rect.left
            )
        ),
        y:Math.max(
            0,
            Math.min(
                scratchH,
                clientY - rect.top
            )
        )
    };
}

/* =========================================================
   SCRATCH ENGINE
========================================================= */

function eraseAt(x,y){

    const radius = SCRATCH_BRUSH;

    sctx.save();

    sctx.globalCompositeOperation = "destination-out";

    /*
       Soft center.
    */

    const gradient = sctx.createRadialGradient(
        x,
        y,
        radius*.06,
        x,
        y,
        radius
    );

    gradient.addColorStop(
        0,
        "rgba(0,0,0,1)"
    );

    gradient.addColorStop(
        .58,
        "rgba(0,0,0,.98)"
    );

    gradient.addColorStop(
        .82,
        "rgba(0,0,0,.65)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    sctx.fillStyle = gradient;

    /*
       Slightly irregular brush edge.
    */

    sctx.beginPath();

    const points = 18;

    for(let i=0;i<points;i++){

        const a = (i/points)*Math.PI*2;

        const variation =
            1 +
            Math.sin(a*3.7 + x*.015)*.08 +
            Math.cos(a*5.1 + y*.011)*.05;

        const rr = radius*variation;

        const px = x + Math.cos(a)*rr;
        const py = y + Math.sin(a)*rr;

        if(i===0){
            sctx.moveTo(px,py);
        }else{
            sctx.lineTo(px,py);
        }
    }

    sctx.closePath();
    sctx.fill();

    sctx.restore();
}


function eraseLine(a,b){

    const dx = b.x-a.x;
    const dy = b.y-a.y;

    const distance = Math.sqrt(
        dx*dx + dy*dy
    );

    const spacing = Math.max(
        7,
        SCRATCH_BRUSH*.28
    );

    const steps = Math.ceil(
        distance/spacing
    );

    for(let i=0;i<=steps;i++){

        const t = i/steps;

        const x = a.x + dx*t;
        const y = a.y + dy*t;

        eraseAt(x,y);
    }
}

/* =========================================================
   REVEAL MEASUREMENT
========================================================= */

const sampleCanvas =
    document.createElement("canvas");

sampleCanvas.width = SAMPLE_W;
sampleCanvas.height = SAMPLE_H;

const sampleCtx =
    sampleCanvas.getContext("2d",{
        willReadFrequently:true
    });


function measureReveal(){

    sampleCtx.clearRect(
        0,
        0,
        SAMPLE_W,
        SAMPLE_H
    );

    sampleCtx.drawImage(
        scratch,
        0,
        0,
        scratch.width,
        scratch.height,
        0,
        0,
        SAMPLE_W,
        SAMPLE_H
    );

    const data =
        sampleCtx.getImageData(
            0,
            0,
            SAMPLE_W,
            SAMPLE_H
        ).data;

    let transparent = 0;
    let total = SAMPLE_W*SAMPLE_H;

    for(let i=3;i<data.length;i+=4){

        if(data[i] < 42){
            transparent++;
        }
    }

    revealPercent =
        (transparent/total)*100;

    progress.style.width =
        Math.min(100,revealPercent) + "%";

    return revealPercent;
}

/*
   Avoid false finish caused by tiny hidden islands.
   We require both high global coverage and most coarse cells
   to be revealed.
*/

function revealReady(){

    if(revealPercent < 97){
        return false;
    }

    const cellW = 8;
    const cellH = 8;

    let coveredCells = 0;
    let cells = 0;

    for(let gy=0;gy<SAMPLE_H;gy+=cellH){

        for(let gx=0;gx<SAMPLE_W;gx+=cellW){

            cells++;

            let opaque = 0;
            let count = 0;

            for(
                let y=gy;
                y<Math.min(gy+cellH,SAMPLE_H);
                y++
            ){

                for(
                    let x=gx;
                    x<Math.min(gx+cellW,SAMPLE_W);
                    x++
                ){

                    const alpha =
                        dataAlpha(
                            x,
                            y
                        );

                    count++;

                    if(alpha > 80){
                        opaque++;
                    }
                }
            }

            if(
                opaque/count > .32
            ){
                coveredCells++;
            }
        }
    }

    /*
       No significant covered island.
    */

    return coveredCells/cells < .025;
}


function dataAlpha(x,y){

    const pixel =
        sampleCtx.getImageData(
            x,
            y,
            1,
            1
        ).data;

    return pixel[3];
}

/*
   Faster final check using one read.
*/

function finalRevealCheck(){

    const data =
        sampleCtx.getImageData(
            0,
            0,
            SAMPLE_W,
            SAMPLE_H
        ).data;

    let covered = 0;

    for(let i=3;i<data.length;i+=4){

        if(data[i] > 80){
            covered++;
        }
    }

    return covered/(SAMPLE_W*SAMPLE_H) < .018;
}

/* =========================================================
   PARTICLE ENGINE
========================================================= */

const particles = [];

function addParticle(p){

    if(particles.length >= MAX_PARTICLES){

        /*
           Remove an older low-life particle instead of
           allowing unbounded growth.
        */

        particles.splice(0,1);
    }

    particles.push(p);
}


function random(min,max){
    return min + Math.random()*(max-min);
}


function randomSign(){
    return Math.random()<.5 ? -1 : 1;
}


function heartShape(ctx,x,y,size,alpha){

    ctx.save();

    ctx.translate(x,y);
    ctx.scale(size,size);

    ctx.beginPath();

    ctx.moveTo(0,.35);

    ctx.bezierCurveTo(
        -.8,-.15,
        -1,-.85,
        -.45,-1
    );

    ctx.bezierCurveTo(
        -.1,-1.1,
        .05,-.78,
        0,-.55
    );

    ctx.bezierCurveTo(
        .05,-.78,
        .2,-1.1,
        .55,-1
    );

    ctx.bezierCurveTo(
        1,-.85,
        .8,-.15,
        0,.35
    );

    ctx.closePath();

    ctx.fillStyle =
        `rgba(255,${random(70,170)},${random(125,215)},${alpha})`;

    ctx.fill();

    ctx.restore();
}


function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p = particles[i];

        p.life -= dt;

        if(p.life <= 0){

            particles.splice(i,1);
            continue;
        }

        if(p.gravity){
            p.vy += p.gravity*dt;
        }

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        if(p.drag){

            const drag =
                Math.pow(
                    p.drag,
                    dt*60
                );

            p.vx *= drag;
            p.vy *= drag;
        }

        if(p.rotation !== undefined){
            p.rotation +=
                (p.spin || 0)*dt;
        }
    }
}


function renderParticles(){

    fctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    for(const p of particles){

        const alpha =
            Math.max(
                0,
                Math.min(
                    1,
                    p.life/p.maxLife
                )
            );

        if(p.type==="dust"){

            fctx.beginPath();

            fctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI*2
            );

            fctx.fillStyle =
                `rgba(255,${p.pink || 120},${p.blue || 175},${alpha*.8})`;

            fctx.shadowBlur = p.glow || 0;
            fctx.shadowColor =
                "rgba(255,70,150,.8)";

            fctx.fill();

            fctx.shadowBlur = 0;
        }

        else if(p.type==="spark"){

            fctx.save();

            fctx.translate(p.x,p.y);
            fctx.rotate(p.rotation || 0);

            fctx.strokeStyle =
                `rgba(255,220,239,${alpha})`;

            fctx.lineWidth =
                p.size*.55;

            fctx.beginPath();

            fctx.moveTo(
                -p.size,
                0
            );

            fctx.lineTo(
                p.size,
                0
            );

            fctx.moveTo(
                0,
                -p.size
            );

            fctx.lineTo(
                0,
                p.size
            );

            fctx.stroke();

            fctx.restore();
        }

        else if(p.type==="heart"){

            heartShape(
                fctx,
                p.x,
                p.y,
                p.size,
                alpha
            );
        }

        else if(p.type==="ring"){

            fctx.beginPath();

            fctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI*2
            );

            fctx.strokeStyle =
                `rgba(255,150,198,${alpha*.55})`;

            fctx.lineWidth =
                p.lineWidth || 1.5;

            fctx.shadowBlur = 15;
            fctx.shadowColor =
                "rgba(255,50,140,.65)";

            fctx.stroke();

            fctx.shadowBlur = 0;
        }

        else if(p.type==="glow"){

            const g =
                fctx.createRadialGradient(
                    p.x,p.y,0,
                    p.x,p.y,p.radius
                );

            g.addColorStop(
                0,
                `rgba(255,225,239,${alpha*.8})`
            );

            g.addColorStop(
                .25,
                `rgba(255,89,160,${alpha*.35})`
            );

            g.addColorStop(
                1,
                "rgba(255,40,130,0)"
            );

            fctx.fillStyle = g;

            fctx.beginPath();

            fctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI*2
            );

            fctx.fill();
        }
    }
}

/* =========================================================
   SIDE DUST
========================================================= */

function shellRect(){

    return photoShell.getBoundingClientRect();
}


function spawnEdgeDust(point){

    const r = shellRect();

    /*
       Convert scratch-local coordinates to viewport.
    */

    const scratchRect =
        scratch.getBoundingClientRect();

    const px =
        scratchRect.left + point.x;

    const py =
        scratchRect.top + point.y;

    const distances = {
        left:Math.abs(px-r.left),
        right:Math.abs(px-r.right),
        top:Math.abs(py-r.top),
        bottom:Math.abs(py-r.bottom)
    };

    let edge = "left";
    let min = distances.left;

    for(const key of Object.keys(distances)){

        if(distances[key] < min){

            min = distances[key];
            edge = key;
        }
    }

    /*
       We want dust visibly falling from the physical
       side edges. Bottom is allowed but less dominant.
    */

    const amount =
        edge==="bottom" ? 1 : 2;

    for(let i=0;i<amount;i++){

        let x;
        let y;
        let vx;
        let vy;

        if(edge==="left"){

            x = r.left + random(-2,5);
            y = py + random(-20,20);

            vx = random(2,15);
            vy = random(25,75);
        }

        else if(edge==="right"){

            x = r.right + random(-5,2);
            y = py + random(-20,20);

            vx = random(-15,-2);
            vy = random(25,75);
        }

        else if(edge==="top"){

            x = px + random(-20,20);
            y = r.top + random(-3,4);

            vx = random(-10,10);
            vy = random(25,75);
        }

        else{

            x = px + random(-20,20);
            y = r.bottom + random(-2,4);

            vx = random(-8,8);
            vy = random(10,38);
        }

        addParticle({
            type:"dust",
            x,
            y,
            vx,
            vy,
            gravity:35,
            drag:.985,
            size:random(.8,2.7),
            life:random(.7,1.45),
            maxLife:1.45,
            pink:random(105,185),
            blue:random(155,220),
            glow:random(3,9)
        });
    }
}


function spawnScratchParticles(point){

    const rect =
        scratch.getBoundingClientRect();

    const x =
        rect.left + point.x;

    const y =
        rect.top + point.y;

    /*
       Very small amount near the scratch itself.
       Edge dust remains the dominant effect.
    */

    if(Math.random()<.45){

        addParticle({
            type:"dust",
            x:x+random(-8,8),
            y:y+random(-5,5),
            vx:random(-10,10),
            vy:random(-15,10),
            gravity:20,
            drag:.97,
            size:random(.5,1.5),
            life:random(.25,.55),
            maxLife:.55,
            pink:random(150,205),
            blue:random(175,225),
            glow:3
        });
    }

    if(Math.random()<.22){

        addParticle({
            type:"spark",
            x,
            y,
            vx:random(-20,20),
            vy:random(-25,5),
            gravity:15,
            drag:.96,
            size:random(2,4),
            life:.28,
            maxLife:.28,
            rotation:random(0,Math.PI),
            spin:random(-8,8)
        });
    }
}

/* =========================================================
   BURSTS
========================================================= */

function burst(x,y,count=60){

    for(let i=0;i<count;i++){

        const a =
            Math.random()*Math.PI*2;

        const speed =
            random(35,210);

        addParticle({
            type:"dust",
            x,
            y,
            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,
            gravity:55,
            drag:.975,
            size:random(.8,2.8),
            life:random(.45,1.15),
            maxLife:1.15,
            pink:random(90,190),
            blue:random(145,225),
            glow:random(3,12)
        });
    }
}


function heartBurst(x,y,count=25,force=1){

    for(let i=0;i<count;i++){

        const a =
            Math.random()*Math.PI*2;

        const speed =
            random(35,145)*force;

        addParticle({
            type:"heart",
            x,
            y,
            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed-random(15,55),
            gravity:random(15,42),
            drag:.985,
            size:random(4,9)*force,
            life:random(.9,1.8),
            maxLife:1.8
        });
    }
}


function shockwave(x,y,scale=1){

    addParticle({
        type:"ring",
        x,
        y,
        radius:2,
        radiusSpeed:260*scale,
        lineWidth:1.7*scale,
        life:.8,
        maxLife:.8
    });

    addParticle({
        type:"glow",
        x,
        y,
        radius:40*scale,
        radiusSpeed:100*scale,
        life:.55,
        maxLife:.55
    });
}


/*
   Ring and glow radius animation.
*/

function updateSpecialParticles(dt){

    for(const p of particles){

        if(
            p.type==="ring" ||
            p.type==="glow"
        ){

            p.radius +=
                p.radiusSpeed*dt;
        }
    }
}

/* =========================================================
   AUDIO
========================================================= */

function ensureAudio(){

    if(audioContext){
        if(audioContext.state==="suspended"){
            audioContext.resume().catch(()=>{});
        }
        return;
    }

    try{

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        audioMaster =
            audioContext.createGain();

        audioMaster.gain.value=.075;

        audioMaster.connect(
            audioContext.destination
        );

    }catch(e){}
}


function scratchSound(){

    ensureAudio();

    if(!audioContext || !audioMaster){
        return;
    }

    const now =
        audioContext.currentTime;

    /*
       filtered noise = actual tactile scratch texture
    */

    const bufferSize =
        Math.floor(
            audioContext.sampleRate*.055
        );

    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(let i=0;i<bufferSize;i++){

        const fade =
            1-i/bufferSize;

        data[i] =
            (Math.random()*2-1) *
            fade;
    }

    const source =
        audioContext.createBufferSource();

    source.buffer=buffer;

    const filter =
        audioContext.createBiquadFilter();

    filter.type="bandpass";
    filter.frequency.value =
        random(1700,3000);
    filter.Q.value=.7;

    const gain =
        audioContext.createGain();

    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .055,
        now+.006
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.052
    );

    source.connect(filter);
    filter.connect(gain);
    gain.connect(audioMaster);

    source.start(now);
    source.stop(now+.06);
}


function finishSound(){

    ensureAudio();

    if(!audioContext || !audioMaster){
        return;
    }

    const now =
        audioContext.currentTime;

    const notes = [
        {f:392,t:0},
        {f:523.25,t:.12},
        {f:659.25,t:.25},
        {f:783.99,t:.39}
    ];

    notes.forEach(note=>{

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type="sine";

        osc.frequency.value =
            note.f;

        gain.gain.setValueAtTime(
            .0001,
            now+note.t
        );

        gain.gain.exponentialRampToValueAtTime(
            .08,
            now+note.t+.025
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+note.t+.75
        );

        osc.connect(gain);
        gain.connect(audioMaster);

        osc.start(now+note.t);
        osc.stop(now+note.t+.8);
    });
}


function interactionSound(strength=1){

    ensureAudio();

    if(!audioContext || !audioMaster){
        return;
    }

    const now =
        audioContext.currentTime;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type="sine";

    osc.frequency.setValueAtTime(
        330*strength,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        620*strength,
        now+.18
    );

    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .055,
        now+.015
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.25
    );

    osc.connect(gain);
    gain.connect(audioMaster);

    osc.start(now);
    osc.stop(now+.28);
}

/* =========================================================
   SCRATCH INPUT
========================================================= */

function beginScratch(event){

    if(completed){
        return;
    }

    drawing=true;

    ensureAudio();

    const point =
        localPoint(event);

    lastPoint=point;

    eraseAt(
        point.x,
        point.y
    );

    spawnScratchParticles(point);
    spawnEdgeDust(point);

    scratchSound();

    lastScratchTime =
        performance.now();

    event.preventDefault();
}


function moveScratch(event){

    if(!drawing || completed){
        return;
    }

    const point =
        localPoint(event);

    if(!lastPoint){
        lastPoint=point;
    }

    eraseLine(
        lastPoint,
        point
    );

    /*
       Effects throttled slightly to prevent
       particle explosion on fast pointer events.
    */

    const now =
        performance.now();

    if(now-lastScratchTime > 24){

        spawnScratchParticles(point);
        spawnEdgeDust(point);

        scratchSound();

        lastScratchTime=now;
    }

    lastPoint=point;

    const value =
        measureReveal();

    if(
        value>=97 &&
        revealReady()
    ){

        finishReveal();
    }

    event.preventDefault();
}


function endScratch(){

    drawing=false;
    lastPoint=null;
}


scratch.addEventListener(
    "pointerdown",
    beginScratch,
    {passive:false}
);

scratch.addEventListener(
    "pointermove",
    moveScratch,
    {passive:false}
);

scratch.addEventListener(
    "pointerup",
    endScratch,
    {passive:true}
);

scratch.addEventListener(
    "pointercancel",
    endScratch,
    {passive:true}
);

scratch.addEventListener(
    "pointerleave",
    endScratch,
    {passive:true}
);

/* =========================================================
   FINISH REVEAL
========================================================= */

function clearScratchCompletely(){

    sctx.clearRect(
        0,
        0,
        scratchW,
        scratchH
    );

    progress.style.width="100%";
}


function viewportPhotoCenter(){

    const r =
        photo.getBoundingClientRect();

    return {
        x:r.left+r.width/2,
        y:r.top+r.height/2
    };
}


function sidePowderRain(){

    const r =
        shellRect();

    /*
       A large but controlled waterfall from both
       physical sides of the artwork.
    */

    for(let side of [-1,1]){

        for(let i=0;i<95;i++){

            const y =
                r.top +
                Math.random()*r.height;

            const x =
                side===-1
                ? r.left+random(-2,7)
                : r.right+random(-7,2);

            addParticle({
                type:"dust",
                x,
                y,
                vx:
                    side===-1
                    ? random(4,25)
                    : random(-25,-4),
                vy:random(25,100),
                gravity:65,
                drag:.985,
                size:random(.7,2.5),
                life:random(.8,2.0),
                maxLife:2,
                pink:random(105,190),
                blue:random(150,225),
                glow:random(3,10)
            });
        }
    }
}


function finishReveal(){

    if(completed){
        return;
    }

    completed=true;
    drawing=false;

    clearScratchCompletely();

    scratch.style.pointerEvents="none";

    surface.style.opacity="0";

    shine.classList.add("play");

    finishSound();

    const center =
        viewportPhotoCenter();

    /*
       Phase 1: stillness
    */

    setTimeout(()=>{

        flash.classList.add("play");

        /*
           Central light
        */

        addParticle({
            type:"glow",
            x:center.x,
            y:center.y,
            radius:25,
            radiusSpeed:150,
            life:.9,
            maxLife:.9
        });

        shockwave(
            center.x,
            center.y,
            1.2
        );

    },160);

    /*
       Phase 2: explosion
    */

    setTimeout(()=>{

        burst(
            center.x,
            center.y,
            90
        );

        heartBurst(
            center.x,
            center.y,
            32,
            1
        );

        sidePowderRain();

    },360);

    /*
       Phase 3: second wave
    */

    setTimeout(()=>{

        shockwave(
            center.x,
            center.y,
            1.8
        );

        heartBurst(
            center.x,
            center.y,
            20,
            .72
        );

    },650);

    /*
       Phase 4: finally reveal the sentence
    */

    setTimeout(()=>{

        message.classList.add("show");

    },1150);
}

/* =========================================================
   POST COMPLETION INTERACTION
========================================================= */

function getViewportCenter(){

    const r =
        photo.getBoundingClientRect();

    return {
        x:r.left+r.width/2,
        y:r.top+r.height/2
    };
}


function smallTap(x,y){

    interactionSound(1);

    burst(
        x,
        y,
        18
    );

    heartBurst(
        x,
        y,
        7,
        .6
    );
}


function doubleTap(x,y){

    interactionSound(1.35);

    shockwave(
        x,
        y,
        1.3
    );

    shockwave(
        x,
        y,
        .75
    );

    burst(
        x,
        y,
        65
    );

    heartBurst(
        x,
        y,
        28,
        1.2
    );
}


function longPressEffect(x,y){

    interactionSound(1.7);

    /*
       Halo
    */

    for(let i=0;i<3;i++){

        setTimeout(()=>{

            shockwave(
                x,
                y,
                1 + i*.45
            );

        },i*120);
    }

    /*
       Hearts drifting upward.
    */

    for(let i=0;i<34;i++){

        addParticle({
            type:"heart",
            x:x+random(-45,45),
            y:y+random(-20,20),
            vx:random(-35,35),
            vy:random(-130,-55),
            gravity:-4,
            drag:.992,
            size:random(4,10),
            life:random(1.3,2.4),
            maxLife:2.4
        });
    }
}

/* =========================================================
   POST COMPLETION POINTER
========================================================= */

photoShell.addEventListener(
    "pointerdown",
    event=>{

        if(!completed){
            return;
        }

        pressStart =
            performance.now();

        longPressTriggered=false;

        const x=event.clientX;
        const y=event.clientY;

        pressTimer=setTimeout(()=>{

            longPressTriggered=true;

            longPressEffect(
                x,
                y
            );

        },650);
    },
    {passive:true}
);


photoShell.addEventListener(
    "pointerup",
    event=>{

        if(!completed){
            return;
        }

        if(pressTimer){
            clearTimeout(pressTimer);
            pressTimer=null;
        }

        if(longPressTriggered){
            return;
        }

        const now =
            performance.now();

        const x=event.clientX;
        const y=event.clientY;

        if(
            now-lastTap < 320
        ){

            if(tapTimer){
                clearTimeout(tapTimer);
                tapTimer=null;
            }

            doubleTap(
                x,
                y
            );

            lastTap=0;

        }else{

            lastTap=now;

            tapTimer=setTimeout(()=>{

                smallTap(
                    x,
                    y
                );

                tapTimer=null;

            },320);
        }
    },
    {passive:true}
);

/* =========================================================
   PARALLAX — VERY SUBTLE
========================================================= */

let targetRX=0;
let targetRY=0;

let currentRX=0;
let currentRY=0;

window.addEventListener(
    "pointermove",
    event=>{

        if(
            event.pointerType !== "mouse"
        ){
            return;
        }

        targetRY =
            ((event.clientX/window.innerWidth)-.5)
            *2.2;

        targetRX =
            ((event.clientY/window.innerHeight)-.5)
            *-1.8;

    },
    {passive:true}
);


function updateParallax(){

    currentRX +=
        (targetRX-currentRX)*.035;

    currentRY +=
        (targetRY-currentRY)*.035;

    if(!completed){

        photoShell.style.transform =
            `rotateX(${currentRX}deg)
             rotateY(${currentRY}deg)`;
    }

    requestAnimationFrame(updateParallax);
}

updateParallax();

/* =========================================================
   MAIN ANIMATION LOOP
========================================================= */

function animationLoop(now){

    let dt =
        (now-previousTime)/1000;

    previousTime=now;

    /*
       Protect against tab switching / huge frames.
    */

    dt=Math.min(dt,.033);

    updateParticles(dt);
    updateSpecialParticles(dt);
    renderParticles();

    requestAnimationFrame(animationLoop);
}

requestAnimationFrame(animationLoop);

/* =========================================================
   SAFETY / VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        previousTime =
            performance.now();

        drawing=false;
        lastPoint=null;
    }
);

/* =========================================================
   PREVENT CONTEXT MENU
========================================================= */

document.addEventListener(
    "contextmenu",
    event=>{
        event.preventDefault();
    }
);

/* =========================================================
   IMAGE ERROR FALLBACK
========================================================= */

image.addEventListener(
    "error",
    ()=>{
        /*
           Keep the artwork functional even if the image
           temporarily fails to load.
        */

        photo.style.background =
            "linear-gradient(135deg,#351022,#16050e)";
    }
);

})();
