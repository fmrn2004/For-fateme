
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#050207">

<title>برای تو</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#050207;
}

body{
    touch-action:none;
    user-select:none;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

/* =========================================================
   BACKGROUND
========================================================= */

#world{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(112,20,68,.40),
            rgba(36,6,27,.48) 32%,
            rgba(9,3,10,.94) 75%,
            #030204 100%
        );
}

/* نور نفس‌کشنده‌ی پشت تابلو */

#world::before{
    content:"";
    position:absolute;

    width:90vmax;
    height:90vmax;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,47,139,.14),
            rgba(255,47,139,.045) 32%,
            transparent 70%
        );

    filter:blur(25px);

    animation:
        atmosphere 8s
        ease-in-out
        infinite;
}

@keyframes atmosphere{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(.94);
        opacity:.65;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.08);
        opacity:1;
    }
}


/* لکه‌های رنگی */

.aurora{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.13;
    pointer-events:none;
}

.aurora.a{
    width:40vmax;
    height:24vmax;
    right:-12vmax;
    top:5vmax;
    background:#ff2588;
    transform:rotate(-25deg);
}

.aurora.b{
    width:35vmax;
    height:28vmax;
    left:-15vmax;
    bottom:-8vmax;
    background:#8c286c;
}


/* =========================================================
   STARS
========================================================= */

#stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    border-radius:50%;
    background:#ffe4ef;

    animation:
        twinkle var(--time)
        ease-in-out
        infinite var(--delay);
}

@keyframes twinkle{

    0%,100%{
        opacity:.08;
        transform:scale(.6);
    }

    50%{
        opacity:.75;
        transform:scale(1.5);
    }
}


/* =========================================================
   ART
========================================================= */

#stage{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        18px
        18px
        max(18px,env(safe-area-inset-bottom));
}

.art{
    width:min(87vw,600px);

    position:relative;

    display:flex;
    flex-direction:column;
    align-items:center;

    animation:
        artEnter
        1.55s
        cubic-bezier(.18,.82,.18,1)
        both;
}

@keyframes artEnter{

    0%{
        opacity:0;

        transform:
            translateY(65px)
            scale(.86)
            rotateX(8deg);

        filter:blur(12px);
    }

    55%{
        opacity:1;
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1)
            rotateX(0);

        filter:none;
    }
}


/* =========================================================
   PAINTING FRAME
========================================================= */

.frame{
    position:relative;

    width:100%;

    aspect-ratio:3 / 4;

    padding:10px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,

            #fff4fa 0%,
            #e895b9 10%,
            #7b194b 25%,
            #f8c5da 42%,
            #801b4c 61%,
            #fbd8e7 79%,
            #a92d6b 100%
        );

    box-shadow:

        0 35px 90px
        rgba(0,0,0,.78),

        0 0 0 1px
        rgba(255,230,241,.28),

        0 0 50px
        rgba(255,45,139,.16);
}


/* قاب داخلی */

.frame::before{
    content:"";

    position:absolute;
    inset:5px;

    border:
        1px solid
        rgba(255,255,255,.48);

    border-radius:19px;

    pointer-events:none;

    z-index:30;
}


/* درخشش اطراف قاب */

.frame::after{
    content:"";

    position:absolute;

    inset:-20px;

    border-radius:38px;

    background:
        radial-gradient(
            ellipse,
            rgba(255,48,142,.16),
            transparent 67%
        );

    filter:blur(20px);

    z-index:-1;

    pointer-events:none;
}


/* =========================================================
   PHOTO
========================================================= */

.photo{
    position:absolute;

    inset:10px;

    overflow:hidden;

    border-radius:15px;

    background:#160811;
}

.photo img{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transform:
        scale(1.002);

    user-select:none;
    -webkit-user-drag:none;
}


/* cinematic image grade */

.photo::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:

        linear-gradient(
            180deg,
            rgba(255,255,255,.07),
            transparent 18%,
            transparent 76%,
            rgba(20,0,12,.18)
        ),

        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(25,0,15,.20)
        );
}


/* =========================================================
   SCRATCH
========================================================= */

#scratch{
    position:absolute;

    inset:10px;

    width:calc(100% - 20px);
    height:calc(100% - 20px);

    border-radius:15px;

    z-index:12;

    touch-action:none;
}


/* =========================================================
   PAINT GRAIN
========================================================= */

#grain{
    position:absolute;

    inset:10px;

    border-radius:15px;

    overflow:hidden;

    pointer-events:none;

    z-index:13;

    opacity:.30;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,.38)
            0 1px,
            transparent 1.2px
        );

    background-size:
        11px 11px;

    mix-blend-mode:
        screen;
}


/* =========================================================
   SCRATCH GLOW
========================================================= */

#scratchGlow{
    position:absolute;

    inset:10px;

    border-radius:15px;

    pointer-events:none;

    z-index:14;

    opacity:0;

    box-shadow:
        inset 0 0 25px
        rgba(255,108,170,.18);
}

#scratchGlow.active{
    opacity:1;
}


/* =========================================================
   SHINE
========================================================= */

#shine{
    position:absolute;

    inset:10px;

    border-radius:15px;

    overflow:hidden;

    pointer-events:none;

    z-index:20;
}

#shine::before{
    content:"";

    position:absolute;

    top:-40%;
    left:-50%;

    width:22%;
    height:180%;

    transform:
        rotate(22deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.75),
            transparent
        );

    filter:blur(7px);

    opacity:0;
}

#shine.play::before{
    animation:
        shineMove
        1.45s
        cubic-bezier(.2,.7,.2,1);
}

@keyframes shineMove{

    0%{
        left:-50%;
        opacity:0;
    }

    18%{
        opacity:.9;
    }

    100%{
        left:125%;
        opacity:0;
    }
}


/* =========================================================
   SUBTLE PROGRESS
========================================================= */

.progress{
    position:absolute;

    bottom:-14px;

    left:50%;

    transform:
        translateX(-50%);

    width:58px;
    height:2px;

    overflow:hidden;

    border-radius:20px;

    background:
        rgba(255,255,255,.08);

    opacity:.45;
}

.progress span{
    display:block;

    width:0;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff438f,
            #ffe2ed,
            #ff438f
        );

    box-shadow:
        0 0 8px
        rgba(255,68,145,.8);
}


/* =========================================================
   FINAL MESSAGE
========================================================= */

#message{
    position:relative;

    width:100%;

    margin-top:30px;

    text-align:center;

    opacity:0;

    transform:
        translateY(20px)
        scale(.94);

    pointer-events:none;
}

#message.show{
    animation:
        messageIn
        1.35s
        cubic-bezier(.18,.82,.18,1)
        forwards;
}

@keyframes messageIn{

    0%{
        opacity:0;

        transform:
            translateY(20px)
            scale(.92);

        filter:blur(8px);
    }

    60%{
        opacity:1;
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:none;
    }
}

.messageText{
    position:relative;

    display:inline-block;

    padding:
        0 26px;

    font-size:
        clamp(
            23px,
            6vw,
            40px
        );

    font-weight:700;

    line-height:1.55;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff72a9,
            #ffe1ec,
            #ff3c91,
            #fff,
            #ff6ea6
        );

    background-size:320% 100%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        messageGradient
        4s
        ease-in-out
        infinite,

        messageGlow
        2.6s
        ease-in-out
        infinite;
}

@keyframes messageGradient{

    0%,100%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }
}

@keyframes messageGlow{

    0%,100%{
        filter:
            drop-shadow(
                0 0 5px
                rgba(255,65,145,.28)
            );
    }

    50%{
        filter:
            drop-shadow(
                0 0 9px
                rgba(255,100,169,.72)
            )

            drop-shadow(
                0 0 25px
                rgba(255,45,140,.32)
            );
    }
}

.messageLine{
    position:absolute;

    top:50%;

    width:34px;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,142,184,.8)
        );
}

.messageLine.left{
    right:-10px;
}

.messageLine.right{
    left:-10px;

    transform:
        rotate(180deg);
}


/* =========================================================
   FX
========================================================= */

#fx{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:100;

    pointer-events:none;
}


/* =========================================================
   FINAL FLASH
========================================================= */

#flash{
    position:fixed;

    inset:0;

    z-index:90;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle at center,

            rgba(255,245,250,.96),

            rgba(255,90,160,.27) 23%,

            transparent 60%
        );
}

#flash.play{
    animation:
        flash
        .95s
        ease-out;
}

@keyframes flash{

    0%{
        opacity:0;
    }

    10%{
        opacity:.88;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-height:700px){

    #stage{
        padding-top:10px;
    }

    .art{
        width:min(77vw,470px);
    }

    #message{
        margin-top:20px;
    }

    .messageText{
        font-size:
            clamp(
                20px,
                5.3vw,
                30px
            );
    }
}

</style>
</head>


<body>

<div id="world">

    <div class="aurora a"></div>
    <div class="aurora b"></div>

    <div id="stars"></div>


    <main id="stage">

        <section class="art">

            <div
                class="frame"
                id="frame"
            >

                <div class="photo">

                    <img
                        id="photo"
                        src="final.jpg"
                        alt=""
                        draggable="false"
                    >

                </div>


                <canvas
                    id="scratch">
                </canvas>


                <div id="grain"></div>

                <div id="scratchGlow"></div>

                <div id="shine"></div>


                <div class="progress">
                    <span id="progress"></span>
                </div>

            </div>


            <div id="message">

                <span class="messageText">

                    <span
                        class="messageLine left">
                    </span>

                    و آینده‌ی کنار تو بهشته

                    <span
                        class="messageLine right">
                    </span>

                </span>

            </div>

        </section>

    </main>

</div>


<canvas id="fx"></canvas>

<div id="flash"></div>


<script>

(() => {

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const frame =
    document.getElementById(
        "frame"
    );

const photo =
    document.getElementById(
        "photo"
    );

const scratch =
    document.getElementById(
        "scratch"
    );

const fx =
    document.getElementById(
        "fx"
    );

const progress =
    document.getElementById(
        "progress"
    );

const message =
    document.getElementById(
        "message"
    );

const shine =
    document.getElementById(
        "shine"
    );

const flash =
    document.getElementById(
        "flash"
    );

const scratchGlow =
    document.getElementById(
        "scratchGlow"
    );

const stars =
    document.getElementById(
        "stars"
    );


/* =========================================================
   CONTEXTS
========================================================= */

const sc =
    scratch.getContext(
        "2d",
        {
            alpha:true
        }
    );

const fc =
    fx.getContext(
        "2d",
        {
            alpha:true
        }
    );


/* =========================================================
   STATE
========================================================= */

let W=1;
let H=1;

let DPR=1;

let drawing=false;

let completed=false;

let lastPoint=null;

let reveal=0;

let lastMeasure=0;

let previousTime=
    performance.now();

let particles=[];

const MAX_PARTICLES=850;


/* =========================================================
   STARS
========================================================= */

for(let i=0;i<82;i++){

    const star =
        document.createElement(
            "i"
        );

    star.className="star";

    const size =
        .7+
        Math.random()*1.8;

    star.style.width=
        size+"px";

    star.style.height=
        size+"px";

    star.style.left=
        Math.random()*100+
        "%";

    star.style.top=
        Math.random()*100+
        "%";

    star.style.setProperty(
        "--time",
        (
            2.5+
            Math.random()*5
        )+"s"
    );

    star.style.setProperty(
        "--delay",
        (
            -Math.random()*6
        )+"s"
    );

    stars.appendChild(
        star
    );
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const r =
        photo.getBoundingClientRect();

    let old=null;

    if(
        scratch.width &&
        scratch.height
    ){

        old =
            document.createElement(
                "canvas"
            );

        old.width=
            scratch.width;

        old.height=
            scratch.height;

        old
            .getContext("2d")
            .drawImage(
                scratch,
                0,
                0
            );
    }


    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        Math.max(
            1,
            Math.round(r.width)
        );

    H =
        Math.max(
            1,
            Math.round(r.height)
        );


    scratch.width=
        Math.round(
            W*DPR
        );

    scratch.height=
        Math.round(
            H*DPR
        );

    scratch.style.width=
        W+"px";

    scratch.style.height=
        H+"px";


    sc.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );


    if(old){

        sc.drawImage(
            old,
            0,
            0,
            old.width,
            old.height,
            0,
            0,
            W,
            H
        );

    }else{

        createSurface();
    }


    fx.width=
        Math.round(
            window.innerWidth*DPR
        );

    fx.height=
        Math.round(
            window.innerHeight*DPR
        );

    fx.style.width=
        window.innerWidth+
        "px";

    fx.style.height=
        window.innerHeight+
        "px";

    fc.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    lastPoint=null;
}


/* =========================================================
   ARTISTIC SCRATCH SURFACE
========================================================= */

function createSurface(){

    sc.save();

    sc.globalCompositeOperation=
        "source-over";


    /*
       پایه‌ی مخملی صورتی
    */

    const base =
        sc.createLinearGradient(
            0,
            0,
            W,
            H
        );

    base.addColorStop(
        0,
        "#f7c0d7"
    );

    base.addColorStop(
        .18,
        "#b84a7e"
    );

    base.addColorStop(
        .42,
        "#68133b"
    );

    base.addColorStop(
        .62,
        "#c95087"
    );

    base.addColorStop(
        .82,
        "#78163f"
    );

    base.addColorStop(
        1,
        "#d46b9a"
    );


    sc.fillStyle=base;

    sc.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       لکه‌های نور مثل رنگ روغن
    */

    for(
        let i=0;
        i<22;
        i++
    ){

        const x=
            Math.random()*W;

        const y=
            Math.random()*H;

        const radius=
            25+
            Math.random()*90;

        const glow =
            sc.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                radius
            );

        glow.addColorStop(
            0,
            "rgba(255,235,245,.18)"
        );

        glow.addColorStop(
            .5,
            "rgba(255,115,174,.07)"
        );

        glow.addColorStop(
            1,
            "rgba(255,115,174,0)"
        );

        sc.fillStyle=glow;

        sc.beginPath();

        sc.arc(
            x,
            y,
            radius,
            0,
            Math.PI*2
        );

        sc.fill();
    }


    /*
       ذرات بافت
    */

    for(
        let i=0;
        i<900;
        i++
    ){

        const alpha=
            .025+
            Math.random()*.035;

        sc.fillStyle=
            `rgba(
                255,
                255,
                255,
                ${alpha}
            )`;

        sc.fillRect(
            Math.random()*W,
            Math.random()*H,
            .6+
            Math.random()*.8,
            .6+
            Math.random()*.8
        );
    }


    /*
       چند خط بسیار محو، شبیه قلم‌مو
    */

    sc.globalAlpha=.035;

    sc.strokeStyle="#fff";

    sc.lineWidth=1;

    for(
        let i=0;
        i<18;
        i++
    ){

        const y=
            Math.random()*H;

        sc.beginPath();

        sc.moveTo(
            -30,
            y
        );

        sc.bezierCurveTo(
            W*.3,
            y-30,
            W*.65,
            y+25,
            W+30,
            y-10
        );

        sc.stroke();
    }

    sc.restore();
}


/* =========================================================
   INIT
========================================================= */

photo.addEventListener(
    "load",
    resize
);

window.addEventListener(
    "resize",
    resize,
    {passive:true}
);

window.addEventListener(
    "orientationchange",
    () => {
        setTimeout(
            resize,
            120
        );
    },
    {passive:true}
);

resize();


/* =========================================================
   COORDINATES
========================================================= */

function getPoint(e){

    const r=
        scratch.getBoundingClientRect();

    return {

        x:
            Math.max(
                0,
                Math.min(
                    W,
                    e.clientX-r.left
                )
            ),

        y:
            Math.max(
                0,
                Math.min(
                    H,
                    e.clientY-r.top
                )
            )
    };
}


/* =========================================================
   ERASE
========================================================= */

function erase(x,y){

    const radius=34;

    sc.save();

    sc.globalCompositeOperation=
        "destination-out";


    const g =
        sc.createRadialGradient(
            x,
            y,
            radius*.08,
            x,
            y,
            radius
        );

    g.addColorStop(
        0,
        "rgba(0,0,0,1)"
    );

    g.addColorStop(
        .55,
        "rgba(0,0,0,.98)"
    );

    g.addColorStop(
        .80,
        "rgba(0,0,0,.70)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    sc.fillStyle=g;

    sc.beginPath();

    sc.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    sc.fill();

    sc.restore();
}


/* =========================================================
   SMOOTH LINE
========================================================= */

function eraseLine(a,b){

    const distance=
        Math.hypot(
            b.x-a.x,
            b.y-a.y
        );

    const steps=
        Math.max(
            1,
            Math.ceil(
                distance/9
            )
        );

    for(
        let i=0;
        i<=steps;
        i++
    ){

        const t=
            i/steps;

        erase(
            a.x+
            (b.x-a.x)*t,

            a.y+
            (b.y-a.y)*t
        );
    }
}


/* =========================================================
   REVEAL CHECK
========================================================= */

const sample=
    document.createElement(
        "canvas"
    );

sample.width=72;
sample.height=48;

const sm=
    sample.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );


function measureReveal(){

    sm.clearRect(
        0,
        0,
        72,
        48
    );

    sm.drawImage(
        scratch,
        0,
        0,
        scratch.width,
        scratch.height,
        0,
        0,
        72,
        48
    );

    const pixels=
        sm.getImageData(
            0,
            0,
            72,
            48
        ).data;

    let transparent=0;

    for(
        let i=3;
        i<pixels.length;
        i+=4
    ){

        if(
            pixels[i]<50
        ){
            transparent++;
        }
    }

    reveal=
        transparent/
        (72*48)*
        100;

    progress.style.width=
        Math.min(
            100,
            reveal
        )+"%";


    /*
       فقط بعد از 97 درصد
       بررسی دقیق‌تر انجام می‌دهیم.
    */

    if(reveal<97){
        return false;
    }


    let coveredCells=0;

    for(
        let gy=0;
        gy<48;
        gy+=6
    ){

        for(
            let gx=0;
            gx<72;
            gx+=6
        ){

            let opaque=0;
            let total=0;

            for(
                let y=gy;
                y<Math.min(
                    gy+6,
                    48
                );
                y++
            ){

                for(
                    let x=gx;
                    x<Math.min(
                        gx+6,
                        72
                    );
                    x++
                ){

                    const alpha=
                        pixels[
                            (
                                y*72+x
                            )*4+3
                        ];

                    total++;

                    if(alpha>75){
                        opaque++;
                    }
                }
            }

            if(
                opaque/total>.28
            ){
                coveredCells++;
            }
        }
    }


    return coveredCells<8;
}

/* =========================================================
   DUST FROM ACTUAL FRAME EDGES
========================================================= */

function edgeDust(p){

    const fr=
        frame.getBoundingClientRect();

    const sr=
        scratch.getBoundingClientRect();


    const x=
        sr.left+p.x;

    const y=
        sr.top+p.y;


    const distances=[

        {
            side:"left",
            value:
                Math.abs(
                    x-fr.left
                )
        },

        {
            side:"right",
            value:
                Math.abs(
                    x-fr.right
                )
        },

        {
            side:"top",
            value:
                Math.abs(
                    y-fr.top
                )
        },

        {
            side:"bottom",
            value:
                Math.abs(
                    y-fr.bottom
                )
        }

    ];


    distances.sort(
        (a,b)=>
            a.value-b.value
    );


    const side=
        distances[0].side;


    for(
        let i=0;
        i<2;
        i++
    ){

        let px;
        let py;
        let vx;
        let vy;


        if(side==="left"){

            px=
                fr.left+
                rand(-2,6);

            py=
                y+
                rand(-20,20);

            vx=
                rand(3,18);

            vy=
                rand(28,78);

        }

        else if(side==="right"){

            px=
                fr.right+
                rand(-6,2);

            py=
                y+
                rand(-20,20);

            vx=
                rand(-18,-3);

            vy=
                rand(28,78);

        }

        else if(side==="top"){

            px=
                x+
                rand(-20,20);

            py=
                fr.top+
                rand(-2,5);

            vx=
                rand(-10,10);

            vy=
                rand(30,80);

        }

        else{

            px=
                x+
                rand(-20,20);

            py=
                fr.bottom+
                rand(-2,4);

            vx=
                rand(-8,8);

            vy=
                rand(15,45);
        }


        makeDust(
            px,
            py,
            vx,
            vy,
            rand(.8,2.6),
            rand(.7,1.5)
        );
    }
}

/* =========================================================
   AUDIO
========================================================= */

let audioContext=null;
let master=null;


function initAudio(){

    if(audioContext){

        if(
            audioContext.state===
            "suspended"
        ){

            audioContext.resume()
                .catch(()=>{});
        }

        return;
    }


    try{

        audioContext=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

        master=
            audioContext.createGain();

        master.gain.value=.07;

        master.connect(
            audioContext.destination
        );

    }catch(e){}
}


function scratchAudio(){

    initAudio();

    if(!audioContext){
        return;
    }


    const now=
        audioContext.currentTime;


    const length=
        Math.floor(
            audioContext.sampleRate*
            .045
        );


    const buffer=
        audioContext.createBuffer(
            1,
            length,
            audioContext.sampleRate
        );


    const data=
        buffer.getChannelData(0);


    for(
        let i=0;
        i<length;
        i++
    ){

        data[i]=
            (
                Math.random()*2-1
            )*
            (
                1-i/length
            );
    }


    const source=
        audioContext.createBufferSource();

    source.buffer=
        buffer;


    const filter=
        audioContext.createBiquadFilter();

    filter.type=
        "bandpass";

    filter.frequency.value=
        rand(1800,3200);

    filter.Q.value=.8;


    const gain=
        audioContext.createGain();

    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .045,
        now+.006
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.043
    );


    source.connect(filter);

    filter.connect(gain);

    gain.connect(master);

    source.start(now);

    source.stop(
        now+.05
    );
}


function musicalNote(
    frequency,
    delay,
    volume=.07,
    duration=.8
){

    initAudio();

    if(!audioContext){
        return;
    }


    const now=
        audioContext.currentTime+
        delay;


    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();


    osc.type=
        "sine";

    osc.frequency.value=
        frequency;


    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now+.025
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+duration
    );


    osc.connect(gain);

    gain.connect(master);


    osc.start(now);

    osc.stop(
        now+
        duration+
        .03
    );
}

/* =========================================================
   SCRATCH START
========================================================= */

function startScratch(e){

    if(completed){
        return;
    }


    drawing=true;

    initAudio();


    const p=
        getPoint(e);


    lastPoint=p;


    erase(
        p.x,
        p.y
    );


    edgeDust(p);

    scratchEffects(p);

    scratchAudio();


    e.preventDefault();
}


/* =========================================================
   SCRATCH MOVE
========================================================= */

function moveScratch(e){

    if(
        !drawing ||
        completed
    ){
        return;
    }


    const p=
        getPoint(e);


    if(lastPoint){

        eraseLine(
            lastPoint,
            p
        );
    }


    lastPoint=p;


    edgeDust(p);

    scratchEffects(p);


    const now=
        performance.now();


    if(
        now-lastMeasure>
        180
    ){

        lastMeasure=now;


        if(
            measureReveal()
        ){

            finish();
        }
    }


    e.preventDefault();
}


/* =========================================================
   SCRATCH END
========================================================= */

function endScratch(){

    drawing=false;

    lastPoint=null;
}

/* =========================================================
   PARTICLE LOOP
========================================================= */

function updateParticles(dt){

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];


        p.life-=dt;


        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );

            continue;
        }


        p.vy+=
            p.gravity*dt;


        p.x+=
            p.vx*dt;

        p.y+=
            p.vy*dt;


        const damping=
            Math.pow(
                p.drag,
                dt*60
            );


        p.vx*=damping;

        p.vy*=damping;


        if(
            p.rotation!==undefined
        ){

            p.rotation+=
                p.spin*dt;
        }


        if(
            p.type==="ring"
        ){

            p.radius+=
                p.speed*dt;
        }
    }
}


/* =========================================================
   DRAW
========================================================= */

function drawHeart(
    ctx,
    x,
    y,
    size,
    alpha,
    rotation
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation||0
    );

    ctx.scale(
        size,
        size
    );


    ctx.beginPath();


    ctx.moveTo(
        0,
        .38
    );


    ctx.bezierCurveTo(
        -.85,
        -.2,
        -1.05,
        -.88,
        -.43,
        -1
    );


    ctx.bezierCurveTo(
        -.08,
        -1.1,
        .05,
        -.72,
        0,
        -.46
    );


    ctx.bezierCurveTo(
        .05,
        -.72,
        .18,
        -1.1,
        .43,
        -1
    );


    ctx.bezierCurveTo(
        1.05,
        -.88,
        .85,
        -.2,
        0,
        .38
    );


    ctx.closePath();


    ctx.fillStyle=
        `rgba(
            255,
            88,
            155,
            ${alpha}
        )`;


    ctx.shadowBlur=
        7;

    ctx.shadowColor=
        "rgba(255,50,140,.55)";


    ctx.fill();


    ctx.restore();
}


function drawParticles(){

    fc.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    for(
        const p of particles
    ){

        const alpha=
            Math.max(
                0,
                Math.min(
                    1,
                    p.life/p.maxLife
                )
            );


        if(
            p.type==="dust"
        ){

            fc.beginPath();

            fc.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI*2
            );


            fc.fillStyle=
                `rgba(
                    255,
                    ${120+Math.random()*55},
                    ${165+Math.random()*60},
                    ${alpha*.8}
                )`;


            fc.fill();
        }


        else if(
            p.type==="heart"
        ){

            drawHeart(
                fc,
                p.x,
                p.y,
                p.size,
                alpha,
                p.rotation
            );
        }


        else if(
            p.type==="spark"
        ){

            fc.save();

            fc.translate(
                p.x,
                p.y
            );

            fc.rotate(
                p.rotation
            );


            fc.strokeStyle=
                `rgba(
                    255,
                    225,
                    240,
                    ${alpha}
                )`;

            fc.lineWidth=
                1;


            fc.beginPath();

            fc.moveTo(
                -p.size,
                0
            );

            fc.lineTo(
                p.size,
                0
            );

            fc.moveTo(
                0,
                -p.size
            );

            fc.lineTo(
                0,
                p.size
            );

            fc.stroke();

            fc.restore();
        }


        else if(
            p.type==="ring"
        ){

            fc.beginPath();

            fc.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI*2
            );


            fc.strokeStyle=
                `rgba(
                    255,
                    144,
                    195,
                    ${alpha*.65}
                )`;


            fc.lineWidth=
                1.5;


            fc.shadowBlur=
                16;

            fc.shadowColor=
                "rgba(255,45,140,.65)";


            fc.stroke();


            fc.shadowBlur=0;
        }
    }
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

    let dt=
        (now-previousTime)/
        1000;


    previousTime=now;


    dt=
        Math.min(
            dt,
            .033
        );


    updateParticles(dt);

    drawParticles();


    requestAnimationFrame(
        loop
    );
}


requestAnimationFrame(
    loop
);
