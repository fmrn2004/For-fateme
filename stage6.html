<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>♥</title>

<style>
:root{
  --p:#ff3f91;
  --p2:#ff9fc7;
  --p3:#ffd9e8;
  --bg:#090006;
  --ease:cubic-bezier(.16,1,.3,1)
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090006
}

body{
  font-family:system-ui,sans-serif;
  user-select:none
}

#stage6{
  position:fixed;
  inset:0;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(
      ellipse at 50% 48%,
      #5b0c36 0,
      #30091e 28%,
      #15030e 58%,
      #050003 100%
    );
  cursor:pointer;
  touch-action:none
}

#stage6:before{
  content:"";
  position:absolute;
  inset:-20%;
  background:
    conic-gradient(
      from 180deg at 50% 50%,
      transparent,
      #ff2d8710,
      transparent,
      #ff78ae0d,
      transparent
    );
  animation:spin 34s linear infinite;
  filter:blur(15px)
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* BACKGROUND */

.bg,
.bg i{
  position:absolute;
  inset:0;
  pointer-events:none
}

.bg i{
  display:block;
  border-radius:50%;
  filter:blur(80px);
  mix-blend-mode:screen
}

.b1{
  background:#ff2d871c;
  width:70vmax!important;
  height:70vmax!important;
  left:-30vmax!important;
  top:-20vmax!important;
  animation:blob1 17s ease-in-out infinite
}

.b2{
  background:#ff80b31a;
  width:55vmax!important;
  height:55vmax!important;
  right:-25vmax!important;
  bottom:-20vmax!important;
  animation:blob2 21s ease-in-out infinite
}

.b3{
  background:#ff1f6d16;
  width:35vmax!important;
  height:35vmax!important;
  left:35%;
  top:28%;
  animation:blob3 12s ease-in-out infinite
}

.b4{
  background:#fff0f80a;
  width:25vmax!important;
  height:25vmax!important;
  left:8%;
  bottom:12%;
  animation:blob2 15s ease-in-out infinite reverse
}

@keyframes blob1{
  50%{
    transform:
      translate(18vmax,12vh)
      scale(1.2)
  }
}

@keyframes blob2{
  50%{
    transform:
      translate(-15vmax,-10vh)
      scale(.75)
  }
}

@keyframes blob3{
  50%{
    transform:scale(1.5);
    opacity:.45
  }
}

/* STARS */

#stars,
#dust,
#fx{
  position:absolute;
  inset:0;
  pointer-events:none
}

#stars{
  z-index:2
}

.star{
  position:absolute;
  width:var(--s);
  height:var(--s);
  left:var(--x);
  top:var(--y);
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 8px #fff,
    0 0 18px #ff6ca8;
  opacity:0;
  animation:
    twinkle
    var(--d)
    var(--delay)
    ease-in-out
    infinite
}

@keyframes twinkle{
  50%{
    opacity:var(--o);
    transform:scale(1.4)
  }
}

/* DUST */

#dust{
  z-index:3
}

.dust{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--s);
  height:var(--s);
  border-radius:50%;
  background:#ffd9e8;
  opacity:.25;
  box-shadow:0 0 7px #ff82b7;
  animation:
    dust
    var(--d)
    var(--delay)
    ease-in-out
    infinite
}

@keyframes dust{
  50%{
    transform:
      translate(
        var(--dx),
        var(--dy)
      );
    opacity:.75
  }
}

/* CINEMATIC INTRO */

.intro{
  position:absolute;
  inset:0;
  z-index:1000;
  background:#050003;
  display:grid;
  place-items:center;
  transition:
    opacity
    1.4s
    var(--ease);
  pointer-events:none
}

.intro.hide{
  opacity:0
}

.intro:after{
  content:"";
  width:8vmin;
  height:8vmin;
  border-radius:50%;
  background:#fff;

  box-shadow:
    0 0 25px #fff,
    0 0 90px #ff3f91,
    0 0 180px #ff3f91;

  animation:
    introPulse
    2.4s
    var(--ease)
    forwards
}

@keyframes introPulse{

  0%{
    transform:scale(.02);
    opacity:0
  }

  25%{
    opacity:1
  }

  70%{
    transform:scale(.55)
  }

  100%{
    transform:scale(2.8);
    opacity:0
  }
}

/* SCENE */

.scene{
  position:absolute;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  perspective:1800px
}

.halo{
  position:absolute;
  width:min(1000px,120vw);
  height:min(650px,80vw);
  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      #ff3f9140 0,
      #ff3f9118 35%,
      transparent 70%
    );

  filter:blur(35px);
  animation:
    halo
    5s
    ease-in-out
    infinite
}

.halo2{
  width:60%;
  height:45%;

  background:
    radial-gradient(
      ellipse,
      #ffd5e51c,
      transparent 70%
    );

  filter:blur(60px);

  animation:
    halo
    8s
    ease-in-out
    infinite reverse
}

@keyframes halo{
  50%{
    transform:scale(1.12);
    opacity:.8
  }
}

/* ORBITS */

.orbits{
  position:absolute;
  width:min(1050px,120vw);
  height:min(720px,82vw);
  transform-style:preserve-3d
}

.orbit{
  position:absolute;
  left:50%;
  top:50%;

  border:
    1px solid
    #ff9fc71d;

  border-radius:50%;

  transform:
    translate(-50%,-50%)
    rotate(var(--r));

  animation:
    orb
    var(--d)
    linear
    infinite
}

.o1{
  width:90%;
  height:38%;
  --r:-12deg;
  --d:19s
}

.o2{
  width:72%;
  height:58%;
  --r:27deg;
  --d:27s;
  animation-direction:reverse
}

.o3{
  width:108%;
  height:29%;
  --r:65deg;
  --d:37s
}

.o4{
  width:62%;
  height:72%;
  --r:-58deg;
  --d:43s;
  animation-direction:reverse
}

@keyframes orb{
  to{
    transform:
      translate(-50%,-50%)
      rotate(
        calc(
          var(--r) + 360deg
        )
      )
  }
}

.orbDot{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;

  box-shadow:
    0 0 8px #fff,
    0 0 22px #ff3f91
}

.od1{
  left:3%;
  top:23%
}

.od2{
  right:5%;
  top:31%;
  animation:dotPulse 2s infinite
}

.od3{
  left:11%;
  bottom:16%;
  animation:dotPulse 2.7s infinite
}

.od4{
  right:14%;
  bottom:11%;
  animation:dotPulse 1.8s infinite
}

@keyframes dotPulse{
  50%{
    transform:scale(2);

    box-shadow:
      0 0 15px #fff,
      0 0 40px #ff3f91
  }
}

/* ART */

.art{
  position:relative;

  width:min(900px,91vw);
  height:min(535px,57vw);

  min-height:205px;

  transform-style:preserve-3d;

  will-change:transform
}

.shadow{
  position:absolute;
  inset:10% 7% -10%;

  background:#000b;

  border-radius:50%;

  filter:blur(42px);

  transform:translateY(14%)
}

.frame{
  position:absolute;
  inset:0;

  border-radius:42px;

  transform-style:preserve-3d;

  transition:
    transform
    .15s
    ease-out;

  animation:
    float
    7s
    ease-in-out
    infinite;

  will-change:transform
}

.back,
.mid,
.front{
  position:absolute;
  inset:0;
  border-radius:inherit
}

.back{
  transform:
    translateZ(-42px)
    scale(.96);

  background:#16000b;

  box-shadow:
    0 55px 110px #000e
}

.mid{
  transform:
    translateZ(-20px)
    scale(.985);

  background:
    linear-gradient(
      135deg,
      #fff,
      #ff76aa 8%,
      #ff2e7e 25%,
      #400822 53%,
      #ff4d91 82%,
      #fff
    );

  box-shadow:
    0 0 45px #ff2e7e55
}

.front{
  padding:9px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #ff9fc7 9%,
      #ff3f91 25%,
      #38071f 53%,
      #ff75aa 82%,
      #fff
    );

  box-shadow:
    0 45px 110px #000d,
    inset 0 0 0 1px #fff9
}

@keyframes float{
  50%{
    transform:translateY(-7px)
  }
}

/* PHOTO */

.photo{
  position:relative;
  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:34px;

  background:#14020b;

  box-shadow:
    inset 0 0 0 1px #fff3,
    inset 0 0 80px #ff247622
}

.photo img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center;

  transform:scale(1.025);

  filter:
    saturate(1.05)
    contrast(1.03);

  animation:
    breath
    11s
    ease-in-out
    infinite
}

@keyframes breath{
  50%{
    transform:scale(1.055)
  }
}

.photo:after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      120deg,
      #fff2,
      transparent 22%
    ),
    radial-gradient(
      ellipse at 50% -10%,
      #fff2,
      transparent 42%
    ),
    inset 0 0 70px #0005;

  pointer-events:none
}

/* GLASS */

.glass{
  position:absolute;
  inset:0;

  border-radius:inherit;

  z-index:8;

  background:
    linear-gradient(
      125deg,
      #fff4,
      transparent 19%,
      transparent 72%,
      #fff2
    );

  pointer-events:none
}

/* SHINE */

.shine{
  position:absolute;

  top:-70%;
  left:-100%;

  width:34%;
  height:240%;

  transform:rotate(22deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      #fff1,
      #fff5,
      transparent
    );

  filter:blur(2px);

  animation:
    shine
    8s
    2s
    ease-in-out
    infinite;

  pointer-events:none
}

@keyframes shine{

  0%,35%{
    left:-100%;
    opacity:0
  }

  48%{
    opacity:1
  }

  70%,100%{
    left:155%;
    opacity:0
  }
}

/* CORNERS */

.corner{
  position:absolute;

  width:70px;
  height:70px;

  z-index:12;

  filter:
    drop-shadow(
      0 0 8px
      #ff3f91
    )
}

.corner:before,
.corner:after{
  content:"";
  position:absolute;

  background:
    linear-gradient(
      90deg,
      #fff,
      #ff3f91
    )
}

.corner:before{
  width:100%;
  height:2px
}

.corner:after{
  width:2px;
  height:100%
}

.ctl{
  left:3px;
  top:3px
}

.ctr{
  right:3px;
  top:3px;
  transform:rotate(90deg)
}

.cbl{
  left:3px;
  bottom:3px;
  transform:rotate(270deg)
}

.cbr{
  right:3px;
  bottom:3px;
  transform:rotate(180deg)
}

/* FLOATING SPARKS */

.frameSpark{
  position:absolute;

  z-index:15;

  color:#fff;

  font-size:14px;

  text-shadow:
    0 0 12px
    #ff3f91;

  animation:
    fs
    3s
    ease-in-out
    infinite
}

.fs1{
  left:-16px;
  top:18%
}

.fs2{
  right:-16px;
  top:28%;
  animation-delay:.8s
}

.fs3{
  left:18%;
  bottom:-18px;
  animation-delay:1.4s
}

.fs4{
  right:12%;
  bottom:-18px;
  animation-delay:2s
}

@keyframes fs{
  50%{
    transform:
      translateY(-10px)
      scale(1.35);

    opacity:.4
  }
}

/* HEART */

.heart{
  position:absolute;

  bottom:7%;
  left:50%;

  z-index:70;

  transform:translateX(-50%);

  width:70px;
  height:70px;

  display:grid;
  place-items:center
}

.heart:before{
  content:"";

  position:absolute;
  inset:0;

  border-radius:50%;

  background:#ff3f9140;

  filter:blur(12px);

  animation:
    heartAura
    1.8s
    ease-in-out
    infinite
}

.heart:after{
  content:"♥";

  position:relative;

  color:#ff4b91;

  font-size:32px;

  filter:
    drop-shadow(
      0 0 12px
      #ff3f91
    );

  animation:
    beat
    1.8s
    ease-in-out
    infinite
}

@keyframes beat{

  0%,100%{
    transform:scale(1)
  }

  14%{
    transform:scale(1.25)
  }

  28%{
    transform:scale(.96)
  }

  42%{
    transform:scale(1.12)
  }
}

@keyframes heartAura{
  50%{
    transform:scale(1.5);
    opacity:.35
  }
}

/* EXTRA FRAME LIGHT */

.cornerGlow{
  position:absolute;
  inset:-1px;

  border-radius:42px;

  box-shadow:
    0 0 0 1px #ffffff55,
    0 0 35px #ff3f9130,
    0 0 90px #ff3f9120;

  pointer-events:none;
  z-index:20
}

.lightLine{
  position:absolute;
  inset:-30px;

  border-radius:55px;

  border:
    1px solid
    #ffb8d71a;

  filter:blur(.3px);

  animation:
    ringBreath
    5s
    ease-in-out
    infinite;

  pointer-events:none
}

@keyframes ringBreath{
  50%{
    transform:scale(1.015);
    opacity:.5
  }
}

/* PARTICLES */

.burst{
  position:absolute;

  left:var(--x);
  top:var(--y);

  width:var(--s);
  height:var(--s);

  border-radius:50%;

  background:var(--c);

  box-shadow:
    0 0 8px #fff,
    0 0 20px var(--c);

  animation:
    burst
    var(--d)
    var(--delay)
    var(--ease)
    forwards
}

.bh{
  position:absolute;

  left:var(--x);
  top:var(--y);

  font-size:var(--s);

  color:var(--c);

  filter:
    drop-shadow(
      0 0 9px
      #ff3f91
    );

  animation:
    bh
    var(--d)
    var(--delay)
    var(--ease)
    forwards
}

@keyframes burst{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.1)
  }

  12%{
    opacity:1
  }

  100%{
    opacity:0;

    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(.05)
  }
}

@keyframes bh{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.1)
      rotate(0)
  }

  12%{
    opacity:1
  }

  100%{
    opacity:0;

    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(.35)
      rotate(var(--r))
  }
}

/* RINGS */

.ringFx{
  position:absolute;

  left:var(--x);
  top:var(--y);

  width:25px;
  height:25px;

  border:
    1px solid
    #fff;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  animation:
    ringFx
    1.1s
    var(--ease)
    forwards;

  box-shadow:
    0 0 18px
    #ff3f91
}

@keyframes ringFx{
  to{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(9)
  }
}

/* FLASH */

.flash{
  position:absolute;
  inset:0;

  z-index:900;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      circle at
      var(--x)
      var(--y),
      #fff8,
      transparent 25%
    )
}

.flash.go{
  animation:
    flash
    .65s
    ease-out
    forwards
}

@keyframes flash{

  0%{
    opacity:0
  }

  12%{
    opacity:1
  }

  100%{
    opacity:0
  }
}

/* MOBILE */

@media(max-width:700px){

  .art{
    width:94vw;
    height:53vw;
    min-height:175px
  }

  .front{
    padding:6px
  }

  .photo{
    border-radius:25px
  }

  .back,
  .mid,
  .front{
    border-radius:30px
  }

  .corner{
    width:43px;
    height:43px
  }

  .orbits{
    width:120vw;
    height:80vw
  }

  .heart{
    bottom:5%;
    width:55px;
    height:55px
  }

  .heart:after{
    font-size:25px
  }
}

@media(max-width:430px){

  .art{
    width:96vw;
    height:53vw;
    min-height:160px
  }

  .front{
    padding:5px
  }

  .photo{
    border-radius:21px
  }

  .back,
  .mid,
  .front{
    border-radius:25px
  }

  .corner{
    width:31px;
    height:31px
  }

  .lightLine{
    inset:-18px
  }

  .frameSpark{
    font-size:10px
  }
}

@media(prefers-reduced-motion:reduce){

  *{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important
  }
}
</style>
</head>

<body>

<section id="stage6">

  <div class="bg">
    <i class="b1"></i>
    <i class="b2"></i>
    <i class="b3"></i>
    <i class="b4"></i>
  </div>

  <div id="stars"></div>
  <div id="dust"></div>
  <div id="fx"></div>

  <!-- CINEMATIC INTRO -->
  <div class="intro" id="intro"></div>

  <div class="scene">

    <div class="halo"></div>
    <div class="halo halo2"></div>

    <!-- ORBIT SYSTEM -->
    <div class="orbits">

      <i class="orbit o1"></i>
      <i class="orbit o2"></i>
      <i class="orbit o3"></i>
      <i class="orbit o4"></i>

      <b class="orbDot od1"></b>
      <b class="orbDot od2"></b>
      <b class="orbDot od3"></b>
      <b class="orbDot od4"></b>

    </div>

    <!-- MAIN ART -->
    <div class="art" id="art">

      <div class="shadow"></div>

      <div class="lightLine"></div>

      <div class="frame" id="frame">

        <div class="back"></div>
        <div class="mid"></div>

        <div class="front">

          <div class="photo">

            <img
              id="lovePhoto"
              src="final.jpg"
              alt=""
              draggable="false"
            >

            <span class="shine"></span>

          </div>

          <div class="glass"></div>

          <i class="corner ctl"></i>
          <i class="corner ctr"></i>
          <i class="corner cbl"></i>
          <i class="corner cbr"></i>

          <i class="cornerGlow"></i>

        </div>

        <i class="frameSpark fs1">✦</i>
        <i class="frameSpark fs2">✦</i>
        <i class="frameSpark fs3">✧</i>
        <i class="frameSpark fs4">✦</i>

      </div>

      <div class="heart"></div>

    </div>

  </div>

  <div class="flash" id="flash"></div>

</section>


<script>

(()=>{

"use strict";

const
S=document.getElementById("stage6"),
stars=document.getElementById("stars"),
dust=document.getElementById("dust"),
fx=document.getElementById("fx"),
intro=document.getElementById("intro"),
frame=document.getElementById("frame"),
art=document.getElementById("art"),
flash=document.getElementById("flash");

const
R=(a,b)=>Math.random()*(b-a)+a,
RI=(a,b)=>Math.floor(R(a,b+1));

const mobile=innerWidth<650;


/* CREATE STARS */

for(
  let i=0;
  i<(mobile?55:110);
  i++
){

  let e=document.createElement("i");

  e.className="star";

  e.style.cssText=`
    --x:${R(0,100)}%;
    --y:${R(0,100)}%;
    --s:${R(.5,3)}px;
    --d:${R(2,7)}s;
    --delay:${R(-7,0)}s;
    --o:${R(.2,.9)}
  `;

  stars.appendChild(e);

}


/* CREATE DUST */

for(
  let i=0;
  i<(mobile?45:95);
  i++
){

  let e=document.createElement("i");

  e.className="dust";

  e.style.cssText=`
    --x:${R(0,100)}%;
    --y:${R(0,100)}%;
    --s:${R(.5,2.2)}px;
    --d:${R(5,13)}s;
    --delay:${R(-13,0)}s;
    --dx:${R(-60,60)}px;
    --dy:${R(-50,50)}px
  `;

  dust.appendChild(e);

}


/* INTRO */

setTimeout(
  ()=>{
    intro.classList.add("hide")
  },
  2600
);


/* AUDIO */

let audio=null;

function sound(big=false){

  try{

    audio ??=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(audio.state==="suspended")
      audio.resume();

    let t=audio.currentTime;

    [
      523.25,
      659.25,
      big?783.99:0
    ].forEach((f,i)=>{

      if(!f)return;

      let o=audio.createOscillator();
      let g=audio.createGain();

      o.type="sine";

      o.frequency.value=f;

      g.gain.setValueAtTime(
        0,
        t+i*.07
      );

      g.gain.exponentialRampToValueAtTime(
        big?.035:.022,
        t+i*.07+.35
      );

      g.gain.exponentialRampToValueAtTime(
        .001,
        t+i*.07+.8
      );

      o.connect(g).connect(audio.destination);

      o.start(t+i*.07);

      o.stop(t+i*.07+.82);

    });

  }catch(e){}

}


/* RING */

function ring(x,y,scale=1){

  let e=document.createElement("i");

  e.className="ringFx";

  e.style.cssText=`
    --x:${x}px;
    --y:${y}px;
    transform:
      translate(-50%,-50%)
      scale(${scale})
  `;

  fx.appendChild(e);

  setTimeout(
    ()=>e.remove(),
    1200
  );

}


/* PARTICLE */

function particle(x,y,big=false){

  let e=document.createElement("i");

  e.className="burst";

  let a=R(0,Math.PI*2);

  let d=R(
    big?90:45,
    big?340:180
  );

  e.style.cssText=`
    --x:${x}px;
    --y:${y}px;
    --s:${R(1,4)}px;
    --c:${
      [
        "#fff",
        "#ff70aa",
        "#ffb4d1",
        "#ffddeb"
      ][RI(0,3)]
    };
    --dx:${Math.cos(a)*d}px;
    --dy:${Math.sin(a)*d}px;
    --d:${R(.6,1.35)}s;
    --delay:${R(0,.08)}s
  `;

  fx.appendChild(e);

  setTimeout(
    ()=>e.remove(),
    1500
  );

}


/* HEART PARTICLE */

function heart(x,y,big=false){

  let e=document.createElement("i");

  e.className="bh";

  let a=R(0,Math.PI*2);

  let d=R(
    big?100:40,
    big?330:190
  );

  e.textContent=
    Math.random()<.85
      ?"♥"
      :"♡";

  e.style.cssText=`
    --x:${x}px;
    --y:${y}px;
    --s:${R(
      big?16:10,
      big?42:28
    )}px;
    --c:${
      [
        "#ff4b91",
        "#ff8db8",
        "#ffd0e1",
        "#fff"
      ][RI(0,3)]
    };
    --dx:${Math.cos(a)*d}px;
    --dy:${Math.sin(a)*d-R(20,100)}px;
    --r:${R(-180,180)}deg;
    --d:${R(.8,1.8)}s;
    --delay:${R(0,.2)}s
  `;

  fx.appendChild(e);

  setTimeout(
    ()=>e.remove(),
    2200
  );

}


/* BURST */

function burst(x,y,big=false){

  sound(big);

  ring(
    x,
    y,
    big?2.2:1
  );

  let n=big?110:30;

  for(
    let i=0;
    i<n;
    i++
  ){

    setTimeout(
      ()=>particle(x,y,big),
      i*(big?5:10)
    );

    if(
      i<(big?55:18)
    ){

      setTimeout(
        ()=>heart(x,y,big),
        i*(big?9:18)
      );

    }

  }

  if(big){

    flash.style.setProperty(
      "--x",
      x+"px"
    );

    flash.style.setProperty(
      "--y",
      y+"px"
    );

    flash.classList.remove("go");

    void flash.offsetWidth;

    flash.classList.add("go");

  }

}


/* PARALLAX */

let
tx=0,
ty=0,
cx=0,
cy=0;

function loop(){

  cx+=(tx-cx)*.06;
  cy+=(ty-cy)*.06;

  frame.style.transform=`
    rotateX(${cy}deg)
    rotateY(${cx}deg)
  `;

  requestAnimationFrame(loop);

}

loop();


/* POINTER */

S.addEventListener(
  "pointermove",
  e=>{

    let r=S.getBoundingClientRect();

    tx=
      ((e.clientX-r.width/2)/r.width)*8;

    ty=
      -((e.clientY-r.height/2)/r.height)*6;

  }
);

S.addEventListener(
  "pointerleave",
  ()=>{
    tx=ty=0
  }
);


/* TOUCH / CLICK */

let
last=0,
hold=false,
interval=null;

S.addEventListener(
  "pointerdown",
  e=>{

    let now=performance.now();

    let big=
      now-last<320;

    last=now;

    burst(
      e.clientX,
      e.clientY,
      big
    );

    hold=true;

    interval=setInterval(
      ()=>{

        if(!hold)return;

        burst(
          e.clientX+R(-25,25),
          e.clientY+R(-25,25),
          false
        );

      },
      big?260:700
    );

  }
);


function up(){

  hold=false;

  clearInterval(interval);

  interval=null;

}

S.addEventListener(
  "pointerup",
  up
);

S.addEventListener(
  "pointercancel",
  up
);


/* DEVICE ORIENTATION */

window.addEventListener(
  "deviceorientation",
  e=>{

    if(e.gamma==null)
      return;

    tx=Math.max(
      -6,
      Math.min(
        6,
        e.gamma/8
      )
    );

    ty=Math.max(
      -5,
      Math.min(
        5,
        (e.beta||0)/12
      )
    );

  },
  {passive:true}
);


/* KEYBOARD */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="Space" ||
      e.code==="Enter"
    ){

      e.preventDefault();

      burst(
        innerWidth/2,
        innerHeight/2,
        true
      );

    }

  }
);


/* DISABLE MENU */

S.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

})();

</script>
