<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Stage 6</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 18%,
            #ffc9dc 0%,
            #fa9fc1 24%,
            #ee739f 52%,
            #d94c7f 78%,
            #b92f65 100%
        );

    touch-action:none;
}


/* =========================================================
   WORLD
========================================================= */

#world{
    position:fixed;
    inset:0;
    overflow:hidden;
}


/* =========================================================
   ATMOSPHERIC LIGHT
========================================================= */

.ambient{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    filter:blur(70px);
    opacity:.3;
}

.ambient.a{
    width:70vw;
    height:70vw;
    left:-25vw;
    top:-30vw;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            rgba(255,255,255,.45) 30%,
            transparent 70%
        );
}

.ambient.b{
    width:65vw;
    height:65vw;
    right:-25vw;
    bottom:-30vw;

    background:
        radial-gradient(
            circle,
            #ff3f89,
            transparent 68%
        );
}

.ambient.c{
    width:40vw;
    height:40vw;
    left:35%;
    top:35%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.28),
            transparent 70%
        );

    filter:blur(90px);
}


/* =========================================================
   TINY BACKGROUND PARTICLES
========================================================= */

#backgroundParticles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.bg-particle{
    position:absolute;

    width:var(--s);
    height:var(--s);

    left:var(--x);
    top:var(--y);

    border-radius:50%;

    background:
        rgba(255,255,255,.7);

    box-shadow:
        0 0 7px rgba(255,255,255,.55);

    opacity:0;

    animation:
        particleFloat
        var(--duration)
        ease-in-out
        infinite;

    animation-delay:var(--delay);
}

@keyframes particleFloat{

    0%{
        transform:
            translate3d(0,20px,0)
            scale(.5);

        opacity:0;
    }

    30%{
        opacity:.45;
    }

    60%{
        transform:
            translate3d(
                var(--mx),
                -35px,
                0
            )
            scale(1);
    }

    100%{
        transform:
            translate3d(
                calc(var(--mx) * -1),
                -80px,
                0
            )
            scale(.4);

        opacity:0;
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

#floatingHearts{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.bg-heart{
    position:absolute;

    left:var(--x);
    bottom:-60px;

    color:rgba(255,255,255,.68);

    font-size:var(--size);

    opacity:0;

    filter:
        drop-shadow(
            0 0 5px
            rgba(255,255,255,.45)
        );

    animation:
        floatHeart
        var(--duration)
        linear
        infinite;

    animation-delay:var(--delay);
}

@keyframes floatHeart{

    0%{
        transform:
            translate3d(0,0,0)
            scale(.55)
            rotate(0deg);

        opacity:0;
    }

    12%{
        opacity:.5;
    }

    48%{
        transform:
            translate3d(
                var(--move),
                -48vh,
                0
            )
            scale(1)
            rotate(9deg);

        opacity:.7;
    }

    78%{
        opacity:.35;
    }

    100%{
        transform:
            translate3d(
                calc(var(--move) * -1),
                -112vh,
                0
            )
            scale(.7)
            rotate(-12deg);

        opacity:0;
    }
}


/* =========================================================
   STAGE
========================================================= */

#stage{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:
        70px
        18px
        110px;
}


/* =========================================================
   ART GROUP
========================================================= */

#artGroup{
    position:relative;

    width:min(92vw,720px);

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =========================================================
   PROGRESS BAR
   کاملاً جدا از متن نهایی
========================================================= */

#progressArea{

    position:absolute;

    left:50%;
    bottom:calc(100% + 27px);

    transform:translateX(-50%);

    width:min(70vw,360px);

    display:flex;
    flex-direction:column;
    align-items:center;

    opacity:0;

    animation:
        progressAppear
        1s
        ease
        1.35s
        forwards;

    pointer-events:none;
}

#progressShell{

    position:relative;

    width:100%;
    height:8px;

    padding:2px;

    border-radius:30px;

    background:
        rgba(255,255,255,.18);

    border:
        1px solid
        rgba(255,255,255,.35);

    box-shadow:
        0 4px 18px
        rgba(95,0,40,.15),

        inset
        0 1px 2px
        rgba(255,255,255,.35);

    backdrop-filter:blur(8px);
}

#progress{

    width:0%;
    height:100%;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffd7e7,
            #fff,
            #ffbdd8
        );

    box-shadow:
        0 0 8px
        rgba(255,255,255,.9),

        0 0 18px
        rgba(255,190,218,.75);

    transition:
        width .1s linear;
}

#percent{

    margin-top:6px;

    color:
        rgba(255,255,255,.82);

    font-size:10px;

    letter-spacing:2px;

    text-shadow:
        0 0 8px
        rgba(255,255,255,.55);
}

@keyframes progressAppear{
    to{
        opacity:1;
    }
}


/* =========================================================
   FRAME
========================================================= */

#art{

    position:relative;

    width:100%;

    aspect-ratio:16 / 10;

    opacity:0;

    transform:
        translateY(60px)
        scale(.65)
        rotateX(15deg);

    filter:
        drop-shadow(
            0 28px 45px
            rgba(91,0,42,.34)
        );

    animation:
        frameEntrance
        1.65s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes frameEntrance{

    0%{
        opacity:0;

        transform:
            translateY(70px)
            scale(.55)
            rotateX(25deg);
    }

    35%{
        opacity:1;

        transform:
            translateY(-10px)
            scale(1.045)
            rotateX(0);
    }

    58%{
        transform:
            translateY(4px)
            scale(.985);
    }

    78%{
        transform:
            translateY(-2px)
            scale(1.01);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1)
            rotateX(0);
    }
}


/* =========================================================
   ENTERING HEARTS
========================================================= */

.enterHeart{

    position:absolute;

    left:50%;
    top:50%;

    z-index:30;

    color:#fff;

    font-size:var(--size);

    opacity:0;

    pointer-events:none;

    text-shadow:
        0 0 8px #fff,
        0 0 16px #ffb0d0;

    animation:
        enterHeart
        1.55s
        cubic-bezier(.16,1,.3,1)
        var(--delay)
        forwards;
}

@keyframes enterHeart{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.1)
            rotate(0);
    }

    18%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(
                calc(-50% + var(--tx)),
                calc(-50% + var(--ty))
            )
            scale(var(--scale))
            rotate(var(--rot));
    }
}


/* =========================================================
   FRAME BORDER
========================================================= */

.frame{

    position:absolute;
    inset:0;

    padding:9px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #ffdce9 12%,
            #f59abb 27%,
            #ce3e73 50%,
            #f7a6c3 73%,
            #fff 91%
        );

    box-shadow:

        0 0 0 1px
        rgba(255,255,255,.45),

        inset
        0 0 0 2px
        rgba(255,255,255,.62),

        inset
        0 0 25px
        rgba(117,0,48,.28),

        0 18px 45px
        rgba(92,0,40,.34);
}


/* second inner border */

.frame::before{

    content:"";

    position:absolute;

    inset:4px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.72);

    pointer-events:none;
}


/* tiny frame shine */

.frame::after{

    content:"";

    position:absolute;

    top:0;
    left:-35%;

    width:30%;
    height:100%;

    transform:skewX(-18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.28),
            transparent
        );

    animation:
        frameShine
        4.5s
        ease-in-out
        infinite;

    pointer-events:none;
}

@keyframes frameShine{

    0%,
    55%{
        left:-35%;
    }

    80%,
    100%{
        left:125%;
    }
}


/* =========================================================
   PHOTO
========================================================= */

.photoWrap{

    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    border-radius:16px;

    background:
        #a52b5a;
}


/* actual image */

#photo{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
    object-position:center;

    user-select:none;
    -webkit-user-drag:none;
}


/* =========================================================
   SCRATCH CANVAS
========================================================= */

#scratch{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    z-index:5;

    touch-action:none;

    cursor:crosshair;
}


/* subtle glass shine */

#surfaceShine{

    position:absolute;
    inset:0;

    z-index:6;

    pointer-events:none;

    border-radius:16px;

    background:

        radial-gradient(
            circle at 25% 20%,
            rgba(255,255,255,.2),
            transparent 23%
        ),

        linear-gradient(
            115deg,
            transparent 25%,
            rgba(255,255,255,.10) 46%,
            transparent 60%
        );

    mix-blend-mode:screen;

    opacity:.8;
}


/* =========================================================
   FINAL MESSAGE
========================================================= */

#finalMessage{

    position:relative;

    margin-top:34px;

    width:100%;

    text-align:center;

    opacity:0;

    transform:
        translateY(25px)
        scale(.82);

    pointer-events:none;

    color:#fff;

    font-size:
        clamp(25px,6vw,46px);

    font-weight:bold;

    white-space:nowrap;

    text-shadow:

        0 0 6px #fff,

        0 0 14px #ffb0d0,

        0 0 28px #ff4c92,

        0 0 48px #ff4c92;
}

#finalMessage.show{

    animation:
        finalMessageIn
        1.45s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes finalMessageIn{

    0%{
        opacity:0;

        transform:
            translateY(35px)
            scale(.65);

        filter:blur(9px);
    }

    45%{
        opacity:1;

        transform:
            translateY(-5px)
            scale(1.08);

        filter:blur(0);
    }

    70%{
        transform:
            translateY(2px)
            scale(.98);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* message decorative line */

#finalMessage::after{

    content:"";

    display:block;

    width:115px;
    height:2px;

    margin:
        13px
        auto
        0;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #fff,
            #ffb9d4,
            #fff,
            transparent
        );

    box-shadow:
        0 0 10px
        rgba(255,255,255,.75);

    animation:
        messageLine
        2s
        ease-in-out
        infinite alternate;
}

@keyframes messageLine{

    from{
        opacity:.4;
        transform:scaleX(.55);
    }

    to{
        opacity:1;
        transform:scaleX(1);
    }
}


/* =========================================================
   FX CANVAS
========================================================= */

#fx{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:100;

    pointer-events:none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    #stage{

        padding:
            75px
            12px
            95px;
    }

    #artGroup{

        width:94vw;
    }

    .frame{

        padding:7px;

        border-radius:19px;
    }

    .photoWrap{

        border-radius:13px;
    }

    #progressArea{

        bottom:calc(100% + 23px);

        width:68vw;
    }

    #finalMessage{

        margin-top:30px;

        font-size:
            clamp(
                24px,
                6.7vw,
                40px
            );
    }
}

</style>
</head>


<body>

<div id="world">

    <div class="ambient a"></div>
    <div class="ambient b"></div>
    <div class="ambient c"></div>

    <div id="backgroundParticles"></div>
    <div id="floatingHearts"></div>


    <main id="stage">

        <div id="artGroup">


            <!-- =================================================
                 PROGRESS
            ================================================= -->

            <div id="progressArea">

                <div id="progressShell">

                    <div id="progress"></div>

                </div>

                <div id="percent">
                    ۰٪
                </div>

            </div>


            <!-- =================================================
                 ART
            ================================================= -->

            <div id="art">


                <!-- entrance hearts -->

                <div
                    class="enterHeart"
                    style="
                    --tx:-170px;
                    --ty:-95px;
                    --scale:1.15;
                    --rot:-24deg;
                    --size:20px;
                    --delay:.05s">
                    ♥
                </div>

                <div
                    class="enterHeart"
                    style="
                    --tx:165px;
                    --ty:-85px;
                    --scale:.9;
                    --rot:22deg;
                    --size:16px;
                    --delay:.13s">
                    ♥
                </div>

                <div
                    class="enterHeart"
                    style="
                    --tx:-210px;
                    --ty:25px;
                    --scale:.72;
                    --rot:-12deg;
                    --size:13px;
                    --delay:.21s">
                    ♥
                </div>

                <div
                    class="enterHeart"
                    style="
                    --tx:205px;
                    --ty:38px;
                    --scale:1.05;
                    --rot:17deg;
                    --size:19px;
                    --delay:.28s">
                    ♥
                </div>

                <div
                    class="enterHeart"
                    style="
                    --tx:-95px;
                    --ty:125px;
                    --scale:.7;
                    --rot:-10deg;
                    --size:14px;
                    --delay:.36s">
                    ♥
                </div>

                <div
                    class="enterHeart"
                    style="
                    --tx:100px;
                    --ty:125px;
                    --scale:.82;
                    --rot:13deg;
                    --size:15px;
                    --delay:.43s">
                    ♥
                </div>


                <!-- FRAME -->

                <div class="frame">

                    <div class="photoWrap">

                        <img
                            id="photo"
                            src="final.jpg"
                            alt=""
                            draggable="false"
                        >

                        <canvas id="scratch"></canvas>

                        <div id="surfaceShine"></div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 FINAL MESSAGE
            ================================================= -->

            <div id="finalMessage">
                بعدنا با تو بهشته
            </div>

        </div>

    </main>


    <canvas id="fx"></canvas>

</div>


<script>

/* =========================================================
   BACKGROUND HEARTS
========================================================= */

const floatingHearts =
    document.getElementById(
        "floatingHearts"
    );

for(let i=0;i<28;i++){

    const h=
        document.createElement("div");

    h.className="bg-heart";

    h.textContent="♥";

    h.style.setProperty(
        "--x",
        Math.random()*100+"%"
    );

    h.style.setProperty(
        "--size",
        (6+Math.random()*14)+"px"
    );

    h.style.setProperty(
        "--duration",
        (8+Math.random()*10)+"s"
    );

    h.style.setProperty(
        "--delay",
        (-Math.random()*17)+"s"
    );

    h.style.setProperty(
        "--move",
        (-45+Math.random()*90)+"px"
    );

    floatingHearts.appendChild(h);
}


/* =========================================================
   BACKGROUND PARTICLES
========================================================= */

const backgroundParticles=
    document.getElementById(
        "backgroundParticles"
    );

for(let i=0;i<45;i++){

    const p=
        document.createElement("div");

    p.className="bg-particle";

    p.style.setProperty(
        "--x",
        Math.random()*100+"%"
    );

    p.style.setProperty(
        "--y",
        Math.random()*100+"%"
    );

    p.style.setProperty(
        "--s",
        (1+Math.random()*2.2)+"px"
    );

    p.style.setProperty(
        "--mx",
        (-25+Math.random()*50)+"px"
    );

    p.style.setProperty(
        "--duration",
        (4+Math.random()*7)+"s"
    );

    p.style.setProperty(
        "--delay",
        (-Math.random()*8)+"s"
    );

    backgroundParticles.appendChild(p);
}


/* =========================================================
   ELEMENTS
========================================================= */

const photo=
    document.getElementById("photo");

const scratch=
    document.getElementById("scratch");

const progress=
    document.getElementById("progress");

const percent=
    document.getElementById("percent");

const progressArea=
    document.getElementById(
        "progressArea"
    );

const finalMessage=
    document.getElementById(
        "finalMessage"
    );

const art=
    document.getElementById("art");

const ctx=
    scratch.getContext(
        "2d",
        {
            alpha:true,
            desynchronized:true
        }
    );

const fx=
    document.getElementById("fx");

const fctx=
    fx.getContext(
        "2d",
        {
            alpha:true,
            desynchronized:true
        }
    );


/* =========================================================
   CANVAS
========================================================= */

let dpr=1;
let W=1;
let H=1;


/* =========================================================
   SCRATCH
========================================================= */

let scratching=false;

let lastX=0;
let lastY=0;

let completed=false;

let lastMeasure=0;

const brushSize=40;


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const rect=
        scratch.getBoundingClientRect();

    if(
        rect.width<10 ||
        rect.height<10
    ){
        return;
    }

    dpr=
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W=rect.width;
    H=rect.height;

    scratch.width=
        Math.round(W*dpr);

    scratch.height=
        Math.round(H*dpr);

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createScratchSurface();

    fx.width=
        Math.round(innerWidth*dpr);

    fx.height=
        Math.round(innerHeight*dpr);

    fctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


/* =========================================================
   ARTISTIC PINK SURFACE
========================================================= */

function createScratchSurface(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* base */

    const base=
        ctx.createLinearGradient(
            0,
            0,
            W,
            H
        );

    base.addColorStop(
        0,
        "#ffc4dc"
    );

    base.addColorStop(
        .2,
        "#f98eb7"
    );

    base.addColorStop(
        .48,
        "#df4e85"
    );

    base.addColorStop(
        .73,
        "#ef6d9d"
    );

    base.addColorStop(
        1,
        "#c63870"
    );

    ctx.fillStyle=base;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* large soft powder clouds */

    for(let i=0;i<45;i++){

        const x=
            Math.random()*W;

        const y=
            Math.random()*H;

        const r=
            15+
            Math.random()*90;

        const g=
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                r
            );

        g.addColorStop(
            0,
            "rgba(255,240,248,.20)"
        );

        g.addColorStop(
            .35,
            "rgba(255,180,211,.10)"
        );

        g.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* tiny powder grains */

    for(let i=0;i<1900;i++){

        const x=
            Math.random()*W;

        const y=
            Math.random()*H;

        const r=
            .25+
            Math.random()*1.15;

        ctx.fillStyle=
            Math.random()>.48
            ?
            "rgba(255,246,250,.20)"
            :
            "rgba(90,0,35,.08)";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* artistic powder strokes */

    for(let i=0;i<28;i++){

        const y=
            Math.random()*H;

        ctx.beginPath();

        ctx.moveTo(
            -20,
            y
        );

        ctx.bezierCurveTo(
            W*.25,
            y+
            Math.random()*35-
            17,

            W*.7,
            y+
            Math.random()*35-
            17,

            W+20,
            y
        );

        ctx.strokeStyle=
            "rgba(255,255,255,.045)";

        ctx.lineWidth=
            1+
            Math.random()*2;

        ctx.stroke();
    }


    /* subtle edge darkness */

    const edge=
        ctx.createRadialGradient(
            W/2,
            H/2,
            Math.min(W,H)*.2,
            W/2,
            H/2,
            Math.max(W,H)*.75
        );

    edge.addColorStop(
        0,
        "rgba(255,255,255,0)"
    );

    edge.addColorStop(
        1,
        "rgba(95,0,40,.18)"
    );

    ctx.fillStyle=edge;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   POINTER POSITION
========================================================= */

function pointerPosition(e){

    const r=
        scratch.getBoundingClientRect();

    return {
        x:e.clientX-r.left,
        y:e.clientY-r.top
    };
}


/* =========================================================
   ERASE
========================================================= */

function eraseAt(x,y){

    if(completed)
        return;

    ctx.save();

    ctx.globalCompositeOperation=
        "destination-out";


    const g=
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            brushSize
        );

    g.addColorStop(
        0,
        "rgba(0,0,0,1)"
    );

    g.addColorStop(
        .48,
        "rgba(0,0,0,.98)"
    );

    g.addColorStop(
        .72,
        "rgba(0,0,0,.72)"
    );

    g.addColorStop(
        .9,
        "rgba(0,0,0,.22)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        brushSize,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();


    scratchDust(x,y);
}


/* =========================================================
   SCRATCH LINE
========================================================= */

function eraseLine(
    x1,
    y1,
    x2,
    y2
){

    const dx=x2-x1;
    const dy=y2-y1;

    const dist=
        Math.sqrt(
            dx*dx+
            dy*dy
        );

    const steps=
        Math.max(
            1,
            Math.ceil(dist/10)
        );

    for(
        let i=0;
        i<=steps;
        i++
    ){

        const t=i/steps;

        eraseAt(
            x1+dx*t,
            y1+dy*t
        );
    }
}


/* =========================================================
   POINTER EVENTS
========================================================= */

scratch.addEventListener(
    "pointerdown",
    e=>{

        if(completed)
            return;

        e.preventDefault();

        scratching=true;

        scratch.setPointerCapture(
            e.pointerId
        );

        const p=
            pointerPosition(e);

        lastX=p.x;
        lastY=p.y;

        eraseAt(
            p.x,
            p.y
        );

        checkReveal(true);
    },
    {passive:false}
);


scratch.addEventListener(
    "pointermove",
    e=>{

        if(
            !scratching ||
            completed
        )
            return;

        e.preventDefault();

        const p=
            pointerPosition(e);

        eraseLine(
            lastX,
            lastY,
            p.x,
            p.y
        );

        lastX=p.x;
        lastY=p.y;

        if(
            performance.now()-
            lastMeasure
            >
            80
        ){

            checkReveal(false);

            lastMeasure=
                performance.now();
        }
    },
    {passive:false}
);


scratch.addEventListener(
    "pointerup",
    ()=>{
        scratching=false;
        checkReveal(true);
    },
    {passive:true}
);

scratch.addEventListener(
    "pointercancel",
    ()=>{
        scratching=false;
    },
    {passive:true}
);


/* =========================================================
   SCRATCH DUST
========================================================= */

function scratchDust(x,y){

    if(Math.random()>.42)
        return;

    const r=
        scratch.getBoundingClientRect();

    const screenX=
        r.left+x;

    const screenY=
        r.top+y;

    for(let i=0;i<2;i++){

        particles.push({

            type:"powder",

            x:screenX,
            y:screenY,

            vx:
                (Math.random()-.5)*
                30,

            vy:
                -10-
                Math.random()*35,

            gravity:
                30+
                Math.random()*30,

            life:
                .3+
                Math.random()*.3,

            max:.6,

            size:
                1+
                Math.random()*2.3,

            alpha:.5
        });
    }
}


/* =========================================================
   REVEAL MEASUREMENT
========================================================= */

function checkReveal(force){

    if(completed)
        return;

    if(
        !force &&
        performance.now()-
        lastMeasure
        <
        70
    ){
        return;
    }

    const sw=54;
    const sh=34;

    const temp=
        document.createElement(
            "canvas"
        );

    temp.width=sw;
    temp.height=sh;

    const tctx=
        temp.getContext("2d");

    tctx.drawImage(
        scratch,
        0,
        0,
        scratch.width,
        scratch.height,
        0,
        0,
        sw,
        sh
    );

    const pixels=
        tctx.getImageData(
            0,
            0,
            sw,
            sh
        ).data;

    let transparent=0;

    for(
        let i=3;
        i<pixels.length;
        i+=4
    ){

        if(pixels[i]<70)
            transparent++;
    }

    let value=
        transparent/
        (sw*sh)*
        100;

    value=
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );

    progress.style.width=
        value.toFixed(1)+"%";

    percent.textContent=
        Math.round(value)+"٪";


    /*
      پایان فقط وقتی رخ می‌دهد که
      تقریباً تمام سطح واقعاً پاک شده باشد.
    */

    if(value>=97){

        finish();
    }
}


/* =========================================================
   FINISH
========================================================= */

function finish(){

    if(completed)
        return;

    completed=true;

    scratching=false;


    /* completely reveal photo */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    progress.style.width="100%";
    percent.textContent="۱۰۰٪";


    /*
      نوار به آرامی کنار می‌رود
      تا متن نهایی فضای خودش را داشته باشد.
    */

    setTimeout(()=>{

        progressArea.animate(
            [
                {
                    opacity:1,
                    transform:
                        "translateX(-50%) translateY(0)"
                },
                {
                    opacity:0,
                    transform:
                        "translateX(-50%) translateY(-12px)"
                }
            ],
            {
                duration:650,
                easing:"ease-out",
                fill:"forwards"
            }
        );

    },450);


    const rect=
        art.getBoundingClientRect();

    const cx=
        rect.left+
        rect.width/2;

    const cy=
        rect.top+
        rect.height/2;


    /* central light */

    flash(cx,cy);


    /* first heartbeat */

    setTimeout(()=>{
        heartBurst(
            cx,
            cy,
            24,
            .8
        );
    },100);


    /* second heartbeat */

    setTimeout(()=>{
        heartBurst(
            cx,
            cy,
            34,
            1.15
        );
    },300);


    /* corners */

    setTimeout(()=>{
        cornerCelebration(rect);
    },470);


    /* final message */

    setTimeout(()=>{

        finalMessage.classList.add(
            "show"
        );

    },780);
}


/* =========================================================
   PARTICLES
========================================================= */

let particles=[];

const MAX_PARTICLES=500;


/* =========================================================
   ADD PARTICLE
========================================================= */

function addParticle(p){

    if(
        particles.length>=
        MAX_PARTICLES
    ){

        particles.shift();
    }

    particles.push(p);
}


/* =========================================================
   HEART BURST
========================================================= */

function heartBurst(
    x,
    y,
    count,
    power
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const angle=
            Math.random()*
            Math.PI*2;

        const speed=
            (
                30+
                Math.random()*105
            )*
            power;

        addParticle({

            type:"heart",

            x,
            y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            gravity:
                8+
                Math.random()*16,

            life:
                .75+
                Math.random()*.8,

            max:1.55,

            size:
                4+
                Math.random()*8,

            rotation:
                Math.random()*
                Math.PI*2,

            vr:
                (Math.random()-.5)*
                3.5
        });
    }
}


/* =========================================================
   CORNER CELEBRATION
========================================================= */

function cornerCelebration(rect){

    const points=[

        [
            rect.left,
            rect.top
        ],

        [
            rect.right,
            rect.top
        ],

        [
            rect.left,
            rect.bottom
        ],

        [
            rect.right,
            rect.bottom
        ]
    ];

    points.forEach(
        (p,index)=>{

            setTimeout(()=>{

                heartBurst(
                    p[0],
                    p[1],
                    12,
                    .65
                );

            },index*100);
        }
    );
}


/* =========================================================
   FLASH
========================================================= */

function flash(x,y){

    const el=
        document.createElement(
            "div"
        );

    el.style.position="fixed";
    el.style.left=x+"px";
    el.style.top=y+"px";

    el.style.width="8px";
    el.style.height="8px";

    el.style.borderRadius="50%";

    el.style.background="#fff";

    el.style.boxShadow=
        "0 0 25px 18px rgba(255,255,255,.65)";

    el.style.pointerEvents="none";

    el.style.zIndex="200";

    document.body.appendChild(el);


    el.animate(
        [
            {
                transform:
                    "translate(-50%,-50%) scale(.3)",
                opacity:0
            },

            {
                transform:
                    "translate(-50%,-50%) scale(5)",
                opacity:.8
            },

            {
                transform:
                    "translate(-50%,-50%) scale(14)",
                opacity:0
            }
        ],
        {
            duration:650,
            easing:"ease-out"
        }
    );


    setTimeout(
        ()=>el.remove(),
        700
    );
}


/* =========================================================
   FINAL PAGE TOUCH
========================================================= */

document.addEventListener(
    "pointerdown",
    e=>{

        if(!completed)
            return;


        /*
          از این لحظه هر لمس
          دقیقاً در همان نقطه
          یک انفجار کوچک ایجاد می‌کند.
        */

        heartBurst(
            e.clientX,
            e.clientY,
            7+
            Math.floor(
                Math.random()*4
            ),
            .48+
            Math.random()*.18
        );


        for(let i=0;i<4;i++){

            addParticle({

                type:"spark",

                x:e.clientX,
                y:e.clientY,

                vx:
                    (Math.random()-.5)*
                    80,

                vy:
                    (Math.random()-.5)*
                    80,

                life:
                    .25+
                    Math.random()*.3,

                max:.55,

                size:
                    1+
                    Math.random()*2
            });
        }

    },
    {passive:true}
);


/* =========================================================
   DRAW HEART
========================================================= */

function drawHeart(
    x,
    y,
    size,
    alpha,
    rotation
){

    fctx.save();

    fctx.translate(x,y);

    fctx.rotate(rotation);

    fctx.globalAlpha=
        alpha;

    fctx.fillStyle=
        "#fff";

    fctx.shadowBlur=
        10;

    fctx.shadowColor=
        "rgba(255,255,255,.9)";


    fctx.beginPath();

    fctx.moveTo(
        0,
        size*.35
    );

    fctx.bezierCurveTo(
        -size*1.2,
        -size*.25,
        -size*.65,
        -size,
        0,
        -size*.45
    );

    fctx.bezierCurveTo(
        size*.65,
        -size,
        size*1.2,
        -size*.25,
        0,
        size*.35
    );

    fctx.fill();

    fctx.restore();
}


/* =========================================================
   DRAW POWDER
========================================================= */

function drawPowder(
    x,
    y,
    size,
    alpha
){

    fctx.save();

    fctx.globalAlpha=
        alpha;

    fctx.fillStyle=
        "#ffd9e8";

    fctx.beginPath();

    fctx.arc(
        x,
        y,
        size,
        0,
        Math.PI*2
    );

    fctx.fill();

    fctx.restore();
}


/* =========================================================
   DRAW SPARK
========================================================= */

function drawSpark(
    x,
    y,
    size,
    alpha
){

    fctx.save();

    fctx.globalAlpha=
        alpha;

    fctx.fillStyle="#fff";

    fctx.shadowBlur=10;
    fctx.shadowColor="#fff";

    fctx.beginPath();

    fctx.arc(
        x,
        y,
        size,
        0,
        Math.PI*2
    );

    fctx.fill();

    fctx.restore();
}


/* =========================================================
   ANIMATION ENGINE
========================================================= */

let previousTime=
    performance.now();

function animate(now){

    let dt=
        (now-previousTime)/
        1000;

    previousTime=now;

    dt=
        Math.min(
            dt,
            .033
        );


    fctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );


    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];

        p.life-=dt;


        if(p.life<=0){

            particles.splice(
                i,
                1
            );

            continue;
        }


        p.x+=
            p.vx*dt;

        p.y+=
            p.vy*dt;


        if(p.gravity){

            p.vy+=
                p.gravity*dt;
        }


        if(p.vr){

            p.rotation+=
                p.vr*dt;
        }


        const alpha=
            Math.max(
                0,
                p.life/p.max
            );


        if(
            p.type==="heart"
        ){

            drawHeart(
                p.x,
                p.y,
                p.size,
                alpha,
                p.rotation
            );

        }

        else if(
            p.type==="powder"
        ){

            drawPowder(
                p.x,
                p.y,
                p.size,
                alpha*p.alpha
            );

        }

        else if(
            p.type==="spark"
        ){

            drawSpark(
                p.x,
                p.y,
                p.size,
                alpha
            );
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   IMAGE INITIALIZATION
========================================================= */

function initialize(){

    if(
        photo.complete &&
        photo.naturalWidth>0
    ){

        requestAnimationFrame(
            resize
        );

    }else{

        setTimeout(
            initialize,
            40
        );
    }
}


photo.addEventListener(
    "load",
    ()=>{
        resize();
    }
);


window.addEventListener(
    "resize",
    ()=>{

        if(!completed){

            resize();
        }

        fx.width=
            Math.round(
                innerWidth*dpr
            );

        fx.height=
            Math.round(
                innerHeight*dpr
            );

        fctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );
    }
);


/* =========================================================
   START
========================================================= */

initialize();

requestAnimationFrame(
    animate
);

</script>
