<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>♥</title>

<style>
:root{
  --pink:#ff4b9b;
  --rose:#ff9fc8;
  --white:#fff;
  --bg:#070006;
  --ease:cubic-bezier(.16,1,.3,1)
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg)
}

body{
  user-select:none;
  touch-action:none;
  font-family:system-ui,sans-serif
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(
      circle at 50% 42%,
      #55122f 0,
      #260816 34%,
      #10030b 67%,
      #030002 100%
    )
}

#app:before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    conic-gradient(
      from 0deg,
      transparent,
      #ff3b9814,
      transparent,
      #ffafd20b,
      transparent
    );
  filter:blur(20px);
  animation:spin 38s linear infinite
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}


/* =========================
   NEBULA
========================= */

.neb,
.neb i{
  position:absolute;
  inset:0;
  pointer-events:none
}

.neb i{
  border-radius:50%;
  filter:blur(90px);
  mix-blend-mode:screen
}

.n1{
  width:65vmax!important;
  height:65vmax!important;
  left:-25vmax!important;
  top:-22vmax!important;
  background:#ff2f861c;
  animation:n1 16s ease-in-out infinite
}

.n2{
  width:55vmax!important;
  height:55vmax!important;
  right:-20vmax!important;
  bottom:-18vmax!important;
  background:#ff77ad17;
  animation:n2 20s ease-in-out infinite
}

.n3{
  width:32vmax!important;
  height:32vmax!important;
  left:36%;
  top:34%;
  background:#ff2c7b12;
  animation:n3 11s ease-in-out infinite
}

@keyframes n1{
  50%{
    transform:
      translate(18vmax,12vh)
      scale(1.25)
  }
}

@keyframes n2{
  50%{
    transform:
      translate(-15vmax,-10vh)
      scale(.72)
  }
}

@keyframes n3{
  50%{
    transform:scale(1.55);
    opacity:.35
  }
}


/* =========================
   STARS
========================= */

#stars,
#fx{
  position:absolute;
  inset:0;
  pointer-events:none
}

#stars{
  z-index:1
}

.star{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--s);
  height:var(--s);
  border-radius:50%;
  background:#fff;

  box-shadow:
    0 0 7px #fff,
    0 0 18px #ff6da9;

  opacity:0;

  animation:
    twinkle
    var(--d)
    var(--delay)
    ease-in-out
    infinite
}

@keyframes twinkle{
  50%{
    opacity:var(--o);
    transform:scale(1.5)
  }
}


/* =========================
   FX
========================= */

#fx{
  z-index:30;
  overflow:hidden
}

.particle{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--s);
  height:var(--s);
  border-radius:50%;
  background:var(--c);

  box-shadow:
    0 0 8px #fff,
    0 0 22px var(--c);

  animation:
    pFly
    var(--d)
    var(--delay)
    var(--ease)
    forwards
}

.heartFx{
  position:absolute;
  left:var(--x);
  top:var(--y);
  font-size:var(--s);
  color:var(--c);

  filter:
    drop-shadow(
      0 0 8px
      #ff3c91
    );

  animation:
    hFly
    var(--d)
    var(--delay)
    var(--ease)
    forwards
}

.ring{
  position:absolute;
  left:var(--x);
  top:var(--y);

  width:25px;
  height:25px;

  border:
    1px solid
    #fff;

  border-radius:50%;

  box-shadow:
    0 0 20px
    #ff3f91;

  transform:
    translate(-50%,-50%);

  animation:
    ring
    1.15s
    var(--ease)
    forwards
}

.spark{
  position:absolute;
  left:var(--x);
  top:var(--y);

  font-size:var(--s);

  color:#fff;

  text-shadow:
    0 0 12px
    #ff4a9b;

  animation:
    spark
    1.5s
    var(--ease)
    forwards
}

@keyframes pFly{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.1)
  }

  12%{
    opacity:1
  }

  100%{
    opacity:0;

    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(.05)
  }
}

@keyframes hFly{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.1)
      rotate(0)
  }

  15%{
    opacity:1
  }

  100%{
    opacity:0;

    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(.35)
      rotate(var(--r))
  }
}

@keyframes ring{

  to{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(10)
  }
}

@keyframes spark{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.1)
      rotate(0)
  }

  20%{
    opacity:1
  }

  100%{
    opacity:0;

    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(1.8)
      rotate(180deg)
  }
}


/* =========================
   SCENE
========================= */

.scene{
  position:absolute;
  inset:0;
  z-index:10;

  display:grid;
  place-items:center;

  perspective:1800px
}

.halo{
  position:absolute;

  width:min(1000px,120vw);
  height:min(680px,84vw);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      #ff3f9132,
      #ff3f9112 38%,
      transparent 72%
    );

  filter:blur(38px);

  animation:
    halo
    5s
    ease-in-out
    infinite
}

.halo2{
  width:62%;
  height:48%;

  background:
    radial-gradient(
      ellipse,
      #ffd5e51c,
      transparent 70%
    );

  filter:blur(65px);

  animation:
    halo
    8s
    ease-in-out
    infinite reverse
}

@keyframes halo{

  50%{
    transform:scale(1.1);
    opacity:.72
  }
}


/* =========================
   STAGE
========================= */

.stage{
  position:relative;

  width:min(860px,92vw);
  height:min(650px,84vh);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:clamp(
    22px,
    4vh,
    42px
  );

  transform-style:preserve-3d;

  will-change:transform
}


/* =========================
   FRAME ENTRY
========================= */

.frameWrap{
  position:relative;

  width:min(760px,88vw);
  height:min(500px,57vh);

  min-height:245px;

  transform-style:preserve-3d;

  animation:
    enter
    2.1s
    var(--ease)
    both,
    levitate
    7s
    ease-in-out
    2.1s
    infinite;

  filter:
    drop-shadow(
      0 45px 55px
      #000c
    )
}

@keyframes enter{

  0%{
    opacity:0;

    transform:
      translateY(70px)
      scale(.7)
      rotateX(16deg)
      rotateZ(-2deg);

    filter:
      blur(20px)
      drop-shadow(
        0 0 0
        transparent
      )
  }

  45%{
    opacity:1;

    transform:
      translateY(-10px)
      scale(1.03)
      rotateX(-4deg)
  }

  100%{
    opacity:1;

    transform:
      translateY(0)
      scale(1)
      rotateX(0)
  }
}

@keyframes levitate{

  50%{
    transform:translateY(-8px)
  }
}


/* =========================
   FRAME
========================= */

.frame{
  position:absolute;
  inset:0;

  border-radius:36px;

  padding:12px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #ffb0d0 7%,
      #ff3f91 25%,
      #3c0924 52%,
      #ff6ca8 80%,
      #fff
    );

  box-shadow:
    0 0 50px #ff3f9140,
    inset 0 0 0 1px #fff
}

.frame:before{
  content:"";

  position:absolute;
  inset:5px;

  border-radius:31px;

  border:
    1px solid
    #ffffff55;

  pointer-events:none;

  z-index:8
}

.frame:after{
  content:"";

  position:absolute;
  inset:-24px;

  border-radius:52px;

  border:
    1px solid
    #ffb5d522;

  box-shadow:
    0 0 45px
    #ff3f911c;

  animation:
    frameAura
    4s
    ease-in-out
    infinite;

  pointer-events:none
}

@keyframes frameAura{

  50%{
    transform:scale(1.018);
    opacity:.5
  }
}


/* =========================
   PHOTO
========================= */

.photo{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:27px;

  background:#12020a;

  box-shadow:
    inset 0 0 0 1px #fff3,
    inset 0 0 75px #0008
}

.photo img{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center;

  transform:scale(1.025);

  filter:
    saturate(1.06)
    contrast(1.04);

  transition:
    filter
    .6s
}

.photo:after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      125deg,
      #fff2,
      transparent 22%,
      transparent 72%,
      #fff1
    ),
    radial-gradient(
      ellipse at 50% -10%,
      #fff2,
      transparent 45%
    );

  pointer-events:none;

  z-index:4
}


/* =========================
   GLASS
========================= */

.glass{
  position:absolute;
  inset:12px;

  border-radius:27px;

  z-index:9;

  background:
    linear-gradient(
      125deg,
      #fff4,
      transparent 20%,
      transparent 72%,
      #fff1
    );

  pointer-events:none
}


/* =========================
   MOVING SHINE
========================= */

.shine{
  position:absolute;

  top:-80%;
  left:-100%;

  width:30%;
  height:260%;

  transform:rotate(20deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      #fff1,
      #fff5,
      transparent
    );

  filter:blur(3px);

  animation:
    shine
    7s
    2.5s
    ease-in-out
    infinite;

  pointer-events:none;

  z-index:10
}

@keyframes shine{

  0%,35%{
    left:-100%;
    opacity:0
  }

  48%{
    opacity:1
  }

  72%,100%{
    left:155%;
    opacity:0
  }
}


/* =========================
   SCRATCH CANVAS
========================= */

#scratch{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  z-index:7;

  border-radius:27px;

  cursor:crosshair
}


/* =========================
   PROGRESS
========================= */

.progress{
  position:absolute;

  left:50%;
  bottom:-16px;

  transform:translateX(-50%);

  width:46%;
  height:2px;

  border-radius:9px;

  background:#ffffff18;

  overflow:hidden;

  z-index:20;

  opacity:.65
}

.progress i{
  display:block;

  width:0;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #ff4d9c,
      #fff,
      #ff4d9c
    );

  box-shadow:
    0 0 12px
    #ff4d9c;

  transition:
    width
    .35s
    ease
}


/* =========================
   CORNERS
========================= */

.corners i{
  position:absolute;

  width:64px;
  height:64px;

  z-index:12;

  filter:
    drop-shadow(
      0 0 8px
      #ff3f91
    )
}

.corners i:before,
.corners i:after{
  content:"";
  position:absolute;

  background:
    linear-gradient(
      90deg,
      #fff,
      #ff3f91
    )
}

.corners i:before{
  width:100%;
  height:2px
}

.corners i:after{
  width:2px;
  height:100%
}

.c1{
  left:8px;
  top:8px
}

.c2{
  right:8px;
  top:8px;
  transform:rotate(90deg)
}

.c3{
  left:8px;
  bottom:8px;
  transform:rotate(270deg)
}

.c4{
  right:8px;
  bottom:8px;
  transform:rotate(180deg)
}


/* =========================
   SENTENCE
========================= */

.sentence{
  position:relative;

  z-index:15;

  font-size:
    clamp(
      24px,
      3.3vw,
      44px
    );

  font-weight:800;

  letter-spacing:-1px;

  background:
    linear-gradient(
      90deg,
      #fff,
      #ff72ae,
      #ffd6e7,
      #ff4b9a,
      #fff,
      #ff72ae
    );

  background-size:300% 100%;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  text-shadow:
    0 0 22px
    #ff4b9a55;

  animation:
    textFlow
    5s
    linear
    infinite,
    heartText
    2.4s
    ease-in-out
    infinite;

  filter:
    drop-shadow(
      0 0 8px
      #ff4b9a66
    )
}

.sentence:before,
.sentence:after{
  content:"";

  position:absolute;
  top:50%;

  width:
    clamp(
      35px,
      8vw,
      110px
    );

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ff8db8,
      #fff
    );

  box-shadow:
    0 0 10px
    #ff4b9a
}

.sentence:before{
  right:
    calc(
      100% + 18px
    );

  transform:
    rotate(2deg)
}

.sentence:after{
  left:
    calc(
      100% + 18px
    );

  transform:
    scaleX(-1)
    rotate(2deg)
}

@keyframes textFlow{

  to{
    background-position:
      300% 0
  }
}

@keyframes heartText{

  50%{
    transform:scale(1.025);

    filter:
      drop-shadow(
        0 0 18px
        #ff4b9aaa
      )
  }
}


/* =========================
   TEXT AURA
========================= */

.textAura{
  position:absolute;

  width:330px;
  height:80px;

  border-radius:50%;

  background:#ff4b9b2b;

  filter:blur(35px);

  bottom:-14px;

  animation:
    textAura
    3s
    ease-in-out
    infinite;

  pointer-events:none
}

@keyframes textAura{

  50%{
    transform:scale(1.2);
    opacity:.45
  }
}


/* =========================
   FINISH
========================= */

.finishFlash{
  position:absolute;
  inset:0;

  z-index:60;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      circle at 50% 50%,
      #fff9,
      transparent 35%
    )
}

.finishFlash.go{
  animation:
    finish
    .9s
    ease-out
    forwards
}

@keyframes finish{

  0%{
    opacity:0
  }

  15%{
    opacity:1
  }

  100%{
    opacity:0
  }
}


/* =========================
   FULL GLOW
========================= */

.fullGlow{
  position:absolute;
  inset:0;

  z-index:2;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      circle at 50% 50%,
      #ff72ae22,
      transparent 55%
    )
}

.fullGlow.on{
  animation:
    glowOn
    2.5s
    ease-in-out
    infinite
}

@keyframes glowOn{

  50%{
    opacity:1;
    transform:scale(1.06)
  }
}


/* =========================
   COMPLETED FRAME
========================= */

.done .frame{
  animation:
    doneFrame
    3s
    ease-in-out
    infinite
}

.done .photo img{
  filter:
    saturate(1.15)
    contrast(1.06)
    brightness(1.04)
}

@keyframes doneFrame{

  50%{
    box-shadow:
      0 0 90px #ff3f9180,
      0 0 160px #ff9fc744,
      inset 0 0 0 1px #fff
  }
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .stage{
    width:100vw;
    height:82vh;
    gap:28px
  }

  .frameWrap{
    width:94vw;
    height:min(56vw,430px);
    min-height:210px
  }

  .frame{
    padding:7px;
    border-radius:27px
  }

  .photo,
  #scratch{
    border-radius:21px
  }

  .glass{
    inset:7px;
    border-radius:21px
  }

  .corners i{
    width:42px;
    height:42px
  }

  .sentence{
    font-size:
      clamp(
        21px,
        6.4vw,
        31px
      )
  }

  .sentence:before{
    right:
      calc(
        100% + 10px
      )
  }

  .sentence:after{
    left:
      calc(
        100% + 10px
      )
  }
}

@media(max-height:650px){

  .stage{
    gap:14px
  }

  .frameWrap{
    height:60vh
  }

  .sentence{
    font-size:24px
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important
  }
}
</style>
</head>


<body>

<div id="app">

  <!-- NEBULA -->
  <div class="neb">
    <i class="n1"></i>
    <i class="n2"></i>
    <i class="n3"></i>
  </div>

  <!-- STARS -->
  <div id="stars"></div>

  <!-- LIGHT EFFECT -->
  <div class="fullGlow" id="fullGlow"></div>

  <div class="scene">

    <div class="halo"></div>
    <div class="halo halo2"></div>

    <div
      class="stage"
      id="stage"
    >

      <div
        class="frameWrap"
        id="frameWrap"
      >

        <div class="frame">

          <div class="photo" id="photo">

            <img
              src="final.jpg"
              alt=""
              draggable="false"
            >

            <span class="shine"></span>

          </div>

          <!-- SCRATCH SURFACE -->
          <canvas id="scratch"></canvas>

          <div class="glass"></div>

          <div class="corners">
            <i class="c1"></i>
            <i class="c2"></i>
            <i class="c3"></i>
            <i class="c4"></i>
          </div>

          <div class="progress">
            <i id="progressBar"></i>
          </div>

        </div>

      </div>

      <div class="textAura"></div>

      <div class="sentence">
        و آینده‌ی کنار تو بهشته
      </div>

    </div>

  </div>

  <div
    class="finishFlash"
    id="finishFlash"
  ></div>

  <div id="fx"></div>

</div>


<script>

(()=>{

"use strict";


/* =========================
   ELEMENTS
========================= */

const
app=document.getElementById("app"),
canvas=document.getElementById("scratch"),
ctx=canvas.getContext(
  "2d",
  {
    willReadFrequently:true
  }
),
photo=document.getElementById("photo"),
frameWrap=document.getElementById("frameWrap"),
stage=document.getElementById("stage"),
fx=document.getElementById("fx"),
stars=document.getElementById("stars"),
bar=document.getElementById("progressBar"),
finishFlash=document.getElementById("finishFlash"),
fullGlow=document.getElementById("fullGlow");


/* =========================
   RANDOM
========================= */

const
R=(a,b)=>
  Math.random()*(b-a)+a,

RI=(a,b)=>
  Math.floor(
    R(a,b+1)
  );


/* =========================
   STARS
========================= */

for(
  let i=0;
  i<130;
  i++
){

  const s=
    document.createElement("i");

  s.className="star";

  s.style.cssText=`
    --x:${R(0,100)}%;
    --y:${R(0,100)}%;
    --s:${R(.5,2.8)}px;
    --d:${R(2,7)}s;
    --delay:${R(-7,0)}s;
    --o:${R(.15,.8)}
  `;

  stars.appendChild(s);
}


/* =========================
   AUDIO ENGINE
========================= */

let audio=null;

function tone(
  kind="scratch"
){

  try{

    audio ??=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(
      audio.state==="suspended"
    ){
      audio.resume();
    }

    const now=
      audio.currentTime;

    const sets={

      scratch:[
        {
          f:392,
          d:.08,
          v:.018
        },
        {
          f:523.25,
          d:.12,
          v:.012
        }
      ],

      tap:[
        {
          f:659.25,
          d:.16,
          v:.025
        },
        {
          f:783.99,
          d:.24,
          v:.018
        }
      ],

      double:[
        {
          f:523.25,
          d:.12,
          v:.03
        },
        {
          f:659.25,
          d:.18,
          v:.028
        },
        {
          f:987.77,
          d:.35,
          v:.018
        }
      ],

      long:[
        {
          f:261.63,
          d:.25,
          v:.025
        },
        {
          f:392,
          d:.35,
          v:.022
        },
        {
          f:523.25,
          d:.5,
          v:.018
        }
      ],

      finish:[
        {
          f:523.25,
          d:.22,
          v:.035
        },
        {
          f:659.25,
          d:.3,
          v:.03
        },
        {
          f:783.99,
          d:.42,
          v:.026
        },
        {
          f:1046.5,
          d:.7,
          v:.018
        }
      ]

    };

    (
      sets[kind] ||
      sets.tap
    ).forEach(
      (q,i)=>{

        const o=
          audio.createOscillator();

        const g=
          audio.createGain();

        o.type="sine";

        o.frequency.setValueAtTime(
          q.f,
          now+i*.055
        );

        o.frequency
          .exponentialRampToValueAtTime(
            q.f*1.015,
            now+i*.055+q.d
          );

        g.gain.setValueAtTime(
          .001,
          now+i*.055
        );

        g.gain
          .exponentialRampToValueAtTime(
            q.v,
            now+i*.055+.025
          );

        g.gain
          .exponentialRampToValueAtTime(
            .001,
            now+i*.055+q.d
          );

        o
          .connect(g)
          .connect(
            audio.destination
          );

        o.start(
          now+i*.055
        );

        o.stop(
          now+i*.055+q.d+.03
        );

      }
    );

  }catch(e){}

}


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

  const r=
    canvas.getBoundingClientRect();

  const d=
    Math.min(
      devicePixelRatio || 1,
      2
    );

  canvas.width=
    Math.max(
      1,
      Math.floor(r.width*d)
    );

  canvas.height=
    Math.max(
      1,
      Math.floor(r.height*d)
    );

  ctx.setTransform(
    d,
    0,
    0,
    d,
    0,
    0
  );

  cover();
}


function cover(){

  const r=
    canvas.getBoundingClientRect();

  ctx.globalCompositeOperation=
    "source-over";

  const g=
    ctx.createLinearGradient(
      0,
      0,
      r.width,
      r.height
    );

  g.addColorStop(
    0,
    "#fff"
  );

  g.addColorStop(
    .25,
    "#f6c9d9"
  );

  g.addColorStop(
    .55,
    "#e9a8bf"
  );

  g.addColorStop(
    .78,
    "#fbd6e3"
  );

  g.addColorStop(
    1,
    "#fff"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    r.width,
    r.height
  );

  ctx.globalCompositeOperation=
    "destination-out";
}


resizeCanvas();

addEventListener(
  "resize",
  resizeCanvas
);


/* =========================
   SCRATCH STATE
========================= */

let
erased=0,
finished=false,
lastProgress=0,
lastScratchSound=0,
scratchCount=0;


/* =========================
   WAVE
========================= */

function wave(
  x,
  y,
  scale=1
){

  const e=
    document.createElement("i");

  e.className=
    "ring";

  e.style.cssText=`
    --x:${x}px;
    --y:${y}px;
    transform:
      translate(-50%,-50%)
      scale(${scale})
  `;

  fx.appendChild(e);

  setTimeout(
    ()=>e.remove(),
    1250
  );
}


/* =========================
   COMET BURST
========================= */

function cometBurst(
  x,
  y,
  count=8,
  big=false
){

  for(
    let i=0;
    i<count;
    i++
  ){

    const e=
      document.createElement("i");

    e.className="particle";

    const
    a=R(
      0,
      Math.PI*2
    ),

    d=R(
      big?120:45,
      big?420:190
    );

    e.style.cssText=`
      --x:${x}px;
      --y:${y}px;
      --s:${R(2,5)}px;
      --dx:${Math.cos(a)*d}px;
      --dy:${Math.sin(a)*d}px;
      --c:#ff9fc8;
      --d:${R(.7,1.5)}s;
      --delay:0s
    `;

    fx.appendChild(e);

    setTimeout(
      ()=>e.remove(),
      1700
    );

  }

}


/* =========================
   FLOWER BURST
========================= */

function flowerBurst(
  x,
  y,
  count=10,
  big=false
){

  for(
    let i=0;
    i<count;
    i++
  ){

    const e=
      document.createElement("i");

    e.className="spark";

    const
    a=R(
      0,
      Math.PI*2
    ),

    d=R(
      big?90:35,
      big?320:150
    );

    e.textContent=
      [
        "✦",
        "✧",
        "❀",
        "♡"
      ][RI(0,3)];

    e.style.cssText=`
      --x:${x}px;
      --y:${y}px;
      --s:${R(
        big?14:9,
        big?32:20
      )}px;
      --dx:${Math.cos(a)*d}px;
      --dy:${Math.sin(a)*d-R(20,90)}px;
      --d:${R(.9,1.8)}s
    `;

    fx.appendChild(e);

    setTimeout(
      ()=>e.remove(),
      2100
    );

  }

}


/* =========================
   SCRATCH
========================= */

function scratchAt(
  x,
  y,
  radius=38
){

  if(finished)
    return;

  const rect=
    canvas.getBoundingClientRect();

  const
  px=x-rect.left,
  py=y-rect.top;

  ctx.save();

  ctx.globalCompositeOperation=
    "destination-out";

  const g=
    ctx.createRadialGradient(
      px,
      py,
      0,
      px,
      py,
      radius
    );

  g.addColorStop(
    0,
    "rgba(0,0,0,1)"
  );

  g.addColorStop(
    .52,
    "rgba(0,0,0,.98)"
  );

  g.addColorStop(
    .82,
    "rgba(0,0,0,.82)"
  );

  g.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(
    px,
    py,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  scratchCount++;


  /* SCRATCH SOUND */

  if(
    performance.now()-
    lastScratchSound
    >95
  ){

    tone("scratch");

    lastScratchSound=
      performance.now();

  }


  /* SCRATCH PARTICLES */

  if(
    scratchCount%2===0
  ){

    particles(
      x,
      y,
      false
    );

    cometBurst(
      x,
      y,
      2,
      false
    );

  }

  wave(
    x,
    y,
    .35
  );

  updateProgress();

}


/* =========================
   PROGRESS DETECTION
========================= */

function updateProgress(){

  if(!ctx)
    return;

  const
  w=canvas.width,
  h=canvas.height;

  const data=
    ctx.getImageData(
      0,
      0,
      w,
      h
    ).data;

  let
  transparent=0,
  total=0;

  for(
    let i=3;
    i<data.length;
    i+=20
  ){

    total++;

    if(
      data[i]<35
    ){
      transparent++;
    }

  }

  erased=
    transparent/total;

  const pct=
    Math.min(
      100,
      erased*100
    );

  bar.style.width=
    pct+"%";


  if(
    erased-lastProgress>.025
  ){

    sparkBurst(
      innerWidth/2,
      innerHeight*.5,
      3
    );

    lastProgress=
      erased;

  }


  if(
    erased>.958 &&
    !finished
  ){

    complete();

  }

}


/* =========================
   COMPLETE
========================= */

function complete(){

  finished=true;

  bar.style.width="100%";

  app.classList.add("done");

  fullGlow.classList.add("on");

  finishFlash.classList.remove("go");

  void finishFlash.offsetWidth;

  finishFlash.classList.add("go");

  tone("finish");

  navigator.vibrate?.(
    [
      25,
      40,
      80,
      40,
      140
    ]
  );

  const
  cx=innerWidth/2,
  cy=innerHeight*.42;

  ring(
    cx,
    cy,
    4
  );

  cometBurst(
    cx,
    cy,
    45,
    true
  );

  flowerBurst(
    cx,
    cy,
    65,
    true
  );


  /* HEART STORM */

  for(
    let i=0;
    i<190;
    i++
  ){

    setTimeout(
      ()=>heartBurst(
        cx+R(-35,35),
        cy+R(-25,25),
        true
      ),
      i*6
    );

  }


  /* LIGHT PARTICLES */

  for(
    let i=0;
    i<110;
    i++
  ){

    setTimeout(
      ()=>particles(
        cx,
        cy,
        true
      ),
      i*10
    );

  }


  /* OUTER RINGS */

  setTimeout(
    ()=>{

      for(
        let i=0;
        i<24;
        i++
      ){

        const a=
          Math.PI*2*i/24;

        const x=
          cx+
          Math.cos(a)*
          R(130,230);

        const y=
          cy+
          Math.sin(a)*
          R(80,150);

        ring(
          x,
          y,
          R(.6,1.2)
        );

      }

    },
    450
  );

}


/* =========================
   PARTICLES
========================= */

function particles(
  x,
  y,
  big=false
){

  const n=
    big?20:5;

  for(
    let i=0;
    i<n;
    i++
  ){

    const e=
      document.createElement("i");

    e.className=
      "particle";

    const
    a=R(
      0,
      Math.PI*2
    ),

    d=R(
      big?80:25,
      big?360:120
    );

    e.style.cssText=`
      --x:${x}px;
      --y:${y}px;
      --s:${R(1,4)}px;
      --c:${
        [
          "#fff",
          "#ff70aa",
          "#ffb4d1",
          "#ffddeb"
        ][RI(0,3)]
      };
      --dx:${Math.cos(a)*d}px;
      --dy:${Math.sin(a)*d}px;
      --d:${R(.55,1.25)}s;
      --delay:${R(0,.05)}s
    `;

    fx.appendChild(e);

    setTimeout(
      ()=>e.remove(),
      1500
    );

  }

}


/* =========================
   HEART BURST
========================= */

function heartBurst(
  x,
  y,
  big=false
){

  const e=
    document.createElement("i");

  e.className=
    "heartFx";

  const
  a=R(
    0,
    Math.PI*2
  ),

  d=R(
    big?100:35,
    big?390:180
  );

  e.textContent=
    Math.random()<.9
      ?"♥"
      :"♡";

  e.style.cssText=`
    --x:${x}px;
    --y:${y}px;
    --s:${R(
      big?15:10,
      big?44:28
    )}px;
    --c:${
      [
        "#ff4b91",
        "#ff8db8",
        "#ffd0e1",
        "#fff"
      ][RI(0,3)]
    };
    --dx:${Math.cos(a)*d}px;
    --dy:${Math.sin(a)*d-R(20,120)}px;
    --r:${R(-220,220)}deg;
    --d:${R(.8,1.9)}s;
    --delay:${R(0,.15)}s
  `;

  fx.appendChild(e);

  setTimeout(
    ()=>e.remove(),
    2200
  );

}


/* =========================
   RING
========================= */

function ring(
  x,
  y,
  scale=1
){

  const e=
    document.createElement("i");

  e.className="ring";

  e.style.cssText=`
    --x:${x}px;
    --y:${y}px;
    transform:
      translate(-50%,-50%)
      scale(${scale})
  `;

  fx.appendChild(e);

  setTimeout(
    ()=>e.remove(),
    1200
  );

}


/* =========================
   SPARK
========================= */

function sparkBurst(
  x,
  y,
  count=18
){

  for(
    let i=0;
    i<count;
    i++
  ){

    const e=
      document.createElement("i");

    e.className="spark";

    const
    a=R(
      0,
      Math.PI*2
    ),

    d=R(
      40,
      190
    );

    e.textContent=
      Math.random()<.5
        ?"✦"
        :"✧";

    e.style.cssText=`
      --x:${x}px;
      --y:${y}px;
      --s:${R(9,24)}px;
      --dx:${Math.cos(a)*d}px;
      --dy:${Math.sin(a)*d}px;
      --d:${R(.8,1.5)}s
    `;

    fx.appendChild(e);

    setTimeout(
      ()=>e.remove(),
      1700
    );

  }

}


/* =========================
   PARALLAX
========================= */

let
tx=0,
ty=0,
cx=0,
cy=0;

function parallax(){

  cx+=(tx-cx)*.06;
  cy+=(ty-cy)*.06;

  stage.style.transform=`
    rotateX(${cy}deg)
    rotateY(${cx}deg)
  `;

  requestAnimationFrame(
    parallax
  );

}

parallax();


/* =========================
   GLOBAL POINTER
========================= */

app.addEventListener(
  "pointermove",
  e=>{

    const r=
      app.getBoundingClientRect();

    tx=
      ((e.clientX-r.width/2)/r.width)*5;

    ty=
      -((e.clientY-r.height/2)/r.height)*4;

  }
);

app.addEventListener(
  "pointerleave",
  ()=>{
    tx=ty=0
  }
);


/* =========================
   GLOBAL TOUCH
========================= */

let
lastTap=0,
holdTimer=null,
holdInterval=null,
isHolding=false;


function globalTouch(
  x,
  y
){

  const now=
    performance.now();

  const dbl=
    now-lastTap<330;

  lastTap=now;


  wave(
    x,
    y,
    dbl?1.8:1
  );


  /* DOUBLE TOUCH */

  if(dbl){

    tone("double");

    ring(
      x,
      y,
      2.4
    );

    cometBurst(
      x,
      y,
      22,
      true
    );

    flowerBurst(
      x,
      y,
      24,
      true
    );

    for(
      let i=0;
      i<65;
      i++
    ){

      setTimeout(
        ()=>heartBurst(
          x+R(-22,22),
          y+R(-22,22),
          true
        ),
        i*5
      );

    }

    sparkBurst(
      x,
      y,
      42
    );

  }

  /* SINGLE TOUCH */

  else{

    tone("tap");

    ring(
      x,
      y,
      1.1
    );

    cometBurst(
      x,
      y,
      6,
      false
    );

    for(
      let i=0;
      i<25;
      i++
    ){

      setTimeout(
        ()=>heartBurst(
          x,
          y,
          false
        ),
        i*8
      );

    }

  }


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      dbl
        ?[18,35,18]
        :10
    );

  }

}


/* =========================
   LONG TOUCH
========================= */

app.addEventListener(
  "pointerdown",
  e=>{

    isHolding=true;

    globalTouch(
      e.clientX,
      e.clientY
    );


    holdTimer=
      setTimeout(
        ()=>{

          if(!isHolding)
            return;

          tone("long");

          wave(
            e.clientX,
            e.clientY,
            2.2
          );

          ring(
            e.clientX,
            e.clientY,
            1.7
          );

          sparkBurst(
            e.clientX,
            e.clientY,
            48
          );

          cometBurst(
            e.clientX,
            e.clientY,
            25,
            true
          );

          flowerBurst(
            e.clientX,
            e.clientY,
            35,
            true
          );


          for(
            let i=0;
            i<50;
            i++
          ){

            setTimeout(
              ()=>heartBurst(
                e.clientX+
                  R(-30,30),

                e.clientY+
                  R(-30,30),

                true
              ),
              i*12
            );

          }


          holdInterval=
            setInterval(
              ()=>{

                ring(
                  e.clientX+
                    R(-25,25),

                  e.clientY+
                    R(-25,25),

                  R(.8,1.5)
                );

                heartBurst(
                  e.clientX+
                    R(-35,35),

                  e.clientY+
                    R(-35,35),

                  true
                );

              },
              420
            );

        },
        520
      );

  }
);


function endHold(){

  isHolding=false;

  clearTimeout(
    holdTimer
  );

  clearInterval(
    holdInterval
  );

  holdTimer=null;
  holdInterval=null;

}

app.addEventListener(
  "pointerup",
  endHold
);

app.addEventListener(
  "pointercancel",
  endHold
);


/* =========================
   SCRATCH INTERACTION
========================= */

let
scratching=false,
lastX=0,
lastY=0;


function beginScratch(e){

  const x=e.clientX;
  const y=e.clientY;

  scratching=true;

  lastX=x;
  lastY=y;

  scratchAt(
    x,
    y,
    40
  );

  ring(
    x,
    y,
    .7
  );

}


function moveScratch(e){

  if(
    !scratching ||
    finished
  )
    return;

  const
  x=e.clientX,
  y=e.clientY;

  const
  dx=x-lastX,
  dy=y-lastY,
  dist=Math.hypot(
    dx,
    dy
  ),

  steps=Math.max(
    1,
    Math.ceil(
      dist/13
    )
  );


  for(
    let i=1;
    i<=steps;
    i++
  ){

    const t=
      i/steps;

    scratchAt(
      lastX+dx*t,
      lastY+dy*t,
      32
    );

  }

  lastX=x;
  lastY=y;

}


canvas.addEventListener(
  "pointerdown",
  beginScratch
);

canvas.addEventListener(
  "pointermove",
  moveScratch
);

canvas.addEventListener(
  "pointerup",
  ()=>{
    scratching=false
  }
);

canvas.addEventListener(
  "pointercancel",
  ()=>{
    scratching=false
  }
);

canvas.addEventListener(
  "pointerleave",
  ()=>{
    scratching=false
  }
);


/* =========================
   DISABLE MENU
========================= */

app.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

})();

</script>
