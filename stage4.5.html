<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<meta name="theme-color" content="#08050a">

<title>رمز ما ❤️</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #08050a;
    color: #ffffff;
    font-family:
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    color: inherit;
}


/* =========================================================
   MAIN BACKGROUND
========================================================= */

.app {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255, 55, 115, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(150, 30, 90, 0.14),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 75%,
            rgba(90, 30, 100, 0.10),
            transparent 30%
        ),
        #08050a;
}


/* =========================================================
   STARS
========================================================= */

.stars {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(255,255,255,0.45);

    animation:
        starTwinkle
        var(--duration)
        ease-in-out
        infinite;

    animation-delay: var(--delay);
}

@keyframes starTwinkle {

    0% {
        opacity: 0.15;
        transform: scale(0.7);
    }

    50% {
        opacity: 0.8;
        transform: scale(1.5);
    }

    100% {
        opacity: 0.15;
        transform: scale(0.7);
    }

}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.hearts {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.floating-heart {
    position: absolute;

    bottom: -50px;

    font-size: var(--size);

    opacity: 0;

    animation:
        floatHeart
        var(--duration)
        linear
        forwards;

    animation-delay: var(--delay);
}

@keyframes floatHeart {

    0% {
        opacity: 0;

        transform:
            translate3d(0, 0, 0)
            rotate(0deg)
            scale(0.7);
    }

    10% {
        opacity: 0.55;
    }

    50% {
        opacity: 0.4;
    }

    90% {
        opacity: 0.1;
    }

    100% {
        opacity: 0;

        transform:
            translate3d(var(--move), -110vh, 0)
            rotate(var(--rotate))
            scale(1.1);
    }

}


/* =========================================================
   PHONE
========================================================= */

.phone {
    position: relative;

    width: min(390px, 92vw);
    height: min(760px, 92dvh);

    border: 7px solid #211b21;
    border-radius: 42px;

    background: #050407;

    overflow: hidden;

    box-shadow:
        0 25px 90px rgba(0,0,0,0.85),
        0 0 60px rgba(255,60,120,0.13);

    transition:
        transform 0.65s ease,
        opacity 0.65s ease,
        filter 0.65s ease;
}


/* =========================================================
   PHONE NOTCH
========================================================= */

.phone::before {
    content: "";

    position: absolute;

    z-index: 100;

    top: 7px;
    left: 50%;

    width: 98px;
    height: 24px;

    transform: translateX(-50%);

    border-radius:
        0 0 16px 16px;

    background: #09070b;
}


/* =========================================================
   SCREEN
========================================================= */

.screen {
    position: absolute;
    inset: 6px;

    overflow: hidden;

    border-radius: 34px;

    background:
        radial-gradient(
            circle at 50% 8%,
            rgba(255,70,125,0.13),
            transparent 34%
        ),
        linear-gradient(
            160deg,
            #100a11,
            #070509 65%,
            #0b070c
        );
}


/* =========================================================
   VIEW
========================================================= */

.view {
    position: absolute;
    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding:
        58px
        24px
        28px;

    text-align: center;

    transition:
        opacity 0.45s ease,
        transform 0.45s ease,
        filter 0.45s ease;
}

.view.hidden {
    opacity: 0;

    pointer-events: none;

    transform:
        scale(0.96);
}


/* =========================================================
   HEADER
========================================================= */

.badge {
    margin-bottom: 14px;

    font-size: 11px;

    color:
        rgba(255,255,255,0.42);

    letter-spacing: 0.3px;
}

.lock {
    width: 44px;
    height: 44px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 12px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    border-radius: 50%;

    background:
        rgba(255,255,255,0.035);

    font-size: 20px;

    box-shadow:
        0 0 25px
        rgba(255,80,130,0.08);
}


/* =========================================================
   TITLE
========================================================= */

.title {
    margin: 0 0 7px;

    font-size: 23px;

    line-height: 1.8;

    font-weight: 700;
}

.sub {
    min-height: 48px;

    margin: 0;

    font-size: 13px;

    line-height: 2;

    color:
        rgba(255,255,255,0.60);
}


/* =========================================================
   CODE AREA
========================================================= */

.code {
    direction: ltr;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    min-height: 60px;

    margin:
        22px
        0
        8px;

    transition:
        transform 0.2s ease;
}

.code.shake {
    animation:
        shakeCode
        0.38s
        ease;
}

@keyframes shakeCode {

    0% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(7px);
    }

    40% {
        transform: translateX(-7px);
    }

    60% {
        transform: translateX(5px);
    }

    80% {
        transform: translateX(-4px);
    }

    100% {
        transform: translateX(0);
    }

}


/* =========================================================
   INPUT
========================================================= */

.box {
    width: 48px;
    height: 58px;

    padding: 0;

    border:
        1px solid
        rgba(255,255,255,0.14);

    border-radius: 14px;

    outline: none;

    background:
        rgba(255,255,255,0.045);

    color: #ffffff;

    text-align: center;

    font-size: 25px;

    caret-color: #ff82a5;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
}

.box::selection {
    background:
        rgba(255,80,130,0.35);
}

.box:focus {
    border-color:
        rgba(255,100,145,0.9);

    background:
        rgba(255,80,130,0.07);

    box-shadow:
        0 0 0 3px
        rgba(255,80,130,0.08),
        0 0 25px
        rgba(255,60,120,0.13);

    transform:
        translateY(-1px);
}

.box.filled {
    border-color:
        rgba(255,120,155,0.35);
}

.box.invalid {
    border-color:
        rgba(255,80,100,0.9);

    background:
        rgba(255,50,80,0.08);
}

.box.valid {
    border-color:
        rgba(130,255,190,0.7);

    background:
        rgba(80,255,150,0.06);
}


/* =========================================================
   SLASH
========================================================= */

.slash {
    color:
        rgba(255,255,255,0.38);

    font-size: 22px;

    user-select: none;
}


/* =========================================================
   HINT
========================================================= */

.hint {
    width: min(310px, 92%);

    min-height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-top: 4px;

    padding:
        7px
        10px;

    font-size: 12.5px;

    line-height: 1.9;

    color:
        rgba(255,195,213,0.95);

    opacity: 0;

    transform:
        translateY(7px);

    transition:
        opacity 0.35s ease,
        transform 0.35s ease;
}

.hint.show {
    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================================
   ERROR
========================================================= */

.error {
    min-height: 25px;

    margin-top: 0;

    font-size: 11.5px;

    color:
        #ff9ab7;

    opacity: 0;

    transform:
        translateY(-3px);

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.error.show {
    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================================
   BUTTON
========================================================= */

.btn {
    min-width: 115px;

    margin-top: 2px;

    padding:
        10px
        21px;

    border:
        1px solid
        rgba(255,255,255,0.13);

    border-radius: 14px;

    outline: none;

    background:
        rgba(255,255,255,0.055);

    color: #ffffff;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.btn:hover {
    background:
        rgba(255,255,255,0.08);

    border-color:
        rgba(255,120,155,0.30);
}

.btn:active {
    transform:
        scale(0.96);
}

.btn:disabled {
    opacity: 0.4;

    cursor: default;

    pointer-events: none;
}


/* =========================================================
   SMALL FOOTER
========================================================= */

.tiny {
    margin-top: 13px;

    font-size: 10px;

    color:
        rgba(255,255,255,0.28);
}


/* =========================================================
   SUCCESS
========================================================= */

.success {
    position: absolute;
    inset: 0;

    z-index: 50;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 35px;

    text-align: center;

    background:
        rgba(6,3,8,0.96);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
}

.success.show {
    opacity: 1;

    visibility: visible;
}

.success-card {
    max-width: 305px;

    font-size: 15px;

    line-height: 2.2;

    transform:
        translateY(15px)
        scale(0.96);

    transition:
        transform 0.45s ease;
}

.success.show .success-card {
    transform:
        translateY(0)
        scale(1);
}

.success-heart {
    display: block;

    margin-bottom: 13px;

    font-size: 44px;

    animation:
        heartBeat
        1.05s
        ease-in-out
        infinite;
}

@keyframes heartBeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.17);
    }

}


/* =========================================================
   FINAL
========================================================= */

.final {
    position: absolute;
    inset: 0;

    z-index: 70;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 35px;

    text-align: center;

    cursor: pointer;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,55,115,0.19),
            transparent 48%
        ),
        #08050a;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transform:
        scale(1.04);

    transition:
        opacity 0.65s ease,
        visibility 0.65s ease,
        transform 0.65s ease;
}

.final.show {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transform:
        scale(1);
}

.final-text {
    max-width: 305px;

    font-size: 18px;

    line-height: 2.45;

    text-shadow:
        0 0 25px
        rgba(255,80,130,0.25);
}

.final-pulse {
    display: block;

    margin-top: 18px;

    font-size: 10px;

    color:
        rgba(255,255,255,0.35);

    animation:
        finalPulse
        1.7s
        ease-in-out
        infinite;
}

@keyframes finalPulse {

    0%,
    100% {
        opacity: 0.35;
    }

    50% {
        opacity: 0.85;
    }

}


/* =========================================================
   SCREEN TRANSITION
========================================================= */

.phone.exit {
    opacity: 0;

    transform:
        scale(0.88)
        translateY(20px);

    filter:
        blur(8px);
}


/* =========================================================
   ACCESSIBILITY
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.001ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            0.001ms !important;
    }

}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media (max-height: 650px) {

    .phone {
        height: 94dvh;
    }

    .view {
        padding-top: 45px;
        padding-bottom: 20px;
    }

    .lock {
        width: 37px;
        height: 37px;
        margin-bottom: 7px;
        font-size: 17px;
    }

    .badge {
        margin-bottom: 7px;
    }

    .title {
        font-size: 19px;
    }

    .sub {
        min-height: 38px;
        font-size: 11px;
    }

    .code {
        margin-top: 13px;
    }

    .box {
        width: 55px;
        height: 50px;
        font-size: 22px;
    }

}


/* =========================================================
   VERY SMALL WIDTH
========================================================= */

@media (max-width: 340px) {

    .phone {
        width: 95vw;
    }

    .view {
        padding-left: 16px;
        padding-right: 16px;
    }

    .box {
        width: 50px;
    }

}


/* =========================================================
   LANDSCAPE
========================================================= */

@media (orientation: landscape) and (max-height: 500px) {

    .phone {
        width: min(620px, 90vw);
        height: 92dvh;
        border-radius: 32px;
    }

    .screen {
        border-radius: 26px;
    }

    .view {
        padding:
            25px
            45px;
    }

    .lock {
        display: none;
    }

    .code {
        margin:
            12px
            0
            3px;
    }

    .hint {
        min-height: 35px;
    }

}


/* =========================================================
   FOCUS ACCESSIBILITY
========================================================= */

button:focus-visible,
input:focus-visible {
    outline:
        2px solid
        rgba(255,120,155,0.65);

    outline-offset:
        3px;
}

</style>

</head>

        document.getElementById("success"),

    successText:
        document.getElementById("successText"),

    final:
        document.getElementById("final")

};


/* =========================================================
   DIGIT NORMALIZATION
========================================================= */

const PERSIAN_DIGITS = {

    "۰": "0",
    "۱": "1",
    "۲": "2",
    "۳": "3",
    "۴": "4",
    "۵": "5",
    "۶": "6",
    "۷": "7",
    "۸": "8",
    "۹": "9"

};


const ARABIC_DIGITS = {

    "٠": "0",
    "١": "1",
    "٢": "2",
    "٣": "3",
    "٤": "4",
    "٥": "5",
    "٦": "6",
    "٧": "7",
    "٨": "8",
    "٩": "9"

};


function normalizeDigits(value) {

    if (
        typeof value !== "string"
    ) {
        return "";
    }

    return value
        .replace(
            /[۰-۹]/g,
            character =>
                PERSIAN_DIGITS[character]
        )
        .replace(
            /[٠-٩]/g,
            character =>
                ARABIC_DIGITS[character]
        );

}


function digitsOnly(value) {

    return normalizeDigits(value)
        .replace(
            /[^0-9]/g,
            ""
        );

}


/* =========================================================
   TIMER MANAGER
========================================================= */

function addTimer(
    callback,
    delay
) {

    const timer =
        window.setTimeout(
            () => {

                state.timers =
                    state.timers.filter(
                        item =>
                            item !== timer
                    );

                callback();

            },
            delay
        );

    state.timers.push(
        timer
    );

    return timer;

}


function clearAllTimers() {

    state.timers.forEach(
        timer =>
            window.clearTimeout(
                timer
            )
    );

    state.timers.length =
        0;

}


/* =========================================================
   EVENT MANAGER
========================================================= */

function listen(
    element,
    event,
    handler,
    options
) {

    if (!element) {
        return;
    }

    element.addEventListener(
        event,
        handler,
        options
    );

    state.listeners.push({

        element:
            element,

        event:
            event,

        handler:
            handler,

        options:
            options

    });

}


/* =========================================================
   RANDOM
========================================================= */

function random(
    min,
    max
) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================================================
   STARS
========================================================= */

function createStars() {

    if (!DOM.stars) {
        return;
    }

    DOM.stars.innerHTML =
        "";

    const fragment =
        document.createDocumentFragment();

    for (
        let i = 0;
        i < CONFIG.stars;
        i++
    ) {

        const star =
            document.createElement(
                "span"
            );

        star.className =
            "star";

        star.style.left =
            random(1, 99) + "%";

        star.style.top =
            random(1, 99) + "%";

        star.style.setProperty(
            "--duration",
            random(2, 5) + "s"
        );

        star.style.setProperty(
            "--delay",
            "-" + random(0, 5) + "s"
        );

        star.style.opacity =
            (
                Math.random() *
                0.55 +
                0.15
            ).toFixed(2);

        fragment.appendChild(
            star
        );

    }

    DOM.stars.appendChild(
        fragment
    );

}


/* =========================================================
   HEARTS
========================================================= */

function createHearts() {

    if (!DOM.hearts) {
        return;
    }

    DOM.hearts.innerHTML =
        "";

    const fragment =
        document.createDocumentFragment();

    for (
        let i = 0;

    ) {

            );

        );

        heart.style.setProperty(
            "--delay",
            random(0, 12) + "s"
        );

        heart.style.setProperty(

        );

    );

/* =========================================================
   RESET INPUT VALUES
========================================================= */

function resetInputValues() {

    state.inputs.forEach(
        input => {

            input.value =
                "";

            input.classList.remove(
                "filled"
            );

            input.classList.remove(
                "invalid"
            );

            input.classList.remove(
                "valid"
            );

        }
    );

}


/* =========================================================
   CREATE ONE INPUT
========================================================= */

function createInput(
    maxLength,
    index
) {

    const input =
        document.createElement(
            "input"
        );

    input.className =
        "box";

    input.type =
        "text";

    input.inputMode =
        "numeric";

    input.autocomplete =
        "off";

    input.spellcheck =
        false;

    input.maxLength =
        maxLength;

    input.pattern =
        "[0-9۰-۹٠-٩]*";

    input.setAttribute(
        "aria-label",
        "بخش " + (index + 1) + " از رمز"
    );

    input.dataset.index =
        String(index);

    listen(
        input,
        "input",
        event =>
            handleInput(
                event,
                index
            )
    );

    listen(
        input,
        "keydown",
        event =>
            handleKeydown(
                event,
                index
            )
    );

    listen(
        input,
        "paste",
        event =>
            handlePaste(
                event,
                index
            )
    );

    listen(
        input,
        "focus",
        () =>
            handleFocus(
                input
            )
    );

    listen(
        input,
        "blur",
        () =>
            handleBlur(
                input
            )
    );

    return input;

}


/* =========================================================
   CREATE CODE INPUTS
========================================================= */

function createCodeInputs(
    parts
) {

    state.inputs =
        [];

    DOM.code.innerHTML =
        "";

    parts.forEach(
        (
            part,
            index
        ) => {

            const input =
                createInput(
                    part.length,
                    index
                );

            DOM.code.appendChild(
                input
            );

            state.inputs.push(
                input
            );

            if (
                index <
                parts.length - 1
            ) {

                const slash =
                    document.createElement(
                        "span"
                    );

                slash.className =
                    "slash";

                slash.textContent =
                    "/";

                slash.setAttribute(
                    "aria-hidden",
                    "true"
                );

                DOM.code.appendChild(
                    slash
                );

            }

        }
    );

}


/* =========================================================
   INPUT HANDLER
========================================================= */

function handleInput(
    event,
    index
) {

    if (
        state.locked ||
        state.finished
    ) {
        return;
    }

    const input =
        event.currentTarget;

    const currentIndex =
        index;

    const question =
        getQuestion();

    if (!question) {
        return;
    }

    const maxLength =
        question.parts[
            currentIndex
        ].length;

    const value =
        digitsOnly(
            input.value
        ).slice(
            0,
            maxLength
        );

    input.value =
        value;

    updateInputState(
        input
    );

    hideError();

    if (
        value.length ===
        maxLength
    ) {

        focusNext(
            currentIndex
        );

    }

}


/* =========================================================
   DISTRIBUTE DIGITS
========================================================= */

function distributeDigits(
    value,
    startIndex
) {

    const question =
        getQuestion();

    if (!question) {
        return;
    }

    let clean =
        digitsOnly(value);

    let position =
        startIndex;

    while (
        clean.length > 0 &&
        position < state.inputs.length
    ) {

        const input =
            state.inputs[
                position
            ];

        const capacity =
            question.parts[
                position
            ].length;

        const current =
            digitsOnly(
                input.value
            );

        const available =
            capacity -
            current.length;

        if (
            available <= 0
        ) {

            position++;

            continue;

        }

        const chunk =
            clean.slice(
                0,
                available
            );

        input.value =
            (
                current +
                chunk
            ).slice(
                0,
                capacity
            );

        clean =
            clean.slice(
                chunk.length
            );

        updateInputState(
            input
        );

        if (
            input.value.length ===
            capacity
        ) {

            position++;

        } else {

            break;

        }

    }

    if (
        position <
        state.inputs.length
    ) {

        state.inputs[
            position
        ].focus();

    } else {

        const last =
            state.inputs[
                state.inputs.length - 1
            ];

        if (last) {
            last.focus();
        }

    }

    hideError();

}


/* =========================================================
   PASTE HANDLER
========================================================= */

function handlePaste(
    event,
    index
) {

    if (
        state.locked ||
        state.finished
    ) {
        return;
    }

    event.preventDefault();

    const clipboard =
        event.clipboardData ||
        window.clipboardData;

    if (!clipboard) {
        return;
    }

    const text =
        clipboard.getData(
            "text"
        );

    const clean =
        digitsOnly(
            text
        );

    if (!clean) {
        return;
    }

    distributeDigits(
        clean,
        index
    );

}


/* =========================================================
   KEYBOARD
========================================================= */

function handleKeydown(
    event,
    index
) {

    if (
        state.locked ||
        state.finished
    ) {

        event.preventDefault();

        return;

    }

    const key =
        event.key;

    if (
        key === "Enter"
    ) {

        event.preventDefault();

        checkAnswer();

        return;

    }

    if (
        key === "Backspace"
    ) {

        const input =
            state.inputs[
                index
            ];

        if (
            input &&
            input.value === ""
        ) {

            focusPrevious(
                index
            );

        }

        return;

    }

    if (
        key === "ArrowLeft"
    ) {

        event.preventDefault();

        focusPrevious(
            index
        );

        return;

    }

    if (
        key === "ArrowRight"
    ) {

        event.preventDefault();

        focusNext(
            index
        );

        return;

    }

    if (
        key.length === 1
    ) {

        const normalized =
            digitsOnly(
                key
            );

        if (
            normalized === ""
        ) {

            event.preventDefault();

        }

    }

}


/* =========================================================
   FOCUS
========================================================= */

function handleFocus(
    input
) {

    addTimer(
        () => {

            if (
                document.activeElement ===
                input
            ) {

                input.select();

            }

        },
        0
    );

}


function handleBlur(
    input
) {

    updateInputState(
        input
    );

}


/* =========================================================
   INPUT STATE
========================================================= */

function updateInputState(
    input
) {

    input.classList.remove(
        "invalid"
    );

    input.classList.remove(
        "valid"
    );

    if (
        input.value
    ) {

        input.classList.add(
            "filled"
        );

    } else {

        input.classList.remove(
            "filled"
        );

    }

}


/* =========================================================
   NEXT INPUT
========================================================= */

function focusNext(
    index
) {

    const next =
        state.inputs[
            index + 1
        ];

    if (next) {

        addTimer(
            () => {

                if (
                    !state.locked
                ) {

                    next.focus();

                }

            },
            CONFIG.inputDelay
        );

    }

}


/* =========================================================
   PREVIOUS INPUT
========================================================= */

function focusPrevious(
    index
) {

    const previous =
        state.inputs[
            index - 1
        ];

    if (!previous) {
        return;
    }

    previous.value =
        "";

    updateInputState(
        previous
    );

    previous.focus();

}


/* =========================================================
   CURRENT QUESTION
========================================================= */

function getQuestion() {

    return QUESTIONS[
        state.questionIndex
    ];

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const question =
        getQuestion();

    if (!question) {
        return;
    }

    state.locked =
        false;

    state.wrongAttempts =
        0;

    DOM.counter.textContent =
        "مرحله " +
        (state.questionIndex + 1) +
        " از " +
        QUESTIONS.length;

    DOM.title.textContent =
        question.question;

    DOM.sub.textContent =
        question.subtitle;

    DOM.hint.textContent =
        "";

    DOM.hint.classList.remove(
        "show"
    );

    DOM.error.textContent =
        "";

    DOM.error.classList.remove(
        "show"
    );

    DOM.success.classList.remove(
        "show"
    );

    DOM.success.setAttribute(
        "aria-hidden",
        "true"
    );

    DOM.questionView.classList.remove(
        "hidden"
    );

    DOM.check.disabled =
        false;

    DOM.check.textContent =
        "بررسی";

    createCodeInputs(
        question.parts
    );

    addTimer(
        focusFirstInput,
        100
    );

}


/* =========================================================
   FIRST INPUT
========================================================= */

function focusFirstInput() {

    if (
        !CONFIG.autoFocus
    ) {
        return;
    }

    const first =
        state.inputs[0];

    if (first) {
        first.focus();
    }

}


/* =========================================================
   READ ANSWER
========================================================= */

function readAnswer() {

    return state.inputs.map(
        input =>
            digitsOnly(
                input.value
            )
    );

}


/* =========================================================
   ANSWER COMPLETE
========================================================= */

function answerComplete() {

    const question =
        getQuestion();

    if (!question) {
        return false;
    }

    if (
        state.inputs.length !==
        question.parts.length
    ) {

        return false;

    }

    return question.parts.every(
        (
            part,
            index
        ) => {

            const value =
                digitsOnly(
                    state.inputs[
                        index
                    ].value
                );

            return (
                value.length ===
                part.length
            );

        }
    );

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer() {

    if (
        state.locked ||
        state.finished ||
        state.transitioning
    ) {

        return;

    }

    if (
        !answerComplete()
    ) {

        showError(
            "اول همه‌ی کادرها رو کامل کن 😏"
        );

        shakeCode();

        return;

    }

    const question =
        getQuestion();

    const answer =
        readAnswer();

    const correct =
        answer.every(
            (
                value,
                index
            ) =>
                value ===
                question.parts[
                    index
                ]
        );

    if (correct) {

        handleCorrectAnswer();

    } else {

        handleWrongAnswer();

    }

}


/* =========================================================
   WRONG ANSWER
========================================================= */

function handleWrongAnswer() {

    const question =
        getQuestion();

    if (!question) {
        return;
    }

    state.wrongAttempts++;

    const hintIndex =
        Math.min(
            state.wrongAttempts - 1,
            question.hints.length - 1
        );

    const errorIndex =
        Math.min(
            state.wrongAttempts - 1,
            question.errors.length - 1
        );

    markInputsInvalid();

    shakeCode();

    showHint(
        question.hints[
            hintIndex
        ]
    );

    showError(
        question.errors[
            errorIndex
        ]
    );

    /*
       مهم:
       اینجا دیگر state.inputs را خالی نمی‌کنیم.
       فقط مقدار کادرها پاک می‌شود تا reference
       ورودی‌ها باقی بماند.
    */

    addTimer(
        () => {

            resetInputValues();

            focusFirstInput();

        },
        250
    );

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

function handleCorrectAnswer() {

    state.locked =
        true;

    markInputsValid();

    DOM.check.disabled =
        true;

    const question =
        getQuestion();

    if (!question) {
        return;
    }

    showSuccess(
        question.success
    );

    addTimer(
        () => {

            if (
                state.questionIndex <
                QUESTIONS.length - 1
            ) {

                nextQuestion();

            } else {

                showFinal();

            }

        },
        CONFIG.successDuration
    );

}


/* =========================================================
   INVALID
========================================================= */

function markInputsInvalid() {

    state.inputs.forEach(
        input => {

            input.classList.remove(
                "valid"
            );

            input.classList.add(
                "invalid"
            );

        }
    );

}


/* =========================================================
   VALID
========================================================= */

function markInputsValid() {

    state.inputs.forEach(
        input => {

            input.classList.remove(
                "invalid"
            );

            input.classList.add(
                "valid"
            );

        }
    );

}


/* =========================================================
   SHAKE
========================================================= */

function shakeCode() {

    DOM.code.classList.remove(
        "shake"
    );

    void DOM.code.offsetWidth;

    DOM.code.classList.add(
        "shake"
    );

    addTimer(
        () => {

            DOM.code.classList.remove(
                "shake"
            );

        },
        450
    );

}


/* =========================================================
   HINT
========================================================= */

function showHint(
    text
) {

    DOM.hint.textContent =
        text;

    DOM.hint.classList.remove(
        "show"
    );

    void DOM.hint.offsetWidth;

    DOM.hint.classList.add(
        "show"
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    text
) {

    DOM.error.textContent =
        text;

    DOM.error.classList.remove(
        "show"
    );

    void DOM.error.offsetWidth;

    DOM.error.classList.add(
        "show"
    );

}


function hideError() {

    DOM.error.classList.remove(
        "show"
    );

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
    text
) {

    DOM.successText.innerHTML =
        text;

    DOM.success.setAttribute(
        "aria-hidden",
        "false"
    );

    DOM.success.classList.add(
        "show"
    );

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    DOM.success.classList.remove(
        "show"
    );

    DOM.success.setAttribute(
        "aria-hidden",
        "true"
    );

    state.questionIndex++;

    if (
        state.questionIndex >=
        QUESTIONS.length
    ) {

        showFinal();

        return;

    }

    loadQuestion();

}


/* =========================================================
   FINAL
========================================================= */

function showFinal() {

    state.locked =
        true;

    state.finished =
        true;

    clearAllTimers();

    DOM.questionView.classList.add(
        "hidden"
    );

    DOM.success.classList.remove(
        "show"
    );

    DOM.success.setAttribute(
        "aria-hidden",
        "true"
    );

    DOM.final.classList.add(
        "show"
    );

    DOM.final.setAttribute(
        "aria-hidden",
        "false"
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

function goNextPage() {

    if (
        state.transitioning
    ) {

        return;

    }

    if (
        !state.finished
    ) {

        return;

    }

    state.transitioning =
        true;

    clearAllTimers();

    DOM.final.style.pointerEvents =
        "none";

    DOM.phone.classList.add(
        "exit"
    );

    addTimer(
        () => {

            window.location.href =
                CONFIG.nextPage;

        },
        CONFIG.animationDuration
    );

}


/* =========================================================
   FINAL CLICK
========================================================= */

function handleFinalClick() {

    goNextPage();

}


/* =========================================================
   FINAL KEYBOARD
========================================================= */

function handleFinalKeydown(
    event
) {

    if (
        event.key === "Enter" ||
        event.key === " "
    ) {

        event.preventDefault();

        goNextPage();

    }

}


/* =========================================================
   TOUCH
========================================================= */

function handleTouchStart(
    event
) {

    if (
        state.locked &&
        !state.finished
    ) {

        event.preventDefault();

    }

}


/* =========================================================
   RESIZE
========================================================= */

function handleResize() {

    document.documentElement.style.setProperty(
        "--viewport-height",
        window.innerHeight + "px"
    );

}


/* =========================================================
   VISIBILITY
========================================================= */

function handleVisibilityChange() {

    if (
        document.hidden
    ) {

        return;

    }

    if (
        state.finished
    ) {

        return;

    }

}


/* =========================================================
   GLOBAL ERROR
========================================================= */

function handleGlobalError(
    event
) {

    console.error(
        "Stage 4.5 error:",
        event.error ||
        event.message
    );

}


/* =========================================================
   UNHANDLED PROMISE
========================================================= */

function handleUnhandledRejection(
    event
) {

    console.error(
        "Stage 4.5 promise rejection:",
        event.reason
    );

}


/* =========================================================
   REGISTER EVENTS
========================================================= */

function registerEvents() {

    listen(
        DOM.check,
        "click",
        checkAnswer
    );

    listen(
        DOM.final,
        "click",
        handleFinalClick
    );

    listen(
        DOM.final,
        "keydown",
        handleFinalKeydown
    );

    listen(
        window,
        "resize",
        handleResize
    );

    listen(
        window,
        "orientationchange",
        handleResize
    );

    listen(
        document,
        "visibilitychange",
        handleVisibilityChange
    );

    listen(
        DOM.screen,
        "touchstart",
        handleTouchStart,
        {
            passive: false
        }
    );

    window.addEventListener(
        "error",
        handleGlobalError
    );

    window.addEventListener(
        "unhandledrejection",
        handleUnhandledRejection
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    if (
        state.initialized
    ) {

        return;

    }

    state.initialized =
        true;

    handleResize();

    createStars();

    createHearts();

    registerEvents();

    loadQuestion();

}


/* =========================================================
   SAFE INITIALIZATION
========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initialize,
        {
            once: true
        }
    );

} else {

    initialize();

}

            );

            DOM.final.setAttribute(
                "aria-hidden",
                "true"
            );

            DOM.phone.classList.remove(
                "exit"
            );

            DOM.questionView.classList.remove(
                "hidden"
            );

            loadQuestion();

        }

};

</script>
