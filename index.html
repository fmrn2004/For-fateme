<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>برای فاطمه ❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap');
    body {
      background: #09070a;
      color: #f8eef2;
      font-family: "Vazirmatn", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
    }
    .heart { font-size: 25px; animation: heartbeat 2s infinite; }
    @Keyframes heartbeat {
      0%,100%{transform:scale(1)}50%{transform:scale(1.2)}
    }
  </style>
</head>
<body>
  <div class="heart">♥</div>
  <h2>سلام فاطمه، این پیام مخصوص توئه 💌</h2>
</body>
</html>
