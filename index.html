<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>برای فاطمه ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#09070a
}

body{
  font-family:Vazirmatn,sans-serif;
  color:#f8eef2
}

.page{
  position:relative;
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  isolation:isolate
}

.glow{
  position:absolute;
  width:340px;
  height:340px;
  border-radius:50%;
  background:rgba(184,55,91,.13);
  filter:blur(75px);
  z-index:-1;
  animation:breathe 5s ease-in-out infinite
}

.content{
  width:min(560px,100%);
  text-align:center
}

.heart{
  font-size:25px;
  margin-bottom:32px;
  display:inline-block;
  opacity:.9;
  animation:heartbeat 2.2s ease-in-out infinite
}

.message{
  font-size:clamp(18px,4.5vw,25px);
  line-height:2.25;
  font-weight:400;
  letter-spacing:-.3px
}

.soft{
  opacity:0;
  animation:lineIn .9s ease forwards
}

.l1{
  animation-delay:.35s
}

.l2{
  animation-delay:.9s
}

.l3{
  animation-delay:1.45s
}

.l4{
  animation-delay:2s
}

.question{
  margin-top:12px
}

.button-wrap{
  margin-top:42px;
  opacity:0;
  animation:lineIn .9s ease 2.7s forwards
}

button{
  border:1px solid rgba(255,190,210,.3);
  background:rgba(255,255,255,.035);
  color:#fff4f7;
  padding:13px 30px;
  border-radius:999px;
  font-family:inherit;
  font-size:15px;
  cursor:pointer;
  transition:.3s;
  backdrop-filter:blur(10px)
}

button:hover{
  background:rgba(255,255,255,.09);
  border-color:rgba(255,190,210,.55);
  transform:translateY(-2px)
}

button:active{
  transform:scale(.97)
}

.hint{
  margin-top:15px;
  font-size:11px;
  opacity:.28
}

@keyframes lineIn{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes heartbeat{
  0%,100%{
    transform:scale(1)
  }

  12%{
    transform:scale(1.12)
  }

  24%{
    transform:scale(1)
  }

  36%{
    transform:scale(1.08)
  }

  50%{
    transform:scale(1)
  }
}

@keyframes breathe{
  0%,100%{
    transform:scale(.9);
    opacity:.65
  }

  50%{
    transform:scale(1.08);
    opacity:1
  }
}
</style>
</head>

<body>

<main class="page">

  <div class="glow"></div>

  <section class="content">

    <div class="heart">♥️</div>

    <div class="message">

      <div class="soft l1">
        خب خب خانوم خوشگله... ❤️
      </div>

      <div class="soft l2">
        من مدت‌ها داخل این شیشه بودم
      </div>

      <div class="soft l3">
        و منتظر اینکه پیدام کنی.
      </div>

      <div class="soft l4 question">
        حالا که بالاخره پیدام کردی...<br>
        نظرت چیه بفهمی من برای چی اینجام؟ 👀
      </div>

    </div>

    <div class="button-wrap">

      <button id="nextButton">
        بگو ببینم... ❤️
      </button>

      <div class="hint">
        یک راز کوچولو پشت این دکمه منتظرته
      </div>

    </div>

  </section>

</main>


<script>

(function(){

  const next=document.getElementById('nextButton');

  let moving=false;

  next.addEventListener('click',function(){

    if(moving) return;

    moving=true;

    next.disabled=true;

    document.querySelector('.content').animate(
      [
        {
          opacity:1,
          transform:'translateY(0)'
        },
        {
          opacity:0,
          transform:'translateY(-10px)'
        }
      ],
      {
        duration:500,
        easing:'ease',
        fill:'forwards'
      }
    );

    window.setTimeout(function(){

      window.location.replace('./stage2.html');

    },520);

  });

})();

</script>

</body>
</html>
