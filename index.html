<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برای فاطمه ❤️</title>
  <style>
    body {
      margin: 0;
      background: #09070a;
      color: #f8eef2;
      font-family: "Vazirmatn", sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .content {
      text-align: center;
      max-width: 600px;
    }

    .spider {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 40px;
      opacity: 0;
    }
    .spider.show {
      animation: descend 4s ease forwards;
    }
    @keyframes descend {
      0% { top: -150px; opacity: 0; }
      30% { opacity: 1; }
      100% { top: 60%; opacity: 1; }
    }

    .big-btn {
      margin-top: 40px;
      padding: 18px 40px;
      font-size: 18px;
      border-radius: 999px;
      background: linear-gradient(145deg, #ffb6c1, #ff69b4);
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255,105,180,0.4);
      transition: transform 0.3s ease;
    }
    .big-btn:hover {
      transform: scale(1.05);
    }

    .options {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    .options li {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .options li:hover {
      background: rgba(255,255,255,0.1);
    }

    .response {
      margin-top: 20px;
      font-size: 14px;
      color: #ffb6c1;
    }

    /* مرحله بطری و قلب‌ها */
    .bottle {
      margin: 20px auto;
      width: 180px;
      height: 280px;
      background: rgba(255,255,255,0.08);
      border: 3px solid #ff69b4;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      cursor: pointer;
      transition: all 2s ease;
      overflow: hidden;
    }
    .bottle.shrink {
      transform: scale(0.5);
      position: absolute;
      bottom: 20px;
      right: 20px;
    }
    .next-message {
      opacity: 0;
      text-align: center;
      max-width: 600px;
      line-height: 2;
      font-size: 20px;
      transition: opacity 2s ease;
    }
    .next-message.show {
      opacity: 1;
    }
    .heart {
      position: absolute;
      top: -20px;
      font-size: 20px;
      color: #ff69b4;
      animation: fall 5s linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(100vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="spider">🕷️❤️</div>
    <section class="content">
      <div>
        <div>خب خب خانوم خوشگله... ❤️</div>
        <div>من مدت‌ها داخل این شیشه بودم</div>
        <div>و منتظر اینکه پیدام کنی.</div>
        <div>حالا که بالاخره پیدام کردی... 👀</div>
      </div>
    </section>
  </main>

  <script>
    const spider = document.querySelector(".spider");
    const content = document.querySelector(".content");

    // هرجای صفحه کلیک بشه → عنکبوت ظاهر میشه
    document.body.addEventListener("click", () => {
      spider.classList.add("show");
    }, { once: true });

    // وقتی انیمیشن عنکبوت تمام شد → دکمه آماده ظاهر میشه
    spider.addEventListener("animationend", () => {
      spider.style.display = "none";
      content.innerHTML = 

        <button id="readyBtn" class="big-btn">من آماده‌ام...</button>
      
;
      document.getElementById("readyBtn").addEventListener("click", () => {
        loadQuizPage();
      });
    });

    // صفحه‌ی سوال
    function loadQuizPage() {
      content.innerHTML = `
        <div class="question-text">
        برای اینکه مطمئن بشم من به دست آدم درستی افتادم باید اول به سوال زیر جواب بدی:<br>
          محمدحسینِ <span id="fateme" style="cursor:pointer; color:#ff69b4; font-weight:bold;">فاطمه</span> چیو بیشتر از همه چی دوست داره؟
        </div>
        <ul class="options">
          <li>۱. پیتزا</li>
          <li>۲. فیلم و سریال</li>
          <li>۳. فوتبال</li>
          <li>۴. پول</li>
        </ul>
        <div id="response" class="response"></div>
      
;

      document.querySelectorAll(".options li").forEach(li => {
        li.addEventListener("click", () => {
          document.getElementById("response").textContent =
            "نههه! جواب اشتباهه 😅 دوباره فکر کن...";
        });
      });

      // تنها راه درست: کلیک روی کلمه‌ی فاطمه
      document.getElementById("fateme").addEventListener("click", () => {
        startBottleStage();
      });
    }

    // مرحله بطری و قلب‌ها
    function startBottleStage() {
      content.innerHTML = 
        <div class="bottle" id="bottle">❤️</div>
        <div class="next-message" id="msg">
          آفرین 😏 با حالت تمسخر تو درست جواب دادی<br>
          بعد کلی تلاش محمدحسینت تو رو از کل دنیا هم بیشتر دوست داره کله‌پوک!
        </div>
      
;

      // بارش قلب‌ها
      function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }
      setInterval(createHeart, 400);

      const bottle = document.getElementById("bottle");
      const msg = document.getElementById("msg");

      // بعد از چند ثانیه بطری کوچیک بشه و متن ظاهر بشه
      setTimeout(() => {
        bottle.classList.add("shrink");
        msg.classList.add("show");
      }, 5000);

      // تنها راه رفتن به مرحله بعد: کلیک روی بطری
      bottle.addEventListener("click", () => {
        content.innerHTML = 
          <h1 style="text-align:center; margin-top:40vh;">مرحله‌ی بعدی شروع شد... ❤️</h1>
        `;
      });
    }
  </script>
</body>
</html>
