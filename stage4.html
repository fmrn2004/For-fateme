<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>شیشه عشق</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#09070a;
  color:#fff;
  font-family:
    "Vazirmatn",
    Tahoma,
    Arial,
    sans-serif;
}


/* =========================================================
   PAGE
========================================================= */

.page{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(150,20,65,.18),
      transparent 55%
    ),
    #09070a;
}


/* نور بسیار نرم پس‌زمینه */

.page:after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      circle,
      rgba(255,70,120,.07),
      transparent 58%
    );

  animation:
    glow 5s ease-in-out infinite;
}


/* =========================================================
   STAGE
========================================================= */

.stage{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;
}


/* =========================================================
   FIRST HEART
   قلبی که از مرحله قبل وارد می‌شود
========================================================= */

.first-heart{

  position:absolute;

  left:50%;
  top:-45px;

  z-index:20;

  font-size:27px;

  opacity:0;

  filter:
    drop-shadow(
      0 0 10px
      rgba(255,70,120,.65)
    );

  animation:
    fallIn
    2.1s
    cubic-bezier(.2,.72,.25,1)
    .35s
    forwards;
}


/* =========================================================
   BOTTLE
========================================================= */

.bottle{

  position:absolute;

  left:50%;
  bottom:55px;

  width:154px;
  height:315px;

  transform:
    translateX(-50%);

  opacity:0;

  z-index:10;

  animation:
    bottleIn
    1s
    ease
    1.85s
    forwards;

  cursor:default;

  /* جلوگیری از هرگونه تداخل لمس */
  pointer-events:none;
}


/* =========================================================
   BOTTLE NECK
========================================================= */

.neck{

  position:absolute;

  left:50%;
  top:0;

  width:48px;
  height:67px;

  transform:
    translateX(-50%);

  border:
    1px solid
    rgba(255,255,255,.27);

  border-bottom:0;

  border-radius:
    14px 14px 3px 3px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.03),
      rgba(255,80,130,.045),
      rgba(255,255,255,.015)
    );
}


/* =========================================================
   BOTTLE RIM
========================================================= */

.rim{

  position:absolute;

  left:50%;
  top:-5px;

  width:59px;
  height:14px;

  transform:
    translateX(-50%);

  border:
    1px solid
    rgba(255,255,255,.34);

  border-radius:50%;

  background:
    rgba(255,255,255,.035);

  z-index:2;
}


/* =========================================================
   BOTTLE BODY
========================================================= */

.body{

  position:absolute;

  left:50%;
  top:48px;

  width:154px;
  height:267px;

  transform:
    translateX(-50%);

  border:
    1px solid
    rgba(255,255,255,.27);

  border-radius:
    43px 43px 30px 30px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.035),
      rgba(255,80,130,.055),
      rgba(255,255,255,.018)
    );

  box-shadow:

    inset
    12px 0 25px
    rgba(255,255,255,.025),

    inset
    -14px 0 30px
    rgba(255,40,100,.035),

    0 0 35px
    rgba(255,40,100,.08);

  overflow:hidden;
}


/* =========================================================
   BOTTLE SHINE
========================================================= */

.shine{

  position:absolute;

  left:15px;
  top:18px;

  width:8px;
  height:200px;

  border-radius:50%;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.24),
      transparent
    );

  filter:blur(2px);

  opacity:.45;
}


/* =========================================================
   INSIDE BOTTLE
========================================================= */

.inside{

  position:absolute;

  inset:0;

  overflow:hidden;

  pointer-events:none;
}


/* قلب‌های داخل شیشه */

.inside .heart{

  position:absolute;

  color:#ff5b87;

  font-size:var(--s);

  left:var(--x);
  bottom:var(--y);

  filter:
    drop-shadow(
      0 0 6px
      rgba(255,60,110,.4)
    );

  animation:
    tinyBeat
    1.5s
    ease-in-out
    infinite
    var(--d);
}


/* =========================================================
   RAIN HEARTS
========================================================= */

.rain-heart{

  position:absolute;

  left:var(--x);
  top:-45px;

  z-index:15;

  font-size:var(--s);

  opacity:0;

  color:#ff668f;

  filter:
    drop-shadow(
      0 0 7px
      rgba(255,60,110,.45)
    );

  animation:
    rain
    var(--t)
    cubic-bezier(.2,.68,.25,1)
    var(--delay)
    forwards;

  pointer-events:none;
}


/* =========================================================
   PHONE
========================================================= */

.phone{

  position:absolute;

  left:50%;
  top:50%;

  width:208px;
  height:394px;

  transform:
    translate(-50%,-50%)
    scale(.12);

  opacity:0;

  z-index:30;

  border:
    5px solid
    #272229;

  border-radius:33px;

  background:#050406;

  box-shadow:

    0 20px 70px
    rgba(0,0,0,.7),

    0 0 45px
    rgba(255,40,100,.13);

  overflow:hidden;

  /*
    مهم‌ترین اصلاح:
    قبلاً pointer-events:none بود.
    بنابراین حتی بعد از ظاهر شدن گوشی،
    لمس/کلیک به آن نمی‌رسید.
  */
  pointer-events:auto;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;

  touch-action:manipulation;

  user-select:none;
}


/* =========================================================
   PHONE NOTCH
========================================================= */

.phone:before{

  content:"";

  position:absolute;

  top:8px;
  left:50%;

  width:72px;
  height:16px;

  transform:
    translateX(-50%);

  border-radius:
    0 0 12px 12px;

  background:#111014;

  z-index:3;

  pointer-events:none;
}


/* =========================================================
   PHONE SCREEN
========================================================= */

.screen{

  position:absolute;

  inset:7px;

  border-radius:25px;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(130,20,55,.28),
      transparent 52%
    ),
    #0b080c;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:
    32px 18px;

  text-align:center;

  pointer-events:none;
}


/* =========================================================
   PHONE TEXT
========================================================= */

.phone-text{

  opacity:0;

  transform:
    translateY(15px);

  font-size:16px;

  line-height:2.25;

  font-weight:500;

  text-shadow:
    0 0 16px
    rgba(255,100,145,.15);

  pointer-events:none;
}


/* قلب پایین متن */

.phone-text .ph{

  display:block;

  margin-top:12px;

  font-size:25px;

  animation:
    tinyBeat
    1.3s
    ease-in-out
    infinite;
}


/* =========================================================
   COMPLETE STATE
========================================================= */

/*
  بعد از پایان بارش:

  شیشه → داخل گوشی
  گوشی → بزرگ می‌شود
  متن → ظاهر می‌شود
*/

.page.complete .bottle{

  animation:
    bottleIntoPhone
    1.45s
    cubic-bezier(.2,.8,.2,1)
    forwards;
}


.page.complete .phone{

  animation:
    phoneIn
    1.45s
    cubic-bezier(.2,.8,.2,1)
    forwards;

  /*
    تضمین می‌کنیم در حالت نهایی
    گوشی قابل لمس باشد.
  */

  pointer-events:auto;

  cursor:pointer;
}


.page.complete .phone-text{

  animation:
    textIn
    1.1s
    ease
    1.45s
    forwards;
}


/* =========================================================
   EXIT
========================================================= */

.page.exit{

  animation:
    exit
    .8s
    ease
    forwards;

  pointer-events:none;
}


/* =========================================================
   ANIMATIONS
========================================================= */


/* قلب اول */

@keyframes fallIn{

  0%{

    opacity:0;

    top:-45px;

    transform:
      translateX(-50%)
      scale(.4);
  }

  12%{

    opacity:1;
  }

  82%{

    top:405px;

    transform:
      translateX(-50%)
      scale(1);
  }

  100%{

    opacity:0;

    top:430px;

    transform:
      translateX(-50%)
      scale(.5);
  }
}


/* ورود اولیه شیشه */

@keyframes bottleIn{

  from{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(18px)
      scale(.93);
  }

  to{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
  }
}


/* بارش قلب‌ها */

@keyframes rain{

  0%{

    opacity:0;

    top:-45px;

    transform:
      translateX(0)
      rotate(0)
      scale(.65);
  }

  10%{

    opacity:1;
  }

  78%{

    opacity:1;

    top:465px;

    transform:
      translateX(var(--drift))
      rotate(260deg)
      scale(1);
  }

  100%{

    opacity:0;

    top:530px;

    transform:
      translateX(var(--drift))
      rotate(330deg)
      scale(.75);
  }
}


/* شیشه وارد گوشی می‌شود */

@keyframes bottleIntoPhone{

  0%{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
  }

  45%{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(-28px)
      scale(.7);
  }

  100%{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(0)
      scale(.15);
  }
}


/* ظاهر شدن گوشی */

@keyframes phoneIn{

  0%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.12);
  }

  45%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.34);
  }

  100%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }
}


/* ظاهر شدن متن */

@keyframes textIn{

  to{

    opacity:1;

    transform:
      translateY(0);
  }
}


/* ضربان قلب */

@keyframes tinyBeat{

  0%,
  100%{

    transform:
      scale(1);
  }

  15%{

    transform:
      scale(1.16);
  }

  30%{

    transform:
      scale(1);
  }
}


/* نور پس‌زمینه */

@keyframes glow{

  0%,
  100%{

    opacity:.55;

    transform:
      scale(1);
  }

  50%{

    opacity:1;

    transform:
      scale(1.08);
  }
}


/* خروج */

@keyframes exit{

  to{

    opacity:0;

    transform:
      scale(.97);

    filter:
      blur(5px);
  }
}


/* =========================================================
   SMALL HEIGHT DEVICES
========================================================= */

@media(max-height:650px){

  .bottle{

    bottom:35px;

    transform:
      translateX(-50%)
      scale(.82);
  }


  .page.complete .bottle{

    animation:
      bottleIntoPhoneSmall
      1.45s
      cubic-bezier(.2,.8,.2,1)
      forwards;
  }
}


/* شیشه برای صفحه‌های کوتاه */

@keyframes bottleIntoPhoneSmall{

  0%{

    opacity:1;

    transform:
      translateX(-50%)
      scale(.82);
  }

  45%{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(-25px)
      scale(.57);
  }

  100%{

    opacity:0;

    transform:
      translateX(-50%)
      scale(.12);
  }
}


/* =========================================================
   ACCESSIBILITY / TOUCH
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    scroll-behavior:auto !important;
  }
}


/* =========================================================
   VERY SMALL WIDTH
========================================================= */

@media(max-width:360px){

  .phone{

    width:196px;
    height:372px;

    border-radius:30px;
  }

  .screen{

    border-radius:23px;

    padding:
      28px 15px;
  }

  .phone-text{

    font-size:15px;

    line-height:2.15;
  }
}

</style>

</head>


<body>


<!-- =======================================================
     MAIN PAGE
======================================================= -->

<div
  class="page"
  id="page"
>

  <div class="stage">


    <!-- ===================================================
         FIRST HEART
    ==================================================== -->

    <div
      class="first-heart"
      aria-hidden="true"
    >
      ❤️
    </div>


    <!-- ===================================================
         BOTTLE
    ==================================================== -->

    <div
      class="bottle"
      id="bottle"
      aria-hidden="true"
    >

      <div class="neck"></div>

      <div class="rim"></div>

      <div class="body">

        <div class="shine"></div>

        <div
          class="inside"
          id="inside"
        ></div>

      </div>

    </div>


    <!-- ===================================================
         PHONE
    ==================================================== -->

    <div
      class="phone"
      id="phone"
      role="button"
      tabindex="0"
      aria-label="ادامه"
      aria-disabled="true"
    >

      <div class="screen">

        <div
          class="phone-text"
          id="phoneText"
        >

          کله پوک اینقدر فکر کردن نداشت،

          <br>

          معلومه که محمدحسین تو رو از کل دنیا بیشتر دوست داره

          <span class="ph">
            ❤️
          </span>

        </div>

      </div>

    </div>


  </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const page =
  document.getElementById("page");

const inside =
  document.getElementById("inside");

const phone =
  document.getElementById("phone");


/* =========================================================
   STATE
========================================================= */

let active = false;

let done = false;

let navigationStarted = false;


/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

  /*
    زمان شروع اضافه شدن قلب‌ها
  */

  rainStart:2250,


  /*
    تعداد قلب‌های بارشی
  */

  rainCount:34,


  /*
    زمان شروع انیمیشن نهایی
  */

  completeAt:7900,


  /*
    مدت خروج
  */

  exitDuration:800,


  /*
    مقصد مرحله بعد
  */

  nextStage:"stage4.5.html"

};


/* =========================================================
   ADD HEART INSIDE BOTTLE
========================================================= */

function addInsideHeart(first=false){

  const h =
    document.createElement("span");

  h.className =
    "heart";

  h.textContent =
    "❤️";


  h.style.setProperty(
    "--s",
    first
      ? "24px"
      : (13 + Math.random()*15) + "px"
  );


  h.style.setProperty(
    "--x",
    (5 + Math.random()*88) + "%"
  );


  h.style.setProperty(
    "--y",
    (2 + Math.random()*88) + "%"
  );


  h.style.setProperty(
    "--d",
    (Math.random()*1.5) + "s"
  );


  inside.appendChild(h);

}


/* =========================================================
   CREATE RAIN HEART
========================================================= */

function rain(i){

  const h =
    document.createElement("div");


  h.className =
    "rain-heart";


  h.textContent =
    Math.random() > .18
      ? "❤️"
      : "🩷";


  const delay =
    i * .13 +
    Math.random() * .35;


  const duration =
    2.45 +
    Math.random() * 1.55;


  h.style.setProperty(
    "--x",
    (7 + Math.random()*86) + "%"
  );


  h.style.setProperty(
    "--s",
    (13 + Math.random()*15) + "px"
  );


  h.style.setProperty(
    "--t",
    duration + "s"
  );


  h.style.setProperty(
    "--delay",
    delay + "s"
  );


  h.style.setProperty(
    "--drift",
    (Math.random()*55 - 27) + "px"
  );


  document.body.appendChild(h);


  /*
    وقتی قلب بارشی تمام شد،
    آن را داخل شیشه قرار می‌دهیم.
  */

  setTimeout(

    () => {

      /*
        اگر صفحه در حال خروج نیست،
        قلب را داخل شیشه قرار بده.
      */

      if(!done){

        addInsideHeart();

      }


      h.remove();

    },

    Math.max(
      0,
      (delay + duration)*1000 - 70
    )

  );

}


/* =========================================================
   START HEART RAIN
========================================================= */

setTimeout(

  () => {

    /*
      قلب اصلی
    */

    addInsideHeart(true);


    /*
      قلب‌های بارشی
    */

    for(
      let i=0;
      i<CONFIG.rainCount;
      i++
    ){

      rain(i);

    }

  },

  CONFIG.rainStart

);


/* =========================================================
   COMPLETE ANIMATION
========================================================= */

function completeAnimation(){

  /*
    اگر قبلاً فعال شده،
    دوباره اجرا نشود.
  */

  if(active || done){

    return;

  }


  page.classList.add(
    "complete"
  );


  active = true;


  /*
    گوشی از این لحظه واقعاً
    قابل لمس است.
  */

  phone.style.pointerEvents =
    "auto";


  phone.style.cursor =
    "pointer";


  phone.setAttribute(
    "aria-disabled",
    "false"
  );

}


/* =========================================================
   START FINAL ANIMATION
========================================================= */

setTimeout(

  completeAnimation,

  CONFIG.completeAt

);


/* =========================================================
   NAVIGATION
========================================================= */

function navigateToNextStage(){

  /*
    جلوگیری از چندبار انتقال
  */

  if(navigationStarted){

    return;

  }


  navigationStarted = true;


  /*
    مقصد اصلی:
    stage4.5.html
  */

  window.location.assign(
    CONFIG.nextStage
  );

}


/* =========================================================
   PHONE ACTIVATION
========================================================= */

function activatePhone(){

  /*
    قبل از ظاهر شدن کامل گوشی،
    لمس هیچ اثری ندارد.
  */

  if(!active){

    return;

  }


  /*
    جلوگیری از چند کلیک
  */

  if(done){

    return;

  }


  done = true;


  /*
    از اینجا به بعد گوشی دیگر
    قابل کلیک نیست.
  */

  phone.style.pointerEvents =
    "none";


  phone.setAttribute(
    "aria-disabled",
    "true"
  );


  /*
    شروع خروج
  */

  page.classList.add(
    "exit"
  );


  /*
    بعد از پایان انیمیشن خروج،
    وارد مرحله 4.5 می‌شویم.
  */

  setTimeout(

    navigateToNextStage,

    CONFIG.exitDuration

  );

}


/* =========================================================
   MOUSE CLICK
========================================================= */

phone.addEventListener(

  "click",

  function(){

    activatePhone();

  }

);


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

phone.addEventListener(

  "keydown",

  function(event){

    /*
      Enter یا Space
      همان رفتار لمس گوشی را انجام می‌دهد.
    */

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      event.preventDefault();

      activatePhone();

    }

  }

);


/* =========================================================
   PREVENT ACCIDENTAL DOUBLE TOUCH
========================================================= */

phone.addEventListener(

  "touchend",

  function(event){

    /*
      جلوگیری از رفتارهای عجیب مرورگر
      در بعضی گوشی‌ها
    */

    event.preventDefault();

    activatePhone();

  },

  {
    passive:false
  }

);


/* =========================================================
   DEBUG-SAFE FALLBACK
========================================================= */

/*
  اگر به هر دلیلی animationend یا CSS animation
  رفتار غیرعادی داشت، زمان‌بندی اصلی JS همچنان
  مرحله را فعال می‌کند.
*/


window.addEventListener(

  "pageshow",

  function(){

    /*
      وقتی صفحه دوباره از cache باز می‌شود،
      وضعیت اولیه را حفظ می‌کنیم.
    */

    if(
      !page.classList.contains("exit")
    ){

      phone.style.pointerEvents =
        active
          ? "auto"
          : "none";

    }

  }

);


/* =========================================================
   PREVENT CONTEXT MENU ON PHONE
========================================================= */

phone.addEventListener(

  "contextmenu",

  function(event){

    event.preventDefault();

  }

);

</script>


</body>

</html>
