<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>شیشه عشق</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');


*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body{

  width:100%;
  height:100%;

  margin:0;

  overflow:hidden;

  background:#09070a;

  color:#fff;

  font-family:
    "Vazirmatn",
    Tahoma,
    Arial,
    sans-serif;

  touch-action:manipulation;
}


body{
  user-select:none;
}


.page{

  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(150,20,65,.20),
      transparent 55%
    ),
    #09070a;

  transition:
    background .8s ease;
}


.page:after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,70,120,.08),
      transparent 58%
    );

  animation:
    glow
    5s
    ease-in-out
    infinite;
}


.stage{

  position:absolute;

  inset:0;
}


/* =====================================================
   قلب اولیه
===================================================== */

.first-heart{

  position:absolute;

  left:50%;

  top:-45px;

  z-index:20;

  font-size:27px;

  opacity:0;

  filter:
    drop-shadow(
      0 0 10px
      rgba(255,70,120,.65)
    );

  animation:
    fallIn
    2.1s
    cubic-bezier(.2,.72,.25,1)
    .35s
    forwards;
}


/* =====================================================
   بطری
===================================================== */

.bottle{

  position:absolute;

  left:50%;

  bottom:55px;

  width:154px;

  height:315px;

  transform:
    translateX(-50%);

  opacity:0;

  z-index:10;

  animation:
    bottleIn
    1s
    ease
    1.85s
    forwards;

  pointer-events:none;
}


/* هاله پشت بطری */

.bottle::before{

  content:"";

  position:absolute;

  left:50%;

  top:48%;

  width:220px;

  height:320px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(255,40,110,.22),
      rgba(255,40,110,.08) 38%,
      transparent 72%
    );

  filter:blur(18px);

  opacity:.4;

  z-index:-2;

  animation:
    bottleAura
    3s
    ease-in-out
    infinite;
}


/* گرد و غبارهای نورانی */

.bottle::after{

  content:"✦  ·  ✧  ·  ✦";

  position:absolute;

  left:50%;

  top:42%;

  width:240px;

  transform:
    translate(-50%,-50%);

  text-align:center;

  font-size:11px;

  letter-spacing:15px;

  color:
    rgba(255,150,180,.55);

  filter:
    blur(.2px)
    drop-shadow(
      0 0 7px
      rgba(255,80,130,.7)
    );

  opacity:.45;

  z-index:-1;

  animation:
    sparkleFloat
    4s
    ease-in-out
    infinite;
}


/* گردن */

.neck{

  position:absolute;

  left:50%;

  top:0;

  width:48px;

  height:67px;

  transform:
    translateX(-50%);

  border:
    1px solid
    rgba(255,255,255,.30);

  border-bottom:0;

  border-radius:
    14px 14px 3px 3px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.04),
      rgba(255,80,130,.065),
      rgba(255,255,255,.018)
    );

  box-shadow:
    inset 5px 0 9px
    rgba(255,255,255,.035),

    inset -5px 0 10px
    rgba(255,40,100,.03);
}


/* دهانه */

.rim{

  position:absolute;

  left:50%;

  top:-5px;

  width:59px;

  height:14px;

  transform:
    translateX(-50%);

  border:
    1px solid
    rgba(255,255,255,.40);

  border-radius:50%;

  background:
    rgba(255,255,255,.045);

  box-shadow:
    0 0 12px
    rgba(255,80,130,.10);

  z-index:2;
}


/* بدنه */

.body{

  position:absolute;

  left:50%;

  top:48px;

  width:154px;

  height:267px;

  transform:
    translateX(-50%);

  border:
    1px solid
    rgba(255,255,255,.30);

  border-radius:
    43px 43px 30px 30px;
  background:
    linear-gradient(
      105deg,
      rgba(255,255,255,.065),
      rgba(255,90,140,.075) 35%,
      rgba(255,255,255,.025) 62%,
      rgba(255,70,130,.055)
    );

  box-shadow:

    inset 10px 0 25px
    rgba(255,255,255,.035),

    inset -14px 0 30px
    rgba(255,40,100,.045),

    inset 0 -25px 45px
    rgba(255,30,100,.055),

    0 0 35px
    rgba(255,40,100,.10),

    0 0 75px
    rgba(255,40,100,.045);

  overflow:hidden;
}


/* برق اصلی شیشه */

.body::before{

  content:"";

  position:absolute;

  left:-70px;

  top:-20px;

  width:55px;

  height:330px;

  transform:
    rotate(15deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.13),
      transparent
    );

  filter:blur(3px);

  animation:
    glassSweep
    4.5s
    ease-in-out
    infinite;
}


/* برق دوم */

.body::after{

  content:"";

  position:absolute;

  right:13px;

  top:25px;

  width:4px;

  height:130px;

  border-radius:50%;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.35),
      transparent
    );

  filter:blur(1px);

  opacity:.45;
}


/* نور روی شیشه */

.shine{

  position:absolute;

  left:15px;

  top:18px;

  width:8px;

  height:200px;

  border-radius:50%;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.35),
      transparent
    );

  filter:blur(2px);

  opacity:.55;

  z-index:5;
}


/* داخل بطری */

.inside{

  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:2;
}


/* قلب‌های داخل */

.inside .heart{

  position:absolute;

  color:#ff5b87;

  font-size:var(--s);

  left:var(--x);

  bottom:var(--y);

  filter:
    drop-shadow(
      0 0 6px
      rgba(255,60,110,.45)
    );

  animation:
    tinyBeat
    1.5s
    ease-in-out
    infinite
    var(--d);
}


/* قلب‌هایی که تازه وارد بطری می‌شوند */

.inside .new-heart{

  animation:
    heartPop
    .65s
    cubic-bezier(.2,.8,.2,1)
    forwards,

    tinyBeat
    1.5s
    ease-in-out
    .65s
    infinite;
}


/* ذرات داخل بطری */

.spark{

  position:absolute;

  width:3px;

  height:3px;

  left:var(--x);

  bottom:var(--y);

  border-radius:50%;

  background:
    rgba(255,180,200,.9);

  box-shadow:
    0 0 7px
    rgba(255,100,150,.9);

  animation:
    sparkFloat
    var(--t)
    ease-in-out
    infinite
    var(--d);
}


/* =====================================================
   بارش قلب
===================================================== */

.rain-heart{

  position:absolute;

  left:var(--x);

  top:-45px;

  z-index:15;

  font-size:var(--s);

  opacity:0;

  color:#ff668f;

  filter:
    drop-shadow(
      0 0 7px
      rgba(255,60,110,.45)
    );

  animation:
    rain
    var(--t)
    cubic-bezier(.2,.68,.25,1)
    var(--delay)
    forwards;
}


/* =====================================================
   گوشی
===================================================== */

.phone{

  position:absolute;

  left:50%;

  top:50%;

  width:208px;

  height:394px;

  transform:
    translate(-50%,-50%)
    scale(.12);

  opacity:0;

  z-index:30;

  border:
    5px solid
    #272229;

  border-radius:33px;

  background:#050406;

  box-shadow:

    0 20px 70px
    rgba(0,0,0,.7),

    0 0 45px
    rgba(255,40,100,.13);

  overflow:hidden;

  /*
    مهم:
    قبلاً pointer-events:none بود
    و همین باعث می‌شد کلیک هیچ‌وقت اجرا نشود.
  */

  pointer-events:none;
}


/* زمانی که گوشی قابل لمس می‌شود */

.page.phone-ready .phone{

  pointer-events:auto;

  cursor:pointer;

  animation:
    phonePulse
    2.5s
    ease-in-out
    infinite;
}


/* ناچ */

.phone:before{

  content:"";

  position:absolute;

  top:8px;

  left:50%;

  width:72px;

  height:16px;

  transform:
    translateX(-50%);

  border-radius:
    0 0 12px 12px;

  background:#111014;

  z-index:3;
}


/* صفحه */

.screen{

  position:absolute;

  inset:7px;

  border-radius:25px;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(130,20,55,.30),
      transparent 52%
    ),
    #0b080c;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:32px 18px;

  text-align:center;
}


/* متن */

.phone-text{

  opacity:0;

  transform:
    translateY(15px);

  font-size:16px;

  line-height:2.25;

  font-weight:500;

  text-shadow:
    0 0 16px
    rgba(255,100,145,.15);
}


.phone-text .ph{

  display:block;

  margin-top:12px;

  font-size:25px;

  animation:
    tinyBeat
    1.3s
    ease-in-out
    infinite;
}


/* راهنمای لمس */

.tap-hint{

  position:absolute;

  left:50%;

  bottom:17px;

  transform:
    translateX(-50%)
    translateY(10px);

  white-space:nowrap;

  font-size:11px;

  color:
    rgba(255,190,205,.75);

  opacity:0;

  animation:
    hintIn
    .8s
    ease
    2.3s
    forwards;
}


.page.complete .tap-hint{

  display:block;
}


/* =====================================================
   پایان
===================================================== */

.page.complete .bottle{

  animation:
    bottleIntoPhone
    1.45s
    cubic-bezier(.2,.8,.2,1)
    forwards;
}


.page.complete .phone{

  animation:
    phoneIn
    1.45s
    cubic-bezier(.2,.8,.2,1)
    forwards;
}


.page.complete .phone-text{

  animation:
    textIn
    1.1s
    ease
    1.45s
    forwards;
}


.page.complete .tap-hint{

  animation:
    hintIn
    .8s
    ease
    2.3s
    forwards;
}


.page.exit{

  animation:
    exit
    .8s
    ease
    forwards;
}


/* =====================================================
   انیمیشن‌ها
===================================================== */

@keyframes fallIn{

  0%{

    opacity:0;

    top:-45px;

    transform:
      translateX(-50%)
      scale(.4);
  }

  12%{
    opacity:1;
  }

  82%{

    top:405px;

    transform:
      translateX(-50%)
      scale(1);
  }

  100%{

    opacity:0;

    top:430px;

    transform:
      translateX(-50%)
      scale(.5);
  }
}


@keyframes bottleIn{

  from{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(18px)
      scale(.93);
  }

  to{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
  }
}


@keyframes rain{

  0%{

    opacity:0;

    top:-45px;

    transform:
      translateX(0)
      rotate(0)
      scale(.65);
  }

  10%{
    opacity:1;
  }

  78%{

    opacity:1;

    top:465px;

    transform:
      translateX(var(--drift))
      rotate(260deg)
      scale(1);
  }

  100%{

    opacity:0;

    top:530px;

    transform:
      translateX(var(--drift))
      rotate(330deg)
      scale(.75);
  }
}


@keyframes bottleIntoPhone{

  0%{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(0)
      scale(1);
  }

  45%{

    opacity:1;

    transform:
      translateX(-50%)
      translateY(-28px)
      scale(.7);
  }

  100%{

    opacity:0;

    transform:
      translateX(-50%)
      translateY(0)
      scale(.15);
  }
}


@keyframes phoneIn{

  0%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.12);
  }

  45%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.34);
  }

  100%{

    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }
}


@keyframes phonePulse{

  0%,100%{

    box-shadow:
      0 20px 70px rgba(0,0,0,.7),
      0 0 45px rgba(255,40,100,.13);
  }

  50%{

    box-shadow:
      0 20px 70px rgba(0,0,0,.7),
      0 0 65px rgba(255,40,100,.25);
  }
}


@keyframes textIn{

  to{

    opacity:1;

    transform:
      translateY(0);
  }
}


@keyframes tinyBeat{

  0%,100%{
    transform:scale(1);
  }

  15%{
    transform:scale(1.16);
  }

  30%{
    transform:scale(1);
  }
}


@keyframes heartPop{

  0%{

    opacity:0;

    transform:
      translateY(20px)
      scale(.2);
  }

  65%{

    opacity:1;

    transform:
      translateY(-5px)
      scale(1.18);
  }

  100%{

    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }
}


@keyframes glow{

  0%,100%{

    opacity:.55;

    transform:scale(1);
  }

  50%{

    opacity:1;

    transform:scale(1.08);
  }
}


@keyframes bottleAura{

  0%,100%{

    opacity:.35;
    transform:
      translate(-50%,-50%)
      scale(.95);
  }

  50%{

    opacity:.8;

    transform:
      translate(-50%,-50%)
      scale(1.08);
  }
}


@keyframes sparkleFloat{

  0%,100%{

    opacity:.25;

    transform:
      translate(-50%,-50%)
      scale(.9);
  }

  50%{

    opacity:.85;

    transform:
      translate(-50%,-58%)
      scale(1.08);
  }
}


@keyframes glassSweep{

  0%{

    left:-70px;

    opacity:0;
  }

  15%{
    opacity:1;
  }

  50%{

    left:170px;

    opacity:.7;
  }

  65%,100%{

    left:190px;

    opacity:0;
  }
}


@keyframes sparkFloat{

  0%,100%{

    opacity:.15;

    transform:
      translateY(0)
      scale(.7);
  }

  50%{

    opacity:1;

    transform:
      translateY(-18px)
      scale(1.3);
  }
}


@keyframes hintIn{

  to{

    opacity:.8;

    transform:
      translateX(-50%)
      translateY(0);
  }
}


@keyframes exit{

  to{

    opacity:0;

    transform:scale(.97);

    filter:blur(5px);
  }
}


/* =====================================================
   موبایل‌های کوتاه
===================================================== */

@media(max-height:650px){

  .bottle{

    bottom:35px;

    transform:
      translateX(-50%)
      scale(.82);
  }


  .page.complete .bottle{

    animation:
      bottleIntoPhoneSmall
      1.45s
      cubic-bezier(.2,.8,.2,1)
      forwards;
  }


  @keyframes bottleIntoPhoneSmall{

    0%{

      opacity:1;

      transform:
        translateX(-50%)
        scale(.82);
    }

    45%{

      opacity:1;

      transform:
        translateX(-50%)
        translateY(-25px)
        scale(.57);
    }

    100%{

      opacity:0;

      transform:
        translateX(-50%)
        scale(.12);
    }
  }
}

</style>

</head>


<body>

<div
  class="page"
  id="page">


  <div class="stage">


    <!-- قلبی که از مرحله قبل می‌آید -->

    <div class="first-heart">
      ❤️
    </div>


    <!-- بطری -->

    <div
      class="bottle"
      id="bottle">

      <div class="neck"></div>

      <div class="rim"></div>


      <div class="body">

        <div class="shine"></div>

        <div
          class="inside"
          id="inside">
        </div>

      </div>

    </div>


    <!-- گوشی -->

    <div
      class="phone"
      id="phone">

      <div class="screen">

        <div
          class="phone-text"
          id="phoneText">

          کله‌پوک اینقدر فکر کردن نداشت،<br>

          معلومه که محمدحسین تو رو از کل دنیا بیشتر دوست داره

          <span class="ph">
            ❤️
          </span>

        </div>

      </div>


      <div class="tap-hint">
        لمس کن ❤️
      </div>

    </div>


  </div>

</div>


<script>


/* =====================================================
   عناصر
===================================================== */

const page =
  document.getElementById('page');

const inside =
  document.getElementById('inside');

const phone =
  document.getElementById('phone');


/* =====================================================
   وضعیت
===================================================== */

let active = false;

let done = false;

let lastRainEnd = 0;


/* =====================================================
   ساخت قلب داخل بطری
===================================================== */

function addInsideHeart(first = false){

  const h =
    document.createElement('span');

  h.className =
    first
      ? 'heart new-heart'
      : 'heart';

  h.textContent =
    Math.random() > .25
      ? '❤️'
      : '🩷';


  h.style.setProperty(
    '--s',
    first
      ? '24px'
      : (13 + Math.random()*15) + 'px'
  );


  h.style.setProperty(
    '--x',
    (5 + Math.random()*88) + '%'
  );


  h.style.setProperty(
    '--y',
    (2 + Math.random()*88) + '%'
  );


  h.style.setProperty(
    '--d',
    (Math.random()*1.5) + 's'
  );


  inside.appendChild(h);
}


/* =====================================================
   ذرات نور داخل بطری
===================================================== */

function addSpark(){

  const s =
    document.createElement('span');
  s.className =
    'spark';


  s.style.setProperty(
    '--x',
    (8 + Math.random()*84) + '%'
  );


  s.style.setProperty(
    '--y',
    (5 + Math.random()*80) + '%'
  );


  s.style.setProperty(
    '--t',
    (2.5 + Math.random()*3) + 's'
  );


  s.style.setProperty(
    '--d',
    (Math.random()*3) + 's'
  );


  inside.appendChild(s);
}


/* =====================================================
   بارش قلب
===================================================== */

function rain(i){

  const h =
    document.createElement('div');

  h.className =
    'rain-heart';


  h.textContent =
    Math.random() > .18
      ? '❤️'
      : '🩷';


  const delay =
    i*.13 +
    Math.random()*.35;


  const duration =
    2.45 +
    Math.random()*1.55;


  h.style.setProperty(
    '--x',
    (7 + Math.random()*86) + '%'
  );


  h.style.setProperty(
    '--s',
    (13 + Math.random()*15) + 'px'
  );


  h.style.setProperty(
    '--t',
    duration + 's'
  );


  h.style.setProperty(
    '--delay',
    delay + 's'
  );


  h.style.setProperty(
    '--drift',
    (Math.random()*55-27) + 'px'
  );


  lastRainEnd =
    Math.max(
      lastRainEnd,
      (delay + duration)*1000
    );


  document.body.appendChild(h);


  setTimeout(()=>{

    addInsideHeart();

    h.remove();

  }, (delay + duration)*1000 - 70);
}


/* =====================================================
   شروع مرحله
===================================================== */

setTimeout(()=>{


  /*
    اولین قلب داخل بطری
  */

  addInsideHeart(true);


  /*
    قلب‌های بارشی
  */

  for(let i=0; i<34; i++){

    rain(i);

  }


  /*
    ذرات نور
  */

  for(let i=0; i<14; i++){

    addSpark();

  }

},2250);


/* =====================================================
   ورود به حالت نهایی
===================================================== */

setTimeout(()=>{


  /*
    قلب‌ها و شیشه آماده‌اند
  */

  page.classList.add('complete');


  /*
    گوشی بعد از ظاهر شدن قابل لمس می‌شود
  */

  setTimeout(()=>{

    active = true;

    page.classList.add('phone-ready');

  },1500);


}, Math.max(7900, lastRainEnd + 250));


/* =====================================================
   رفتن به Stage 5
===================================================== */

function goToStage5(){

  if(!active || done)
    return;


  done = true;


  /*
    جلوگیری از لمس دوباره
  */

  page.classList.remove('phone-ready');


  /*
    خروج سینمایی
  */

  page.classList.add('exit');


  /*
    رفتن به مرحله ۵
  */

  setTimeout(()=>{

    window.location.href =
      './stage5.html';

  },800);

}


/* =====================================================
   کلیک
===================================================== */

phone.addEventListener(
  'click',
  goToStage5
);


/* =====================================================
   لمس موبایل
===================================================== */

phone.addEventListener(
  'touchend',
  function(e){

    e.preventDefault();

    goToStage5();

  },
  {passive:false}
);


/* =====================================================
   جلوگیری از دوبار اجرا شدن
===================================================== */

window.addEventListener(
  'pageshow',
  ()=>{
    done = false;
  }
);


</script>
