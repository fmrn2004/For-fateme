<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>شیشه عشق</title>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#09070a;
    color:#fff;
    font-family:"Vazirmatn",Tahoma,Arial,sans-serif;
}


/* =========================
   PAGE
========================= */

.page{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(150,20,65,.18),
            transparent 55%
        ),
        #09070a;
}

.page::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,70,120,.07),
            transparent 58%
        );

    animation:glow 5s ease-in-out infinite;
}

.stage{
    position:absolute;
    inset:0;
}


/* =========================
   HEART FROM PREVIOUS STAGE
========================= */

.first-heart{
    position:absolute;

    left:50%;
    top:-45px;

    z-index:20;

    font-size:27px;

    opacity:0;

    filter:
        drop-shadow(
            0 0 10px rgba(255,70,120,.65)
        );

    animation:
        fallIn
        2.1s
        cubic-bezier(.2,.72,.25,1)
        .35s
        forwards;
}


/* =========================
   BOTTLE
========================= */

/*
    نکته:
    این بار شیشه کاملاً استوانه‌ای است.
    گردن باریک حذف شده.
*/

.bottle{
    position:absolute;

    left:50%;

    /*
        به جای bottom از top استفاده شده
        تا بتوانیم شیشه را دقیقاً به مرکز
        گوشی منتقل کنیم.
    */

    top:calc(100% - 370px);

    width:154px;
    height:315px;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);

    opacity:0;

    z-index:10;

    cursor:default;

    animation:
        bottleIn
        1s
        ease
        1.85s
        forwards;
}


/* بدنه استوانه‌ای شیشه */

.body{
    position:absolute;

    left:50%;
    top:0;

    width:154px;
    height:315px;

    transform:translateX(-50%);

    border:
        1px solid
        rgba(255,255,255,.28);

    border-radius:38px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.045),
            rgba(255,80,130,.065),
            rgba(255,255,255,.02)
        );

    box-shadow:

        inset 12px 0 25px
        rgba(255,255,255,.025),

        inset -14px 0 30px
        rgba(255,40,100,.035),

        0 0 35px
        rgba(255,40,100,.08),

        0 15px 40px
        rgba(0,0,0,.22);

    overflow:hidden;
}


/* درخشش اصلی شیشه */

.body::before{
    content:"";

    position:absolute;

    left:12px;
    top:22px;

    width:9px;
    height:220px;

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.30),
            rgba(255,255,255,.08),
            transparent
        );

    filter:blur(2px);

    opacity:.55;

    pointer-events:none;
}


/* انعکاس سمت راست */

.body::after{
    content:"";

    position:absolute;

    right:13px;
    top:35px;

    width:5px;
    height:170px;

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    filter:blur(2px);

    opacity:.35;

    pointer-events:none;
}


/* قلب‌ها داخل شیشه */

.inside{
    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:2;
}

.inside .heart{
    position:absolute;

    color:#ff5b87;

    font-size:var(--s);

    left:var(--x);
    bottom:var(--y);

    filter:
        drop-shadow(
            0 0 6px
            rgba(255,60,110,.4)
        );

    animation:
        tinyBeat
        1.5s
        ease-in-out
        infinite
        var(--d);
}


/* =========================
   FALLING HEARTS
========================= */

.rain-heart{
    position:absolute;

    left:var(--x);
    top:-45px;

    z-index:15;

    font-size:var(--s);

    opacity:0;

    color:#ff668f;

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,60,110,.45)
        );

    animation:
        rain
        var(--t)
        cubic-bezier(.2,.68,.25,1)
        var(--delay)
        forwards;
}


/* =========================
   PHONE
========================= */

/*
    ابعاد گوشی بزرگ و شیشه‌ای
    مطابق ساختاری که برای مرحله 4.5 در نظر گرفتیم.
*/

.phone{
    position:absolute;

    left:50%;
    top:50%;

    width:min(390px,92vw);
    height:min(760px,92dvh);

    transform:
        translate(-50%,-50%)
        scale(.12);

    opacity:0;

    z-index:30;

    border:
        7px solid
        #211b21;

    border-radius:42px;

    background:#050406;

    box-shadow:

        0 25px 80px
        rgba(0,0,0,.72),

        0 0 55px
        rgba(255,40,100,.16);

    overflow:hidden;

    /*
        ابتدا گوشی قابل لمس نیست.
        وقتی complete شود پایین‌تر
        pointer-events را فعال می‌کنیم.
    */

    pointer-events:none;
}


/* قسمت Dynamic Island / Notch */

.phone::before{
    content:"";

    position:absolute;

    top:7px;
    left:50%;

    width:96px;
    height:24px;

    transform:translateX(-50%);

    border-radius:
        0 0 16px 16px;

    background:#111014;

    z-index:5;
}


/* صفحه گوشی */

.screen{
    position:absolute;

    inset:6px;

    border-radius:34px;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(130,20,55,.30),
            transparent 52%
        ),

        #0b080c;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:
        50px
        28px
        40px;

    text-align:center;

    overflow:hidden;
}


/* متن گوشی */

.phone-text{
    opacity:0;

    transform:
        translateY(18px);

    font-size:23px;

    line-height:2.05;

    font-weight:600;

    text-shadow:
        0 0 16px
        rgba(255,100,145,.15);
}

.phone-text .ph{
    display:block;

    margin-top:15px;

    font-size:34px;

    animation:
        tinyBeat
        1.3s
        ease-in-out
        infinite;
}


/* =========================
   COMPLETE STATE
========================= */

/*
    این قسمت یکی از مهم‌ترین اصلاحات است:

    وقتی شیشه تمام می‌شود،
    گوشی واقعاً قابل لمس می‌شود.
*/

.page.complete .phone{
    pointer-events:auto;

    cursor:pointer;

    animation:
        phoneIn
        2.4s
        cubic-bezier(.16,.8,.18,1)
        forwards;
}


/*
    شیشه به مرکز گوشی می‌رود.
*/

.page.complete .bottle{

    animation:
        bottleIntoPhone
        2.4s
        cubic-bezier(.16,.8,.18,1)
        forwards;
}


/*
    متن کمی بعد از ظاهر شدن گوشی
    نمایان می‌شود.
*/

.page.complete .phone-text{

    animation:
        textIn
        1.1s
        ease
        2.15s
        forwards;
}


/* =========================
   EXIT
========================= */

.page.exit{
    animation:
        exit
        .8s
        ease
        forwards;
}


/* =========================
   ANIMATIONS
========================= */


/* قلب اول */

@keyframes fallIn{

    0%{
        opacity:0;

        top:-45px;

        transform:
            translateX(-50%)
            scale(.4);
    }

    12%{
        opacity:1;
    }

    82%{
        top:405px;

        transform:
            translateX(-50%)
            scale(1);
    }

    100%{
        opacity:0;

        top:430px;

        transform:
            translateX(-50%)
            scale(.5);
    }
}


/* ظاهر شدن شیشه */

@keyframes bottleIn{

    from{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(18px)
            scale(.93);
    }

    to{
        opacity:1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}


/* بارش قلب‌ها */

@keyframes rain{

    0%{
        opacity:0;

        top:-45px;

        transform:
            translateX(0)
            rotate(0)
            scale(.65);
    }

    10%{
        opacity:1;
    }

    78%{
        opacity:1;

        top:465px;

        transform:
            translateX(var(--drift))
            rotate(260deg)
            scale(1);
    }

    100%{
        opacity:0;

        top:530px;

        transform:
            translateX(var(--drift))
            rotate(330deg)
            scale(.75);
    }
}


/*
    =========================================
    حرکت واقعی شیشه به سمت گوشی
    =========================================

    نقطه شروع:
    پایین صفحه

    مرحله اول:
    کمی بالا می‌آید

    مرحله دوم:
    کوچک می‌شود

    مرحله سوم:
    دقیقاً به مرکز صفحه می‌رسد

    مرحله آخر:
    داخل گوشی محو می‌شود
*/

@keyframes bottleIntoPhone{

    0%{

        opacity:1;

        top:calc(100% - 370px);

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }


    22%{

        opacity:1;

        top:calc(100% - 420px);

        transform:
            translateX(-50%)
            translateY(0)
            scale(.96);
    }


    45%{

        opacity:1;

        top:65%;

        transform:
            translateX(-50%)
            translateY(0)
            scale(.70);
    }


    68%{

        opacity:.95;

        top:54%;

        transform:
            translateX(-50%)
            translateY(0)
            scale(.42);
    }


    84%{

        opacity:.72;

        top:50%;

        transform:
            translateX(-50%)
            translateY(-50%)
            scale(.25);
    }


    94%{

        opacity:.35;

        top:50%;

        transform:
            translateX(-50%)
            translateY(-50%)
            scale(.12);
    }


    100%{

        opacity:0;

        top:50%;

        transform:
            translateX(-50%)
            translateY(-50%)
            scale(.02);
    }
}


/*
    ورود گوشی
*/

@keyframes phoneIn{

    0%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.12);
    }


    30%{

        opacity:.55;

        transform:
            translate(-50%,-50%)
            scale(.28);
    }


    60%{

        opacity:.9;

        transform:
            translate(-50%,-50%)
            scale(.72);
    }


    82%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.035);
    }


    92%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.985);
    }


    100%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* متن */

@keyframes textIn{

    from{

        opacity:0;

        transform:
            translateY(18px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


/* ضربان قلب */

@keyframes tinyBeat{

    0%,
    100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.16);
    }

    30%{
        transform:scale(1);
    }
}


/* نور */

@keyframes glow{

    0%,
    100%{
        opacity:.55;

        transform:
            scale(1);
    }

    50%{
        opacity:1;

        transform:
            scale(1.08);
    }
}


/* خروج */

@keyframes exit{

    to{

        opacity:0;

        transform:
            scale(.97);

        filter:
            blur(5px);
    }
}


/* =========================
   SHORT SCREENS
========================= */

@media(max-height:650px){

    .bottle{

        top:calc(100% - 330px);

        transform:
            translateX(-50%)
            scale(.82);
    }

    .page.complete .bottle{

        animation:
            bottleIntoPhoneSmall
            2.2s
            cubic-bezier(.16,.8,.18,1)
            forwards;
    }

    .phone{

        width:min(350px,92vw);
        height:min(620px,88dvh);

        border-radius:38px;
    }

    .phone::before{

        width:86px;
        height:21px;
    }

    .screen{

        border-radius:30px;

        padding:
            40px
            22px
            30px;
    }

    .phone-text{

        font-size:19px;

        line-height:2;
    }

    .phone-text .ph{

        font-size:29px;
    }
}


/* انیمیشن مخصوص صفحه کوتاه */

@keyframes bottleIntoPhoneSmall{

    0%{

        opacity:1;

        top:calc(100% - 330px);

        transform:
            translateX(-50%)
            scale(.82);
    }

    25%{

        opacity:1;

        top:calc(100% - 370px);

        transform:
            translateX(-50%)
            scale(.75);
    }

    50%{

        opacity:1;

        top:65%;

        transform:
            translateX(-50%)
            scale(.52);
    }

    72%{

        opacity:.85;

        top:53%;

        transform:
            translateX(-50%)
            scale(.30);
    }

    88%{

        opacity:.45;

        top:50%;

        transform:
            translateX(-50%)
            translateY(-50%)
            scale(.13);
    }

    100%{

        opacity:0;

        top:50%;

        transform:
            translateX(-50%)
            translateY(-50%)
            scale(.02);
    }
}

</style>
</head>


<body>

<div class="page" id="page">

    <div class="stage">


        <!-- قلب مرحله قبل -->

        <div class="first-heart">
            ❤️
        </div>


        <!-- شیشه -->

        <div
            class="bottle"
            id="bottle"
        >

            <div class="body">

                <div
                    class="inside"
                    id="inside"
                ></div>

            </div>

        </div>


        <!-- گوشی -->

        <div
            class="phone"
            id="phone"
        >

            <div class="screen">

                <div
                    class="phone-text"
                    id="phoneText"
                >
                    کله پوک اینقدر فکر کردن نداشت،
                    <br>
                    معلومه که محمدحسین تو رو از کل دنیا بیشتر دوست داره

                    <span class="ph">
                        ❤️
                    </span>

                </div>

            </div>

        </div>


    </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const page =
    document.getElementById("page");

const inside =
    document.getElementById("inside");

const phone =
    document.getElementById("phone");


let active = false;
let done = false;


/* =========================
   HEART INSIDE BOTTLE
========================= */

function addInsideHeart(first = false){

    const h =
        document.createElement("span");

    h.className = "heart";

    h.textContent = "❤️";


    h.style.setProperty(
        "--s",
        first
            ? "24px"
            : (13 + Math.random() * 15) + "px"
    );


    h.style.setProperty(
        "--x",
        (5 + Math.random() * 88) + "%"
    );


    h.style.setProperty(
        "--y",
        (2 + Math.random() * 88) + "%"
    );


    h.style.setProperty(
        "--d",
        (Math.random() * 1.5) + "s"
    );


    inside.appendChild(h);
}


/* =========================
   FALLING HEART
========================= */

function rain(i){

    const h =
        document.createElement("div");

    h.className =
        "rain-heart";


    h.textContent =
        Math.random() > .18
            ? "❤️"
            : "🩷";


    const delay =
        i * .13 +
        Math.random() * .35;


    const duration =
        2.45 +
        Math.random() * 1.55;


    h.style.setProperty(
        "--x",
        (7 + Math.random() * 86) + "%"
    );


    h.style.setProperty(
        "--s",
        (13 + Math.random() * 15) + "px"
    );


    h.style.setProperty(
        "--t",
        duration + "s"
    );


    h.style.setProperty(
        "--delay",
        delay + "s"
    );


    h.style.setProperty(
        "--drift",
        (Math.random() * 55 - 27) + "px"
    );


    document.body.appendChild(h);


    setTimeout(() => {

        addInsideHeart();

        h.remove();

    }, (delay + duration) * 1000 - 70);
}


/* =========================
   START
========================= */

/*
    قلب مرحله قبل
    و سپس بارش قلب‌ها
*/

setTimeout(() => {

    addInsideHeart(true);

    for(let i = 0; i < 34; i++){

        rain(i);
    }

}, 2250);


/*
    زمان شروع ورود شیشه به گوشی.

    آخرین قلب‌ها حدوداً تا
    این حوالی تمام شده‌اند.
*/

setTimeout(() => {

    page.classList.add("complete");

    active = true;

}, 7900);


/* =========================
   PHONE CLICK
========================= */

phone.addEventListener(
    "click",
    () => {

        /*
            تا قبل از کامل شدن
            اجازه ورود نداریم.
        */

        if(!active || done){

            return;
        }


        done = true;


        /*
            خروج نرم
        */

        page.classList.add("exit");


        /*
            اصلاح مهم:
            مرحله بعد 4.5 است
            نه stage5
        */

        setTimeout(() => {

            window.location.href =
                "stage4.5.html";

        }, 800);

    }
);

</script>

</body>
</html>
