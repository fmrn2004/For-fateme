<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>یک سؤال مهم ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap"
rel="stylesheet">

<style>

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#09070a
}

body{
  font-family:Vazirmatn,sans-serif;
  color:#fff
}

.page{

  height:100dvh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:24px;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(150,20,65,.17),
      transparent 58%
    ),
    #09070a;

  transition:
    opacity .8s,
    transform .8s,
    filter .8s
}

.page.out{

  opacity:0;

  transform:scale(.98);

  filter:blur(5px)
}

.content{

  text-align:center;

  width:min(620px,94vw)
}

.heart{

  font-size:25px;

  animation:beat 1.6s infinite;

  margin-bottom:24px
}

.question{

  font-size:clamp(19px,4.7vw,27px);

  line-height:2.2;

  margin-bottom:28px
}


/*
  این قسمت عمداً هیچ تفاوت ظاهری
  با متن اطراف ندارد.
*/

.secret{

  color:inherit;

  text-decoration:none;

  cursor:default
}

.answers{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;

  width:min(430px,90vw);

  margin:auto
}

.answer{

  border:
    1px solid rgba(255,255,255,.14);

  background:
    rgba(255,255,255,.035);

  color:#fff;

  padding:14px 10px;

  border-radius:17px;

  font:inherit;

  font-size:15px;

  cursor:pointer;

  transition:.3s
}

.answer:hover{

  background:
    rgba(255,255,255,.075);

  transform:translateY(-2px)
}

.reply{

  min-height:50px;

  margin:
    22px auto 0;

  width:min(500px,90vw);

  font-size:13px;

  line-height:2;

  color:rgba(255,255,255,.58);

  opacity:0;

  transition:opacity .6s
}

.reply.show{
  opacity:1
}

.hint{

  font-size:11px;

  color:rgba(255,255,255,.25);

  margin-top:12px;

  opacity:0;

  transition:opacity .8s
}

.hint.show{
  opacity:1
}

@keyframes beat{

  50%{
    transform:scale(1.15)
  }

}

</style>

</head>

<body>

<main class="page" id="page">

  <section class="content">

    <div class="heart">
      ❤️
    </div>

    <div class="question">

      محمدحسینِ

      <span class="secret" id="fatemeh">
        فاطمه
      </span>

      چیو بیشتر از همه‌چی دوست داره؟

    </div>


    <div class="answers">

      <button class="answer" data-a="pizza">
        🍕 پیتزا
      </button>

      <button class="answer" data-a="movies">
        🎬 فیلم و سریال
      </button>

      <button class="answer" data-a="football">
        ⚽️ فوتبال
      </button>

      <button class="answer" data-a="money">
        💰 پول
      </button>

    </div>


    <div class="reply" id="reply"></div>

    <div class="hint" id="hint">
      همیشه یه راه برای ادامه وجود داره...
    </div>

  </section>

</main>


<script>

(function(){

  const page=document.getElementById('page');

  const reply=document.getElementById('reply');

  const hint=document.getElementById('hint');

  const fatemeh=document.getElementById('fatemeh');

  let moving=false;


  const replies={

    pizza:
      'یه پیتزای خوب می‌تونه خیلی چیزا رو برای چند دقیقه از یادِ محمدحسین ببره... ولی نه، جواب این نیست 😏',

    movies:
      'ممکنه محمدحسین بگه فقط یه قسمت دیگه... و یهو ساعت چهار صبح بشه؛ ولی اینم جواب نیست 😂',

    football:
      'نود دقیقه می‌تونه کامل حواسش به بازی باشه... البته این براش همه چیز نیست 😌 اینم نه.',

    money:
      'پول خوبه، خیلی هم خوبه،اصلا به به... ولی پول همه چیز نیست ❤️'

  };


  document
    .querySelectorAll('.answer')
    .forEach(function(button){

      button.addEventListener('click',function(){

        if(moving) return;

        reply.textContent=
          replies[button.dataset.a] || '';reply.classList.add('show');

        hint.classList.add('show');

      });

    });


  fatemeh.addEventListener('click',function(){

    if(moving) return;

    moving=true;


    /*
      یک قلب از وسط صفحه بزرگ می‌شود
      و همراه با محو شدن صفحه،
      مرحله بعد باز می‌شود.
    */

    const h=document.createElement('div');

    h.textContent='❤️';


    Object.assign(
      h.style,
      {
        position:'fixed',
        left:'50%',
        top:'50%',
        fontSize:'25px',
        zIndex:20,
        transform:'translate(-50%,-50%)',
        transition:'1s ease',
        pointerEvents:'none'
      }
    );


    document.body.appendChild(h);


    requestAnimationFrame(function(){

      h.style.transform=
        'translate(-50%,-50%) scale(7)';

      h.style.opacity='0';

    });


    page.classList.add('out');


    window.setTimeout(function(){

      window.location.replace('./stage4.html');

    },800);

  });

})();

</script>

</body>
</html>
