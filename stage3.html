<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage 3</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Vazirmatn,sans-serif;background:#09070a;color:#fff;display:flex;align-items:center;justify-content:center}.glow{position:fixed;inset:-30%;background:radial-gradient(circle,rgba(150,20,60,.12),transparent 55%)}main{width:min(680px,90vw);text-align:center;transition:opacity .8s,transform .8s}.q{font-size:clamp(20px,4vw,30px);line-height:2;margin-bottom:34px}.secret{color:inherit;text-decoration:none;cursor:default}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px;margin:auto}.opt{padding:15px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.035);color:#fff;font:inherit;cursor:pointer;transition:.25s}.opt:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}.answer{min-height:72px;margin-top:28px;line-height:2;color:rgba(255,255,255,.78);opacity:0;transition:.5s}.answer.show{opacity:1}.hint{font-size:13px;color:rgba(255,255,255,.4);opacity:0;transition:.7s}.hint.show{opacity:1}.fly{position:fixed;pointer-events:none;font-size:24px;z-index:10;animation:fly .9s forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}.out{opacity:0;transform:scale(.96)}</style></head><body><div class="glow"></div><main id="main"><div class="q">محمدحسینِ <span class="secret" id="fatemeh">فاطمه</span> چیو بیشتر از همه‌چی دوست داره؟</div><div class="options"><button class="opt">🍕 پیتزا</button><button class="opt">🎬 فیلم و سریال</button><button class="opt">⚽ فوتبال</button><button class="opt">💰 پول</button></div><div class="answer" id="answer"></div><div class="hint" id="hint">هنوز یه راه برای ادامه وجود داره...</div></main><script>const answers=['یه پیتزای خوب وقتی گرسنه باشم می‌تونه خیلی چیزها رو برای چند دقیقه از یادم ببره... ولی جواب این سؤال نیست 😏','ممکنه بگم فقط یه قسمت دیگه؛ بعد یهو ساعت چهار صبح بشه! ولی اینم جواب نیست 😂','نود دقیقه می‌تونم کاملاً حواسم به بازی باشه... البته اگه تو پیام بدی، احتمالاً اول پیام تو رو چک می‌کنم 😌 ولی باز هم جواب نیست.','پول خوبه، خیلی هم خوبه 😌 ولی حتی پول هم جواب این سؤال نیست.'];document.querySelectorAll('.opt').forEach((b,i)=>b.onclick=()=>{answer.textContent=answers[i];answer.classList.add('show');hint.classList.add('show')});document.getElementById('fatemeh').onclick=()=>{const h=document.createElement('div');h.className='fly';h.textContent='❤️';h.style.left='50%';h.style.top='50%';h.style.setProperty('--x',(Math.random()*120-60)+'px');h.style.setProperty('--y',(Math.random()*-160-80)+'px');document.body.appendChild(h);document.getElementById('main').classList.add('out');setTimeout(()=>location.href='stage4.html',850)};</script></body></html>
